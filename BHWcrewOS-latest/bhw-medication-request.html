<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Medication Request — BHW Medical</title>
  <link rel="stylesheet" href="/assets/bhw-tokens.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--page-wash),var(--bg);font-size:14px}.top{background:var(--deep-grad);color:white;padding:20px}.brand{max-width:760px;margin:auto}.brand h1{margin:0;font-size:22px}.brand p{margin:5px 0 0;color:#dce8eb;font-size:12px}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}h2{margin:0 0 5px;font-size:18px}.intro{color:var(--ink-soft);font-size:12px;line-height:1.55;margin:0 0 18px}.notice{border-radius:12px;padding:12px;margin-bottom:16px;font-size:11px;line-height:1.5;background:#eef4f3}.notice.warn{background:#f8eee7;color:#70483d}.field{margin-bottom:16px}.label{display:block;font-weight:750;font-size:12px;margin-bottom:7px}.required{color:#a85846}.input{width:100%;border:1px solid #d9d5cc;border-radius:10px;padding:11px;font:500 12px/1.45 var(--sans);background:white;color:var(--ink)}textarea.input{min-height:92px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.options{display:grid;gap:7px}.option{display:flex;gap:9px;align-items:flex-start;border:1px solid #e4dfd6;background:white;border-radius:11px;padding:10px 11px;font-size:12px}.option input{margin-top:2px}.btn{width:100%;border:0;border-radius:999px;background:var(--clay-grad);color:white;padding:13px;font:750 11px var(--sans);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}.btn:disabled{opacity:.55}.status{display:none;margin:13px 0;padding:11px;border-radius:10px;font-size:12px}.status.on{display:block}.status.ok{background:#eaf2e7;color:#466243}.status.error{background:#f8e8e5;color:#7d382e}.loading{text-align:center;padding:35px;color:var(--ink-soft)}.small{font-size:10px;color:var(--ink-soft);line-height:1.5}@media(max-width:650px){.wrap{padding:12px}.card{padding:18px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><h1>BHW Medication Request</h1><p>A private message to your BHW care team</p></div></header>
  <main class="wrap" id="app"><section class="card loading">Opening your private medication request…</section></main>
  <script>
    const API='https://bhw-medication-api-343692256275.us-east4.run.app';
    const params=new URLSearchParams(location.search),assignmentId=params.get('assignment')||'',token=params.get('token')||'',app=document.getElementById('app');
    const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function render(assignment){
      document.title=`${assignment.title||'Medication Request'} — BHW Medical`;
      app.innerHTML=`<section class="card"><h2>${esc(assignment.title||'Medication request')}</h2><p class="intro">Give us the medication and pharmacy details exactly as they appear on the bottle. A staff member and prescriber will review your request.</p><div class="notice"><b>This form does not create or guarantee a prescription.</b> Do not stop, start, or change a medication unless your clinician tells you to.</div><div class="notice warn"><b>Get urgent help now when needed.</b> Call 911 for trouble breathing, swelling of the face or throat, fainting, severe chest pain, a seizure, or another emergency. Call or text 988 for a mental-health or substance-use crisis.</div><form id="requestForm">
        <div class="field"><label class="label" for="requestType">What do you need?<span class="required"> *</span></label><select class="input" id="requestType" required><option value="">Choose one</option><option value="refill">I need a refill or renewal</option><option value="pharmacy">The pharmacy is having a problem</option><option value="question">I have a medication question</option><option value="side">I may be having a side effect</option><option value="change">I want to discuss changing or stopping it</option></select></div>
        <div class="field"><label class="label" for="serviceLine">Which BHW team manages this medication?<span class="required"> *</span></label><select class="input" id="serviceLine" required><option value="">Choose one</option><option value="BHW Medical">Primary Care / BHW Medical</option><option value="Mind & Mood">Mind & Mood</option><option value="unknown">I am not sure</option></select></div>
        <div class="field"><label class="label" for="medicationName">Medication name<span class="required"> *</span></label><input class="input" id="medicationName" maxlength="160" required autocomplete="off" placeholder="Copy the name from the bottle"></div>
        <div class="row"><div class="field"><label class="label" for="strength">Strength</label><input class="input" id="strength" maxlength="80" placeholder="Example: 10 mg"></div><div class="field"><label class="label" for="directions">How do you take it?</label><input class="input" id="directions" maxlength="200" placeholder="Example: 1 tablet each morning"></div></div>
        <div class="row"><div class="field"><label class="label" for="pillsRemaining">How much is left?</label><input class="input" id="pillsRemaining" maxlength="80" placeholder="Example: 4 tablets"></div><div class="field"><label class="label" for="lastDose">When was your last dose?</label><input class="input" id="lastDose" maxlength="120" placeholder="Example: this morning"></div></div>
        <div class="field"><label class="label" for="pharmacy">Pharmacy name and location<span class="required"> *</span></label><input class="input" id="pharmacy" maxlength="240" required placeholder="Example: CVS, 123 Main Street"></div>
        <div class="field"><label class="label" for="pharmacyMessage">What did the pharmacy tell you?</label><textarea class="input" id="pharmacyMessage" maxlength="1000" placeholder="Leave blank if the pharmacy did not give you a message"></textarea></div>
        <div class="field"><label class="label" for="sideEffects">Side effects, new symptoms, or other concerns</label><textarea class="input" id="sideEffects" maxlength="1500" placeholder="Tell us what happened and when it started"></textarea></div>
        <div class="field"><label class="label" for="details">Anything else the care team should know?</label><textarea class="input" id="details" maxlength="1500"></textarea></div>
        <label class="option" style="margin-bottom:11px"><input id="sameDay" type="checkbox"><span>I believe this needs review today.</span></label>
        <label class="option" style="margin-bottom:16px"><input id="attestation" type="checkbox" required><span>I understand BHW must review this request and that submitting it does not mean a prescription was sent.<span class="required"> *</span></span></label>
        <div class="status" id="status"></div><button class="btn" id="submitButton" type="submit">Send medication request</button><p class="small">This inbox is not monitored continuously. If you may run out before BHW can respond, call the office or your pharmacy.</p>
      </form></section>`;
      document.getElementById('requestForm').addEventListener('submit',submit);
    }
    async function submit(event){event.preventDefault();const button=document.getElementById('submitButton'),status=document.getElementById('status'),requestType=document.getElementById('requestType').value,sideEffects=document.getElementById('sideEffects').value.trim(),urgentConcern=document.getElementById('sameDay').checked;button.disabled=true;status.className='status';const responses={requestType,serviceLine:document.getElementById('serviceLine').value,medicationName:document.getElementById('medicationName').value.trim(),strength:document.getElementById('strength').value.trim(),directions:document.getElementById('directions').value.trim(),pillsRemaining:document.getElementById('pillsRemaining').value.trim(),lastDose:document.getElementById('lastDose').value.trim(),pharmacy:document.getElementById('pharmacy').value.trim(),pharmacyMessage:document.getElementById('pharmacyMessage').value.trim(),sideEffects,additionalDetails:document.getElementById('details').value.trim(),prescriptionNotGuaranteed:true};try{const response=await fetch(`${API}/v1/public/content-submissions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignmentId,token,completionStatus:['side','change'].includes(requestType)?'problem':requestType==='question'?'question':'completed',responses,feedback:responses.additionalDetails,problemReported:Boolean(sideEffects)||['side','change'].includes(requestType),contactRequested:['question','side','change'].includes(requestType),urgentConcern})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||'Unable to send request');status.textContent='Your medication request was received by BHW. A prescription has not been created yet.';status.className='status on ok';button.hidden=true;event.currentTarget.querySelectorAll('input,select,textarea').forEach(input=>input.disabled=true)}catch(error){status.textContent='We could not send your request. Please try again or call the office.';status.className='status on error';button.disabled=false}}
    async function load(){if(!assignmentId||!token){app.innerHTML='<section class="card loading">This private link is incomplete. Please use the complete link sent by BHW.</section>';return}try{const response=await fetch(`${API}/v1/public/content-assignments/${encodeURIComponent(assignmentId)}?token=${encodeURIComponent(token)}`);const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Link unavailable');render(data)}catch(error){app.innerHTML='<section class="card loading">This medication-request link is unavailable, expired, or already used. Please contact BHW for a new link.</section>'}}
    load();
  </script>
</body>
</html>
