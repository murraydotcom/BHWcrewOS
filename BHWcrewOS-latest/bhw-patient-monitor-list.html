<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Monitor — crewOS</title>
<link rel="stylesheet" href="/assets/bhw-tokens.css">
<script src="/crew-provider-gate.js"></script>
<style>
@font-face{font-family:'Nunito';src:url('fonts/Nunito/Nunito-VariableFont_wght.ttf') format('truetype');font-weight:300 900;font-display:swap}
@font-face{font-family:'OpenSans';src:url('fonts/Open_Sans/OpenSans-VariableFont_wdth,wght.ttf') format('truetype');font-weight:300 800;font-display:swap}
:root{
  --ink:#233942; --ink-soft:#6c7b74; --ink-mute:#9aa7a2; --line:#e7ece9; --line-2:#eef2f0;
  --teal:#5fa9a6; --teal-lite:#84c9c4; --teal-deep:#4a8a87; --teal-ink:#356b68; --teal-quiet:#eaf4f2;
  --panel:#233942; --panel-2:#2c4650;
  --ok:#5f8a63; --ok-q:#e7efe4; --gold:#bf8a2f; --gold-q:#f7efd9; --clay:#b07a55; --clay-q:#f3e8df; --alert:#b0525a; --alert-q:#f6e2e2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat','OpenSans',system-ui,sans-serif;color:var(--ink);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;background:#dfe7e4;padding:20px}
.app{max-width:1240px;margin:0 auto;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 40px 90px -50px rgba(20,45,40,.6);border:1px solid #d8e0dd}

.top{display:flex;align-items:center;gap:14px;padding:20px 24px;border-bottom:1px solid var(--line)}
.top .mk{width:40px;height:40px;border-radius:11px;background:var(--panel);display:grid;place-items:center;flex-shrink:0}
.top h1{font-family:'Nunito';font-weight:700;font-size:20px}
.top .sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border-radius:20px;background:var(--teal-quiet);color:var(--teal-deep);display:inline-flex;align-items:center;gap:6px}
.chip .pulse{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pl 1.6s infinite}
@keyframes pl{0%,100%{opacity:.3}50%{opacity:1}}
.back{font-size:12px;font-weight:700;color:var(--ink-soft);text-decoration:none;padding:8px 14px;border:1px solid var(--line);border-radius:10px}
.back:hover{border-color:var(--teal)}

.body{padding:18px 24px 26px}
.sec-h{display:flex;align-items:center;gap:9px;margin:14px 2px 12px}
.sec-h .t{font-family:'Nunito';font-weight:700;font-size:14px}
.sec-h .n{font-size:10.5px;font-weight:800;color:#fff;background:var(--teal);min-width:20px;height:20px;padding:0 6px;border-radius:20px;display:grid;place-items:center}
.sec-h .live{margin-left:auto;font-size:10px;color:var(--ink-mute);font-weight:700}

/* checking-in cards */
.checkin{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:8px}
.ci{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;background:linear-gradient(120deg,var(--ok-q),#fff);border:1px solid #cfe0d3;border-radius:15px;padding:13px 15px;transition:transform .12s,box-shadow .12s}
.ci:hover{transform:translateY(-2px);box-shadow:0 16px 30px -20px rgba(20,45,40,.5)}
.ci .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal-deep));display:grid;place-items:center;font-family:'Nunito';font-weight:700;font-size:15px;color:#fff;flex-shrink:0}
.ci .nm{font-family:'Nunito';font-weight:700;font-size:14px}
.ci .mt{font-size:11px;color:var(--ink-soft)}
.ci .st{margin-left:auto;text-align:right;flex-shrink:0}
.ci .st .b{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ok);display:inline-flex;align-items:center;gap:5px}
.ci .st .b .d{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pl 1.6s infinite}
.ci .st .tm{font-size:10.5px;color:var(--ink-mute);margin-top:3px}

/* roster list */
.list{border:1px solid var(--line);border-radius:15px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:14px;padding:13px 16px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line-2);transition:background .1s}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--teal-quiet)}
.lrow .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--teal-lite),var(--teal));display:grid;place-items:center;font-family:'Nunito';font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.lrow .who{min-width:190px}
.lrow .who .nm{font-family:'Nunito';font-weight:700;font-size:13.5px}
.lrow .who .id{font-size:11px;color:var(--ink-mute)}
.prog{font-size:10px;font-weight:700;color:var(--teal-deep);background:var(--teal-quiet);border-radius:20px;padding:4px 10px}
.pill{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:5px 11px;border-radius:20px;white-space:nowrap}
.pill.in{background:var(--ok-q);color:var(--ok)} .pill.room{background:var(--teal-quiet);color:var(--teal-deep)}
.pill.wait{background:var(--gold-q);color:#8a6a1f} .pill.sched{background:#eef2f0;color:var(--ink-soft)} .pill.msg{background:var(--clay-q);color:var(--clay)}
.lrow .act{margin-left:auto;display:flex;align-items:center;gap:14px}
.lrow .last{font-size:11px;color:var(--ink-mute);text-align:right;min-width:80px}
.unread{font-size:10px;font-weight:800;color:#fff;background:var(--alert);min-width:20px;height:20px;padding:0 6px;border-radius:20px;display:grid;place-items:center}
.chev{color:var(--ink-mute);font-size:16px}
@media(max-width:720px){.lrow .who{min-width:0}.lrow .prog,.lrow .last{display:none}}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="mk"><svg viewBox="0 0 48 48" width="24" height="24"><path d="M10 24h5l3-7 5 15 4-11 2 4h9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div>
      <h1>Patient Monitor</h1>
      <div class="sub">Patient Registry roster with Health Core check-ins ready for clinician review. Open a patient in Patient 360 for clinical details.</div>
    </div>
    <div class="right">
      <span class="chip"><span class="pulse"></span>Live</span>
      <a class="back" href="/bhw-patient-materials.html">Materials &amp; Feedback</a>
      <a class="back" href="/bhw-front-desk.html">← Front Desk</a>
    </div>
  </div>

  <div class="body">
    <div class="sec-h"><span class="t">Check-ins awaiting clinician review</span><span class="n" id="ciN">0</span><span class="live" id="reviewMeta">references only · clinical values stay in Health Core</span></div>
    <div class="checkin" id="checkin"></div>

    <div class="sec-h"><span class="t">Monitored patients</span><span class="live" id="rosterMeta"></span></div>
    <div class="list" id="list"></div>
  </div>

</div>

<script type="module">
import { createOperationsCloudClient } from "/provider/operations-queue.mjs";

// The roster supplies identity display. The operations queue supplies only a
// patient/check-in reference and review state; clinical values stay in Health Core.
const API='/.netlify/functions/monitor-data';
const TOKEN=sessionStorage.getItem('crewos_token')||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function initials(n){return (n||'?').split(/[ ,]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function patientId(p){return String(p?.bhwPatientId||p?.mrn||p?.id||'').trim();}
function href(p){ return '/provider/patient-360.html?patient='+encodeURIComponent(patientId(p)); }
function fmtD(d){ if(!d) return ''; const t=new Date(d.slice(0,10)+'T00:00:00'); return isNaN(t)?'':t.toLocaleDateString('en-US',{month:'numeric',day:'numeric'}); }
function isToday(d){ return !!d && d.slice(0,10)===new Date().toISOString().slice(0,10); }

function programName(reference){
  const key=String(reference||'').split('-').pop();
  return ({primary:'Primary Care',mind:'Mind & Mood',charmed:'CharmEd Minds',flow:'Flow'})[key]||'Care Connect';
}
function reviewCard(request, rosterById){
  const id=patientId(request);
  const patient=rosterById.get(id)||{bhwPatientId:id,name:request.patientName||id||'Patient'};
  const submitted=request.updatedAt||request.createdAt||'';
  return `
  <a class="ci" href="${href(patient)}">
    <span class="av">${initials(patient.name)}</span>
    <div><div class="nm">${esc(patient.name)}</div><div class="mt">${esc(programName(request.sourceReference))} · ${esc(id)}</div></div>
    <div class="st"><div class="b"><span class="d"></span>Review</div><div class="tm">${esc(submitted?new Date(submitted).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Pending')}</div></div>
  </a>`; }
function rosterRow(p){
  const right = p.nextVisit ? `Next ${fmtD(p.nextVisit)}` : (p.lastVisit ? `Seen ${fmtD(p.lastVisit)}` : '—');
  return `
  <a class="lrow" href="${href(p)}">
    <span class="av">${initials(p.name)}</span>
    <div class="who"><div class="nm">${esc(p.name)}</div><div class="id">${esc(p.mrn||'')}</div></div>
    ${p.program?`<span class="prog">${esc(p.program)}</span>`:''}
    <div class="act"><span class="last">${right}</span><span class="chev">›</span></div>
  </a>`;
}

async function load(){
  const listEl=document.getElementById('list'), checkinEl=document.getElementById('checkin');
  try{
    const r=await fetch(`${API}?roster=1`,{headers:{Authorization:`Bearer ${TOKEN}`}});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'load failed');
    const roster=Array.isArray(d.patients)?d.patients:[];
    const rosterById=new Map(roster.map(p=>[patientId(p),p]).filter(([id])=>id));
    let reviews=[];
    try{
      const operations=await createOperationsCloudClient();
      if(!operations) throw new Error('operations queue unavailable');
      const requests=await operations.listPatientRequests({status:'open',serviceLine:'clinical',assignedTeam:'clinical',limit:100});
      reviews=requests.filter(request=>request.requestType==='clinical_review'&&/^\d{4}-\d{2}-\d{2}-(primary|mind|charmed|flow)$/.test(String(request.sourceReference||'')));
      document.getElementById('reviewMeta').textContent='references only · clinical values stay in Health Core';
    }catch{
      document.getElementById('reviewMeta').textContent='review queue unavailable · roster remains available';
    }
    document.getElementById('ciN').textContent=reviews.length;
    checkinEl.innerHTML = reviews.length
      ? reviews.map(request=>reviewCard(request,rosterById)).join('')
      : '<div style="color:var(--ink-mute);font-size:12px;padding:4px 2px">No Care Connect check-ins are awaiting review.</div>';
    document.getElementById('rosterMeta').textContent =
      roster.length ? `${roster.length}${d.capped?'+':''} patient${roster.length===1?'':'s'}` : '';
    listEl.innerHTML = roster.length
      ? roster.map(rosterRow).join('')
      : '<div style="color:var(--ink-mute);padding:16px">No patients are enrolled in a monitoring program yet.</div>';
  }catch(e){
    document.getElementById('ciN').textContent='0';
    checkinEl.innerHTML='<div style="color:var(--alert);padding:4px 2px">The clinician review queue is unavailable.</div>';
    listEl.innerHTML='<div style="color:var(--alert);padding:16px">Couldn’t load the roster. Reload the page.</div>';
  }
}
load();
</script>
<script type="module" src="/bhw-alert-center.mjs"></script>
</body>
</html>
