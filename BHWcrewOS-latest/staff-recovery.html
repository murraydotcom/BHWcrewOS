<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Restore CrewOS sign-in</title>
  <link rel="stylesheet" href="/assets/bhw-tokens.css">
  <style>body{font-family:system-ui,sans-serif;background:#f7f8fa;color:#182737;margin:0;padding:40px 20px}main{max-width:560px;margin:8vh auto;background:white;padding:32px;border-radius:16px;border:1px solid #dce3e8}h1{font-size:26px}p{line-height:1.6}input{display:block;margin:24px 0;max-width:100%}button,a{font:inherit}button{padding:12px 18px;border:0;border-radius:8px;background:#174c53;color:white;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap}a{color:#174c53}</style>
</head>
<body><main>
  <h1>Restore CrewOS sign-in</h1>
  <p>Select the approved staff recovery file to restore the archived staff accounts and saved PINs.</p>
  <input id="file" type="file" accept=".json,application/json" aria-label="Staff recovery file">
  <button id="restore" disabled>Restore staff sign-in</button>
  <p id="status" role="status" aria-live="polite"></p>
  <a href="/crewos?next=%2Fbhw-intel-connections.html">Open CrewOS sign-in</a>
</main><script>
const file=document.getElementById('file');
const restore=document.getElementById('restore');
const status=document.getElementById('status');
file.addEventListener('change',()=>{restore.disabled=!file.files.length;status.textContent='';});
restore.addEventListener('click',async()=>{
  restore.disabled=true;
  status.textContent='Restoring and verifying staff records…';
  try{
    const response=await fetch('/.netlify/functions/staff-export-recovery',{method:'POST',headers:{'Content-Type':'application/json'},body:await file.files[0].text()});
    const result=await response.json();
    if(!response.ok)throw new Error(result.error||'Recovery could not complete.');
    status.textContent=`Staff sign-in restored to CrewHQ Database. ${result.staffCount} records verified from the ${result.sourceDate} export. Sign in with your existing PIN. The remaining operational controls still require migration.`;
    file.value='';
  }catch(error){status.textContent=error.message;restore.disabled=false;}
});
</script></body></html>
