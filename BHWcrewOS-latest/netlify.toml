[build]
  publish = "."
  functions = "netlify/functions"

# Employee landing: the site root serves BHW HQ (the staff launchpad).
# crewOS login stays at /index.html; HQ links point there. This only affects
# the staff/employee side — it is not the public patient site.
# force = true is required: without it Netlify serves the real index.html that
# exists at "/" (crewOS) and the rewrite never fires.
#
# Side effect: Netlify treats "/" and "/index.html" as the SAME url, so the
# forced rewrite below also captures /index.html — which means links into crewOS
# can't use /index.html (they'd bounce back to HQ). crewOS is therefore reached
# at /crewos, which rewrites to the real app. Keep this rule ABOVE the "/" rule.
[[redirects]]
  from = "/crewos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/hq.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
