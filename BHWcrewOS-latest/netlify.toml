[build]
  publish = "."
  functions = "netlify/functions"

# Employee landing: the site root serves BHW HQ (the staff launchpad).
# crewOS login stays at /index.html; HQ links point there. This only affects
# the staff/employee side — it is not the public patient site.
[[redirects]]
  from = "/"
  to = "/hq.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
