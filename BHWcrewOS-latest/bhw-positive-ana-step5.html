<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="Private BHW symptoms and health-history check-in">
  <title>Symptoms &amp; History Check-in — BHW Medical</title>
  <link rel="stylesheet" href="/assets/bhw-tokens.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--page-wash),var(--bg);font-size:14px}.top{background:var(--deep-grad);color:#fff;padding:20px}.brand{max-width:820px;margin:auto}.brand h1{margin:0;font-size:22px}.brand p{margin:5px 0 0;color:#dce8eb;font-size:12px}.wrap{max-width:820px;margin:auto;padding:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}h2{margin:0 0 5px;font-size:19px}.intro{color:var(--ink-soft);font-size:12px;line-height:1.55;margin:0 0 16px}.notice{border-radius:12px;padding:12px;margin-bottom:16px;font-size:11px;line-height:1.5;background:#eef4f3}.notice.warn{background:#f8eee7;color:#70483d}.group{border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0;background:#faf9f6}.group h3{font-size:13px;margin:0 0 3px}.hint{font-size:10px;color:var(--ink-soft);margin-bottom:9px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.option{display:flex;gap:8px;align-items:flex-start;border:1px solid #e4dfd6;background:#fff;border-radius:10px;padding:9px 10px;font-size:11px;line-height:1.4}.option input{margin-top:2px;flex:0 0 auto}.attestation{margin-top:16px}.btn{width:100%;border:0;border-radius:999px;background:var(--clay-grad);color:#fff;padding:13px;font:750 11px var(--sans);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}.btn:disabled{opacity:.55}.status{display:none;margin:13px 0;padding:11px;border-radius:10px;font-size:12px}.status.on{display:block}.status.ok{background:#eaf2e7;color:#466243}.status.error{background:#f8e8e5;color:#7d382e}.loading{text-align:center;padding:35px;color:var(--ink-soft)}.small{font-size:10px;color:var(--ink-soft);line-height:1.5;margin-top:12px}@media(max-width:680px){.wrap{padding:12px}.card{padding:17px}.options{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><h1>Symptoms &amp; History Check-in</h1><p>A private form for your BHW care team</p></div></header>
  <main class="wrap" id="app"><section class="card"><h2>Patient form is not active</h2><p class="intro">This workflow is awaiting clinical release approval. This page does not load patient information or send answers. Contact your BHW care team through your usual approved channel.</p></section></main>
</body>
</html>
