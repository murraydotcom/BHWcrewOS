document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

zinc */\n\n  /* ---- Tints (derived, for hover/subtle fills) ---- */\n  --bhw-teal-tint: #e6eef2;\n  --bhw-rust-tint: #f1e6dd;\n  --bhw-sage-tint: #eef1e9;\n\n  /* ---- Semantic aliases ---- */\n  --text-body: var(--bhw-ink);\n  --text-heading: var(--bhw-teal-dark);\n  --text-on-color: var(--bhw-white);\n  --text-muted: #6b727b;\n\n  --surface-page: var(--bhw-white);\n  --surface-content: var(--bhw-cream);\n  --surface-header: var(--bhw-teal);\n  --surface-table-alt: var(--bhw-cream);\n\n  --accent: var(--bhw-rust);\n  --accent-stripe: var(--bhw-rust);\n\n  --border-subtle: var(--bhw-sand);\n  --border-footer: var(--bhw-sage);\n\n  /* ---- Information-box header colors (by intent) ---- */\n  --box-info: var(--bhw-teal-dark);   /* reason, history, plan */\n  --box-warn: var(--bhw-rust);        /* warnings, when to call, next steps */\n  --box-tip: var(--bhw-sage);         /* daily goals, pro tips */\n}\n<\u002Fstyle>\n<style>/* BHW Medical Group — Typography Tokens\n * Single family: Montserrat. Sizes are authored in pt to match the print\n * document system (1pt ≈ 1.333px on screen). Hierarchy: H1 > H2 > Body > Small. */\n:root {\n  --font-sans: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;\n\n  /* ---- Weights ---- */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium: 500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold: 700; /* @kind font */\n\n  /* ---- Type scale (print-canonical, pt) ---- */\n  --fs-h1: 21pt; /* @kind font */        /* Page title */\n  --fs-subtitle: 11pt; /* @kind font */  /* Header subtitle */\n  --fs-h2: 12.5pt; /* @kind font */      /* Section header */\n  --fs-box-header: 10.5pt; /* @kind font */\n  --fs-mono: 10.5pt; /* @kind font */    /* List/table headers on color */\n  --fs-body: 9.5pt; /* @kind font */     /* Body text */\n  --fs-table: 9pt; /* @kind font */      /* Table content + headers */\n  --fs-small: 8.5pt; /* @kind font */    /* Captions */\n  --fs-footer: 8pt; /* @kind font */     /* Footer text */\n  --fs-fineprint: 7pt; /* @kind font */  /* Disclaimers */\n\n  /* ---- Line heights ---- */\n  --lh-tight: 1.2; /* @kind font */\n  --lh-heading: 1.3; /* @kind font */\n  --lh-body: 1.4; /* @kind font */\n  --lh-mono: 1.5; /* @kind font */\n\n  /* ---- Semantic roles ---- */\n  --type-h1: var(--fw-bold) var(--fs-h1)/var(--lh-heading) var(--font-sans); /* @kind font */\n  --type-h2: var(--fw-bold) var(--fs-h2)/var(--lh-heading) var(--font-sans); /* @kind font */\n  --type-body: var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font-sans); /* @kind font */\n  --type-box-header: var(--fw-semibold) var(--fs-box-header)/var(--lh-heading) var(--font-sans); /* @kind font */\n  --type-footer: var(--fw-regular) var(--fs-footer)/var(--lh-tight) var(--font-sans); /* @kind font */\n}\n<\u002Fstyle>\n<style>/* BHW Medical Group — Spacing & Layout Tokens\n * Print-derived scale (pt) plus page geometry for Letter (8.5\" × 11\"). */\n:root {\n  /* ---- Spacing scale ---- */\n  --space-xs: 2pt;   /* fine borders, subtle dividers */\n  --space-s: 5pt;    /* table padding, tight spacing */\n  --space-m: 10pt;   /* section margins, breathing room */\n  --space-l: 14pt;   /* list indents, component gaps */\n  --space-xl: 20pt;  /* section breaks, major spacing */\n\n  /* ---- Component spacing ---- */\n  --section-space-before: 10pt; /* @kind spacing */\n  --section-space-after: 5pt; /* @kind spacing */\n  --bullet-indent: 14pt; /* @kind spacing */\n  --bullet-gap: 4pt; /* @kind spacing */\n  --box-padding: 12pt; /* @kind spacing */\n  --table-pad-x: 10pt; /* @kind spacing */\n  --table-pad-y: 5pt; /* @kind spacing */\n\n  /* ---- Page geometry (Letter) ---- */\n  --page-width: 8.5in; /* @kind spacing */\n  --page-height: 11in; /* @kind spacing */\n  --page-margin-x: 0.75in;\n  --page-margin-top: 1.75in;\n  --page-margin-bottom: 0.9in;\n  --header-height: 1.5in; /* @kind spacing */\n  --footer-height: 0.62in; /* @kind spacing */\n\n  /* ---- Radii & lines (documents are crisp, minimal rounding) ---- */\n  --radius-sm: 3px;\n  --radius-md: 5px;\n  --line-thin: 0.5pt; /* @kind spacing */\n  --line-stripe: 5pt; /* @kind spacing */\n  --line-footer: 3pt; /* @kind spacing */\n}\n<\u002Fstyle>\n<style>/* BHW Medical Group — Design System entry point.\n * Consumers link this single file. Imports only. */\n/* BHW Medical Group — Webfonts\n * Brand font: Montserrat (Regular 400, Medium 500, SemiBold 600, Bold 700, Italic 400).\n * NOTE: The brand spec references self-hosted TTF files\n * (Montserrat-Regular.ttf, -Medium.ttf, -SemiBold.ttf, -Bold.ttf, -Italic.ttf).\n * Those binaries were not provided, so we load the identical Montserrat family\n * from Google Fonts. Drop the TTFs into assets/fonts/ and swap to @font-face\n * rules for fully offline / production use. */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Montserrat';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"939151ff-5518-4f9e-a20b-393f272d8985\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Montserrat';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"bea9ff7c-9d48-49b4-aee6-c1d4d27da38f\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Montserrat';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7cf50325-af36-4b7c-a563-bb87229e52cc\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Montserrat';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"fb3a99d8-0498-4b60-9fb8-2f5f4d147941\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5 c104-0d2c-4307-ae16-fafcbc693a02\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Montserrat';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"09dd6c79-114b-4235-8d4d-06fa84c2c793\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Montserrat';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"3427a028-3232-4936-92c7-0131a3b5824c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Montserrat';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7e332fec-75d4-4663-8bc1-44b9709ab492\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* BHW Medical Group — Color Tokens\n * Warm, clinical palette: teal authority + rust warmth + earthen neutrals.\n * Every pairing in this system meets WCAG AA or better. */\n:root {\n  /* ---- Base palette ---- */\n  --bhw-teal: #80abbd;        /* Primary brand — calm, clinical */\n  --bhw-teal-dark: #5d8a9e;   /* Secondary — emphasis, headers */\n  --bhw-rust: #b07a55;        /* Accent — attention, warnings */\n  --bhw-sage: #a8b59a;        /* Soft supporting background */\n  --bhw-sand: #dcc8b1;        /* Borders, dividers */\n  --bhw-cream: #f7f5f2;       /* Warm content background */\n  --bhw-ink: #2A3038;         /* Body text, near-black */\n  --bhw-white: #ffffff;\n  --bhw-gold: #c9a15a;       /* Tier-B universal cofactor accent — magnesium & zinc */\n\n  /* ---- Tints (derived, for hover/subtle fills) ---- */\n  --bhw-teal-tint: #e6eef2;\n  --bhw-rust-tint: #f1e6dd;\n  --bhw-sage-tint: #eef1e9;\n\n  /* ---- Semantic aliases ---- */\n  --text-body: var(--bhw-ink);\n  --text-heading: var(--bhw-teal-dark);\n  --text-on-color: var(--bhw-white);\n  --text-muted: #6b727b;\n\n  --surface-page: var(--bhw-white);\n  --surface-content: var(--bhw-cream);\n  --surface-header: var(--bhw-teal);\n  --surface-table-alt: var(--bhw-cream);\n\n  --accent: var(--bhw-rust);\n  --accent-stripe: var(--bhw-rust);\n\n  --border-subtle: var(--bhw-sand);\n  --border-footer: var(--bhw-sage);\n\n  /* ---- Information-box header colors (by intent) ---- */\n  --box-info: var(--bhw-teal-dark);   /* reason, history, plan */\n  --box-warn: var(--bhw-rust);        /* warnings, when to call, next steps */\n  --box-tip: var(--bhw-sage);         /* daily goals, pro tips */\n}\n\n/* BHW Medical Group — Typography Tokens\n * Single family: Montserrat. Sizes are authored in pt to match the print\n * document system (1pt ≈ 1.333px on screen). Hierarchy: H1 > H2 > Body > Small. */\n:root {\n  --font-sans: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;\n\n  /* ---- Weights ---- */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium: 500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold: 700; /* @kind font */\n\n  /* ---- Type scale (print-canonical, pt) ---- */\n  --fs-h1: 21pt; /* @kind font */        /* Page title */\n  --fs-subtitle: 11pt; /* @kind font */  /* Header subtitle */\n  --fs-h2: 12.5pt; /* @kind font */      /* Section header */\n  --fs-box-header: 10.5pt; /* @kind font */\n  --fs-mono: 10.5pt; /* @kind font */    /* List/table headers on color */\n  --fs-body: 9.5pt; /* @kind font */     /* Body text */\n  --fs-table: 9pt; /* @kind font */      /* Table content + headers */\n  --fs-small: 8.5pt; /* @kind font */    /* Captions */\n  --fs-footer: 8pt; /* @kind font */     /* Footer text */\n  --fs-fineprint: 7pt; /* @kind font */  /* Disclaimers */\n\n  /* ---- Line heights ---- */\n  --lh-tight: 1.2; /* @kind font */\n  --lh-heading: 1.3; /* @kind font */\n  --lh-body: 1.4; /* @kind font */\n  --lh-mono: 1.5; /* @kind font */\n\n  /* ---- Semantic roles ---- */\n  --type-h1: var(--fw-bold) var(--fs-h1)/var(--lh-heading) var(--font-sans); /* @kind font */\n  --type-h2: var(--fw-bold) var(--fs-h2)/var(--lh-heading) var(--font-sans); /* @kind font */\n  --type-body: var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font-sans); /* @kind font */\n  --type-box-header: var(--fw-semibold) var(--fs-box-header)/var(--lh-heading) var(--font-sans); /* @kind font */\n  --type-footer: var(--fw-regular) var(--fs-footer)/var(--lh-tight) var(--font-sans); /* @kind font */\n}\n\n/* BHW Medical Group — Spacing & Layout Tokens\n * Print-derived scale (pt) plus page geometry for Letter (8.5\" × 11\"). */\n:root {\n  /* ---- Spacing scale ---- */\n  --space-xs: 2pt;   /* fine borders, subtle dividers */\n  --space-s: 5pt;    /* table padding, tight spacing */\n  --space-m: 10pt;   /* section margins, breathing room */\n  --space-l: 14pt;   /* list indents, component gaps */\n  --space-xl: 20pt;  /* section breaks, major spacing */\n\n  /* ---- Component spacing ---- */\n  --section-space-before: 10pt; /* @kind spacing */\n  --section-space-after: 5pt; /* @kind spacing */\n  --bullet-indent: 14pt; /* @kind spacing */\n  --bullet-gap: 4pt; /* @kind spacing */\n  --box-padding: 12pt; /* @kind spacing */\n  --table-pad-x: 10pt; /* @kind spacing */\n  --table-pad-y: 5pt; /* @kind spacing */\n\n  /* ---- Page geometry (Letter) ---- */\n  --page-width: 8.5in; /* @kind spacing */\n  --page-height: 11in; /* @kind spacing */\n  --page-margin-x: 0.75in;\n  --page-margin-top: 1.75in;\n  --page-margin-bottom: 0.9in;\n  --header-height: 1.5in; /* @kind spacing */\n  --footer-height: 0.62in; /* @kind spacing */\n\n  /* ---- Radii & lines (documents are crisp, minimal rounding) ---- */\n  --radius-sm: 3px;\n  --radius-md: 5px;\n  --line-thin: 0.5pt; /* @kind spacing */\n  --line-stripe: 5pt; /* @kind spacing */\n  --line-footer: 3pt; /* @kind spacing */\n}\n\n<\u002Fstyle>\n<script src=\"a1c1558b-e3d7-4961-affa-0763b9532b37\"><\u002Fscript>\n<style>\n  html, body { margin: 0; background: #e7e2db; }\n  a { color: var(--bhw-teal-dark); }\n  a:hover { color: var(--bhw-rust); }\n  .bhw-scroll::-webkit-scrollbar { height: 10px; }\n  .bhw-scroll::-webkit-scrollbar-thumb { background: #c9c1b6; border-radius: 6px; }\n  @media print {\n    html, body { background: #fff !important; }\n    .np { display: none !important; }\n    .sheet { box-shadow: none !important; margin: 0 !important; width: 100% !important; }\n    .panel { break-inside: avoid; page-break-inside: avoid; }\n    .panel + .panel { page-break-before: always; }\n    .bhw-scroll { overflow: visible !important; }\n    .bhwdim { opacity: 1 !important; }\n  }\n\n/* --- Native SVG diagram engine styles (replaces the broken DCLogic {{ }} renderer) --- */\n.bhw-diagram,\n.bhw-diagram * {\n  font-family: var(--font-sans);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n.bhw-node {\n  position: absolute; box-sizing: border-box; display: flex; flex-direction: column;\n  justify-content: center; padding: 6px 10px; border-radius: 5px; cursor: pointer;\n  text-align: center; transition: opacity .15s, box-shadow .15s;\n}\n.bhw-node-label { font-size: 13px; font-weight: 600; line-height: 1.3; letter-spacing: .01em; }\n.bhw-node-sub { font-size: 11px; font-weight: 500; line-height: 1.4; margin-top: 3px; letter-spacing: .01em; }\n.bhw-node-gland { background: var(--bhw-teal); color: #fff; border: 1px solid var(--bhw-teal); }\n.bhw-node-gland .bhw-node-sub { opacity: .95; }\n.bhw-node-horm { background: #fff; color: var(--bhw-teal-dark); border: 1.5px solid var(--bhw-teal-dark); }\n.bhw-node-horm .bhw-node-sub { opacity: .8; }\n.bhw-node-sensor { background: var(--bhw-sage-tint); color: #485440; border: 1px solid var(--bhw-sage); }\n.bhw-node-sensor .bhw-node-sub { opacity: .8; }\n.bhw-node-precursor { background: #efe4d2; color: var(--bhw-ink); border: 1px solid var(--bhw-sand); }\n.bhw-node-precursor .bhw-node-sub { opacity: .8; }\n.bhw-node-default, .bhw-node-target { background: var(--bhw-cream); color: var(--bhw-ink); border: 1px solid var(--bhw-sand); }\n.bhw-node-default .bhw-node-sub, .bhw-node-target .bhw-node-sub { opacity: .8; }\n\n.bhw-edge-label {\n  position: absolute; transform: translate(-50%,-50%);\n  font-size: 10.5px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; background: rgba(255,255,255,.92);\n  padding: 1px 4px; border-radius: 3px; pointer-events: none; transition: opacity .15s;\n}\n.bhw-chip {\n  box-sizing: border-box; padding: 5px 9px; border-radius: 5px; background: var(--bhw-sage-tint);\n  border: 1px dashed var(--bhw-sage); color: #485440;\n  font-size: 11px; font-weight: 600; line-height: 1.35; letter-spacing: .01em; pointer-events: none; transition: opacity .15s;\n}\n.bhw-chip-tierb {\n  background: #fbf3e3; border: 1.5px solid var(--bhw-gold); color: #6b5222;\n}\n\n/* Tier C — lifestyle / substance / medication modifier strip (master diagram) */\n.bhw-mod-panel {\n  margin-top: 4px; padding: 14px 16px; background: var(--bhw-cream); border: 1px solid var(--bhw-sand);\n  border-radius: 4px; font-family: var(--font-sans);\n}\n.bhw-mod-panel *, .bhw-mod-panel {\n  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;\n}\n.bhw-mod-panel-title { font-size: 9.5pt; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--bhw-teal-dark); margin-bottom: 8px; }\n.bhw-mod-group { margin-bottom: 8px; }\n.bhw-mod-group-title { font-size: 9pt; font-weight: 600; color: var(--bhw-ink); opacity: .7; margin-bottom: 5px; letter-spacing: .01em; }\n.bhw-mod-row { display: flex; flex-wrap: wrap; gap: 6px; }\n.bhw-mod-pill {\n  font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: .01em; color: var(--bhw-ink);\n  background: #fff; border: 1px solid var(--bhw-sand); border-radius: 20px; padding: 6px 13px; cursor: pointer;\n}\n.bhw-mod-pill.flag { border-style: dashed; border-color: var(--bhw-rust); }\n.bhw-mod-pill.active { background: var(--bhw-rust); border-color: var(--bhw-rust); color: #fff; }\n.bhw-mod-caption { margin-top: 10px; font-size: 11px; line-height: 1.55; letter-spacing: .01em; color: var(--bhw-ink); min-height: 30px; }\n\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"np\" style=\"position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:var(--bhw-ink);color:#fff;font-family:var(--font-sans)\">\n  <span style=\"font-weight:700;font-size:13px;letter-spacing:.02em\">Hormone feedback systems<\u002Fspan>\n  <span style=\"font-size:11px;opacity:.7\">Click any node to isolate its loop · click empty space to reset<\u002Fspan>\n  <div style=\"flex:1\"><\u002Fdiv>\n  <button id=\"bhw-factors-btn\" onclick=\"BHWDiagrams.toggleFactors()\" style=\"font-family:var(--font-sans);font-size:12px;font-weight:600;color:var(--bhw-ink);background:var(--bhw-sage);border:none;border-radius:5px;padding:7px 12px;cursor:pointer\">Hide outside factors<\u002Fbutton>\n  <button onclick=\"BHWDiagrams.resetHighlight()\" style=\"font-family:var(--font-sans);font-size:12px;font-weight:600;color:#fff;background:#4a5058;border:1px solid #626973;border-radius:5px;padding:7px 12px;cursor:pointer\">Reset highlight<\u002Fbutton>\n  <button onclick=\"BHWDiagrams.print()\" style=\"font-family:var(--font-sans);font-size:12px;font-weight:600;color:#fff;background:var(--bhw-rust);border:none;border-radius:5px;padding:7px 12px;cursor:pointer\">Print / Save PDF<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"display:flex;justify-content:center;padding:26px 16px 60px;font-family:var(--font-sans)\">\n<div class=\"sheet\" style=\"width:816px;background:#fff;box-shadow:0 6px 30px rgba(42,48,56,.16)\">\n\n  <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.PageHeader\" title=\"Hormone feedback systems\" subtitle=\"Regulatory loops, cofactors &amp; lab pitfalls — clinician reference\" hint-size=\"100%,120px\"><\u002Fx-import>\n\n  <div style=\"padding:22px 48px 12px\">\n    <p style=\"font-size:10.5pt;line-height:1.5;color:var(--bhw-ink);margin:0 0 16px;max-width:64ch\">\n      Each axis is drawn as a closed loop, not a list. Follow the solid arrows forward (release → secretion → effect), the dashed arrows back (negative feedback), and the sage chips inward (nutrients, lifestyle, drugs &amp; binding proteins that bend the loop). Rust notes flag the lab &amp; specimen gotchas.\n    <\u002Fp>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:20px 28px;align-items:center;padding:14px 16px;background:var(--bhw-cream);border-radius:4px;border:1px solid var(--bhw-sand)\">\n      <div style=\"display:flex;align-items:center;gap:9px\"><svg width=\"46\" height=\"12\"><line x1=\"0\" y1=\"6\" x2=\"34\" y2=\"6\" stroke=\"#5d8a9e\" stroke-width=\"2.5\"><\u002Fline><path d=\"M34 1 L44 6 L34 11 Z\" fill=\"#5d8a9e\"><\u002Fpath><\u002Fsvg><span style=\"font-size:9pt;color:var(--bhw-ink)\"><strong>Stimulates<\u002Fstrong> / secretes<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px\"><svg width=\"46\" height=\"12\"><line x1=\"0\" y1=\"6\" x2=\"38\" y2=\"6\" stroke=\"#b07a55\" stroke-width=\"2.5\" stroke-dasharray=\"6 4\"><\u002Fline><line x1=\"42\" y1=\"0\" x2=\"42\" y2=\"12\" stroke=\"#b07a55\" stroke-width=\"2.5\"><\u002Fline><\u002Fsvg><span style=\"font-size:9pt;color:var(--bhw-ink)\"><strong>Inhibits<\u002Fstrong> / negative feedback<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"display:inline-block;padding:3px 9px;background:var(--bhw-sage-tint);border:1px dashed var(--bhw-sage);border-radius:4px;font-size:8pt;color:#4f5b43;font-weight:600\">Cofactor<\u002Fspan><span style=\"font-size:9pt;color:var(--bhw-ink)\">Outside factor <strong>(+ / −)<\u002Fstrong><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"display:inline-block;width:16px;height:16px;border-radius:4px;background:var(--bhw-teal)\"><\u002Fspan><span style=\"font-size:9pt;color:var(--bhw-ink)\">Gland / source<\u002Fspan><span style=\"display:inline-block;width:16px;height:16px;border-radius:4px;background:#fff;border:1.5px solid var(--bhw-teal-dark)\"><\u002Fspan><span style=\"font-size:9pt;color:var(--bhw-ink)\">Hormone<\u002Fspan><span style=\"display:inline-block;width:16px;height:16px;border-radius:4px;background:var(--bhw-cream);border:1px solid var(--bhw-sand)\"><\u002Fspan><span style=\"font-size:9pt;color:var(--bhw-ink)\">Target / effect<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:6px 48px 40px\">\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">1 · Hypothalamic–pituitary master control<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Peptide axis<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"sage\" hint-size=\"auto,20px\">Releasing factors: portal-only, not measurable<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:430px\"><div class=\"bhw-diagram\" id=\"diagram-master\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-master\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"warn\" title=\"CLINICAL GOTCHAS &amp; LAB PITFALLS\" hint-size=\"100%,120px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>Releasing factors are invisible.<\u002Fstrong> TRH/CRH/GnRH/GHRH travel the portal system only — you measure the pituitary output, never the hypothalamic driver.<\u002Fli>\n          <li><strong>Everything pituitary is pulsatile.<\u002Fstrong> Interpret against time of day and, for gonadotropins, cycle phase; a single random level can mislead.<\u002Fli>\n          <li><strong>Prolactin is stress-sensitive.<\u002Fstrong> Venipuncture, sleep, and dopamine-blocking drugs raise it; dopamine (PIF) tonically suppresses it.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">2 · Thyroid axis<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Amine (tyrosine-derived)<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"sage\" hint-size=\"auto,20px\">T4 t½ ~7 d · nuclear receptor<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:550px\"><div class=\"bhw-diagram\" id=\"diagram-thyroid\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-thyroid\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"warn\" title=\"CLINICAL GOTCHAS &amp; LAB PITFALLS\" hint-size=\"100%,120px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>Free vs total.<\u002Fstrong> TBG shifts (estrogen, pregnancy, nephrotic loss) move total T4/T3 without changing free hormone — order free levels.<\u002Fli>\n          <li><strong>TSH is the sensitive integrator<\u002Fstrong> but lags; in central disease or non-thyroidal illness it uncouples from free T4.<\u002Fli>\n          <li><strong>Reverse T3.<\u002Fstrong> Illness, cortisol, and low selenium shunt T4 → rT3 instead of active T3 — low T3 with normal TSH.<\u002Fli>\n          <li><strong>Calcitonin<\u002Fstrong> comes from parafollicular C cells and sits outside this loop (thyroid-C-cell / MTC marker).<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">3 · Adrenal — cortisol, aldosterone &amp; medulla<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Steroid (cholesterol-derived)<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"rust\" hint-size=\"auto,20px\">Diurnal · CBG-bound<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:704px\"><div class=\"bhw-diagram\" id=\"diagram-adrenal\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-adrenal\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"warn\" title=\"CLINICAL GOTCHAS &amp; LAB PITFALLS\" hint-size=\"100%,120px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>Zone-by-zone drivers differ.<\u002Fstrong> Only fasciculata (cortisol) is ACTH-driven; glomerulosa (aldosterone) answers to RAAS + K⁺, so ACTH suppression spares aldosterone.<\u002Fli>\n          <li><strong>Time the cortisol.<\u002Fstrong> Diurnal peak is early AM, nadir at midnight — draw accordingly; late-night salivary cortisol for Cushing screen.<\u002Fli>\n          <li><strong>CBG &amp; exogenous steroids.<\u002Fstrong> Estrogen raises CBG (high total cortisol, normal free); any exogenous steroid suppresses CRH/ACTH and the whole axis.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">4 · Gonadal axis<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Steroid<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"sage\" hint-size=\"auto,20px\">SHBG sets free fraction<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:612px\"><div class=\"bhw-diagram\" id=\"diagram-gonad\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-gonad\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"warn\" title=\"CLINICAL GOTCHAS &amp; LAB PITFALLS\" hint-size=\"100%,120px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>Pulse vs continuous.<\u002Fstrong> Pulsatile GnRH sustains LH/FSH; continuous exposure (GnRH agonist) desensitizes and suppresses — the basis of chemical downregulation.<\u002Fli>\n          <li><strong>SHBG bends free testosterone.<\u002Fstrong> Insulin resistance and low estrogen drop SHBG; measure free / bioavailable T when total is borderline.<\u002Fli>\n          <li><strong>Peripheral conversion.<\u002Fstrong> Adipose aromatase (T→E2) and 5α-reductase (T→DHT) shift the effective hormone downstream of the gonad.<\u002Fli>\n          <li><strong>Inhibin B<\u002Fstrong> feeds back selectively on FSH; AMH tracks ovarian/testicular reserve, not the acute loop.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">5 · Growth / somatotropic axis<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Peptide<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"rust\" hint-size=\"auto,20px\">GH pulsatile — use IGF-1<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:468px\"><div class=\"bhw-diagram\" id=\"diagram-gh\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-gh\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"warn\" title=\"CLINICAL GOTCHAS &amp; LAB PITFALLS\" hint-size=\"100%,120px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>A random GH is near-useless.<\u002Fstrong> It is pulsatile with deep sleep and fasting peaks — use IGF-1 as the stable integrated proxy, or dynamic testing.<\u002Fli>\n          <li><strong>Dual hypothalamic control.<\u002Fstrong> GHRH drives, somatostatin brakes; IGF-1 and GH both feed back by raising somatostatin.<\u002Fli>\n          <li><strong>Metabolic gate.<\u002Fstrong> Hyperglycemia suppresses GH (basis of the glucose-suppression test in acromegaly); fasting/ghrelin and exercise raise it.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">6 · Pancreatic / glucose control<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Peptide<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"sage\" hint-size=\"auto,20px\">C-peptide = endogenous marker<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:510px\"><div class=\"bhw-diagram\" id=\"diagram-glucose\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-glucose\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"warn\" title=\"CLINICAL GOTCHAS &amp; LAB PITFALLS\" hint-size=\"100%,120px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>C-peptide splits the source.<\u002Fstrong> Secreted 1:1 with endogenous insulin — high with a sulfonylurea/insulinoma, low with exogenous insulin (factitious hypoglycemia).<\u002Fli>\n          <li><strong>Incretin effect.<\u002Fstrong> Oral glucose evokes far more insulin than IV via GLP-1/GIP — the target of incretin therapy.<\u002Fli>\n          <li><strong>Direct counter-regulation.<\u002Fstrong> The glucose–insulin–glucagon loop is fast and substrate-sensed; somatostatin brakes both islet cells.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">7 · Calcium–phosphate–bone<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Peptide + steroid (calcitriol)<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"sage\" hint-size=\"auto,20px\">Vitamin &amp; mineral substrate-dependent<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:550px\"><div class=\"bhw-diagram\" id=\"diagram-calcium\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-calcium\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"warn\" title=\"CLINICAL GOTCHAS &amp; LAB PITFALLS\" hint-size=\"100%,120px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>The vitamin-to-hormone bridge.<\u002Fstrong> 25-OH vitamin D is the substrate; PTH-driven renal 1α-hydroxylase makes active calcitriol — check 25-OH for stores, 1,25 only in specific cases.<\u002Fli>\n          <li><strong>Magnesium gates PTH.<\u002Fstrong> Low Mg blunts PTH secretion and action — a hypocalcemia that won't correct until Mg is repleted.<\u002Fli>\n          <li><strong>FGF23 &amp; phosphate.<\u002Fstrong> FGF23 lowers calcitriol and wastes phosphate — relevant in CKD-MBD.<\u002Fli>\n          <li><strong>Always interpret Ca with albumin<\u002Fstrong> (or ionized) and phosphate together.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">8 · Energy balance — adipose &amp; gut<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Peptide (adipokines / gut)<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"sage\" hint-size=\"auto,20px\">Long-term vs meal-to-meal<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:380px\"><div class=\"bhw-diagram\" id=\"diagram-energy\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"warn\" title=\"CLINICAL GOTCHAS &amp; LAB PITFALLS\" hint-size=\"100%,120px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>Leptin is a fullness signal that fails.<\u002Fstrong> It rises with fat mass but obesity brings leptin resistance — high leptin, persistent hunger.<\u002Fli>\n          <li><strong>Ghrelin vs the satiety gut peptides.<\u002Fstrong> Ghrelin (stomach) climbs pre-meal and drives hunger; GLP-1, PYY, CCK rise post-meal to stop it.<\u002Fli>\n          <li><strong>Sleep debt tips the balance<\u002Fstrong> — raises ghrelin, lowers leptin, increases intake.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">9 · Volume, pressure &amp; hematopoiesis (RAAS)<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Peptide + steroid (aldosterone)<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"rust\" hint-size=\"auto,20px\">Posture / salt / drug-sensitive<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:410px\"><div class=\"bhw-diagram\" id=\"diagram-raas\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-raas\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"warn\" title=\"CLINICAL GOTCHAS &amp; LAB PITFALLS\" hint-size=\"100%,120px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>Aldosterone:renin ratio is fragile.<\u002Fstrong> Posture, time of day, sodium intake, and K⁺ all move it — standardize collection before calling primary aldosteronism.<\u002Fli>\n          <li><strong>Drugs confound.<\u002Fstrong> ACEi/ARB, β-blockers, spironolactone, and NSAIDs each shift renin/aldosterone — account for or wash out.<\u002Fli>\n          <li><strong>ANP/BNP oppose the loop<\u002Fstrong> (natriuresis, vasodilation) and rise with volume/stretch — the heart's counter-regulatory arm. EPO answers to renal hypoxia, separately.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">10 · Circadian / pineal timing<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Amine (melatonin)<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"sage\" hint-size=\"auto,20px\">Gates the other axes<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:510px\"><div class=\"bhw-diagram\" id=\"diagram-circadian\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-circadian\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"warn\" title=\"CLINICAL GOTCHAS &amp; LAB PITFALLS\" hint-size=\"100%,120px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>Melatonin is the timekeeper, not a lever.<\u002Fstrong> Light suppresses it; it in turn phases the cortisol awakening response, GH secretion, and reproductive rhythms.<\u002Fli>\n          <li><strong>Timing is the measurement.<\u002Fstrong> The dim-light melatonin onset (DLMO) defines phase — a single random level says little.<\u002Fli>\n          <li><strong>Disruptors.<\u002Fstrong> Evening blue light, shift work, and jet lag desynchronize the SCN and every axis it gates.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <div class=\"panel\" style=\"padding-top:26px;margin-top:14px;border-top:3px solid var(--bhw-sage)\">\n      <div style=\"font-size:8pt;font-weight:700;letter-spacing:.08em;color:var(--bhw-rust);margin-bottom:4px\">PART TWO<\u002Fdiv>\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">Formation &amp; conversion pathways<\u002Fx-import>\n      <p style=\"font-size:10pt;line-height:1.5;color:var(--bhw-ink);margin:2px 0 0;max-width:64ch\">\n        These are biosynthetic maps, not feedback loops. Here a <strong>solid arrow means “converts to”<\u002Fstrong> with the enzyme named on the arrow; sage chips are the <strong>nutrients &amp; cofactors<\u002Fstrong> each step depends on. This is where the class distinctions live — steroids branch off one cholesterol backbone, the amines split from tyrosine and tryptophan, vitamin D climbs from skin to kidney, and the neurotransmitters come off single amino acids.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">A · Steroidogenesis — one backbone, every steroid<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Cholesterol-derived<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"sage\" hint-size=\"auto,20px\">3 zones: mineralo / gluco / androgen<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:558px\"><div class=\"bhw-diagram\" id=\"diagram-steroid\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-steroid\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"tip\" title=\"COFACTOR &amp; CLINICAL NOTES\" hint-size=\"100%,110px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>The rate-limiting step is cholesterol → pregnenolone<\u002Fstrong> (desmolase, StAR) — ACTH-driven, so this is where the whole cortex is switched on.<\u002Fli>\n          <li><strong>Enzyme blocks explain the syndromes.<\u002Fstrong> 21-hydroxylase deficiency shunts precursors toward androgens (17-OHP rises — the CAH screen); 11β and 17α blocks give their own patterns.<\u002Fli>\n          <li><strong>Every hydroxylation step is a CYP enzyme<\u002Fstrong> — all of them consume NADPH and O₂, and 3β-HSD needs NAD⁺. Tissue hypoxia and severe malnutrition blunt the whole cortex, not one branch.<\u002Fli>\n          <li><strong>Downstream conversion is peripheral.<\u002Fstrong> Aromatase (adipose) makes estradiol; 5α-reductase makes DHT — both act outside the gland.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">B · Tyrosine — catecholamines &amp; thyroid hormone<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Amine (tyrosine-derived)<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"sage\" hint-size=\"auto,20px\">Same precursor, two fates<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:410px\"><div class=\"bhw-diagram\" id=\"diagram-tyrosine\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-tyrosine\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"tip\" title=\"COFACTOR &amp; CLINICAL NOTES\" hint-size=\"100%,110px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>Tyrosine hydroxylase is rate-limiting<\u002Fstrong> for catecholamines and needs BH4, iron, and O₂. Downstream, DDC needs B6, DBH needs vitamin C <em>and<\u002Fem> copper, and PNMT needs SAMe as its methyl donor.<\u002Fli>\n          <li><strong>Cortisol induces PNMT<\u002Fstrong> (norepinephrine → epinephrine) — adrenal medullary epinephrine depends on the high local cortisol from the cortex.<\u002Fli>\n          <li><strong>Selenium vs stress.<\u002Fstrong> The same T4 goes to active T3 (selenium-dependent deiodinase) or to inactive reverse T3 — illness and cortisol favor rT3.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">C · Tryptophan → serotonin → melatonin<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Amine (tryptophan-derived)<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:240px\"><div class=\"bhw-diagram\" id=\"diagram-tryptophan\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-tryptophan\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"tip\" title=\"COFACTOR &amp; CLINICAL NOTES\" hint-size=\"100%,90px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>The final step is dark-gated.<\u002Fstrong> AANAT (and HIOMT) run at night under SCN drive — this is the physical link from the circadian clock to the melatonin signal.<\u002Fli>\n          <li><strong>Shared cofactors.<\u002Fstrong> BH4, B6, and SAMe (for ASMT, the last methylation) sit on this pathway too — deficiencies ripple across serotonin and the catecholamines.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">D · Vitamin D activation — skin to kidney<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Steroid (secosteroid)<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"sage\" hint-size=\"auto,20px\">The vitamin-to-hormone bridge<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:310px\"><div class=\"bhw-diagram\" id=\"diagram-vitd\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-vitd\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"tip\" title=\"COFACTOR &amp; CLINICAL NOTES\" hint-size=\"100%,90px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>Measure 25-OH-D for stores<\u002Fstrong> (the liver pool); it reflects intake + sun. Reserve 1,25 (calcitriol) for specific questions — it can be normal or high despite deficiency.<\u002Fli>\n          <li><strong>Magnesium gates both hydroxylations.<\u002Fstrong> Low magnesium can look like vitamin D resistance — repletion sometimes fixes a stubborn low 25-OH-D or low calcium.<\u002Fli>\n          <li><strong>The kidney step is regulated.<\u002Fstrong> PTH drives 1α-hydroxylase up; FGF23 turns it down — the hinge between the vitamin substrate and the active hormone.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">E · Neurotransmitters — amino acid to signal<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">Amino-acid derived<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"sage\" hint-size=\"auto,20px\">B6 sits on almost every decarboxylase<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:420px\"><div class=\"bhw-diagram\" id=\"diagram-neuro\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"bhw-mod-panel\">\n        <div class=\"bhw-mod-panel-title\">Lifestyle, substance &amp; medication modifiers<\u002Fdiv>\n        <div id=\"bhw-modifier-strip-neuro\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"tip\" title=\"COFACTOR &amp; CLINICAL NOTES\" hint-size=\"100%,110px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>B6 is the shared decarboxylase cofactor.<\u002Fstrong> GAD, HDC, DDC/AADC all need pyridoxal-5-phosphate — isoniazid (a B6 antagonist) can drop GABA synthesis enough to cause seizures, which is why pyridoxine is the antidote.<\u002Fli>\n          <li><strong>Glutamate and GABA are one step apart.<\u002Fstrong> The brain’s main excitatory and inhibitory signals share a pool; the balance, not the absolute level, is what matters.<\u002Fli>\n          <li><strong>Acetylcholine is cleared, not reuptaken.<\u002Fstrong> AChE breaks it down in the cleft — the reason cholinesterase inhibitors work in myasthenia and dementia, and why organophosphates cause cholinergic crisis.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"padding-top:20px\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.SectionHeader\" hint-size=\"auto,26px\">F · Monoamine breakdown — what the urine and plasma tests measure<\u002Fx-import>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px\">\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"teal\" hint-size=\"auto,20px\">MAO &amp; COMT<\u002Fx-import>\n        <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.Badge\" tone=\"sage\" hint-size=\"auto,20px\">Metabolite → diagnostic test<\u002Fx-import>\n      <\u002Fdiv>\n      <div class=\"bhw-scroll\" style=\"overflow-x:auto;padding:6px 0\"><div style=\"height:300px\"><div class=\"bhw-diagram\" id=\"diagram-monoclear\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{ showGotchas }}\" hint-placeholder-val=\"{{ true }}\">\n      <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.InfoBox\" intent=\"tip\" title=\"COFACTOR &amp; CLINICAL NOTES\" hint-size=\"100%,110px\">\n        <ul style=\"margin:0;padding-left:18px;line-height:1.5\">\n          <li><strong>You test the metabolite, not the hormone.<\u002Fstrong> Catecholamines are cleared in minutes; metanephrines and 5-HIAA are stable, which is why they’re the screens for pheochromocytoma and carcinoid.<\u002Fli>\n          <li><strong>COMT needs SAMe (and magnesium); MAO needs riboflavin (FAD).<\u002Fstrong> Both are methyl/flavin-dependent, so the same nutrient gaps that slow synthesis also slow clearance.<\u002Fli>\n          <li><strong>Blocking MAO is a drug interaction, not a lab artifact.<\u002Fstrong> MAOIs, linezolid, and methylene blue plus a serotonergic agent risk serotonin syndrome.<\u002Fli>\n        <\u002Ful>\n      <\u002Fx-import>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n\n  <x-import component-from-global-scope=\"BHWMedicalGroupDesignSystem_8f7981.DocFooter\" disclaimer=\"For clinician education. Physiology is simplified for study; verify assay-specific guidance locally.\" hint-size=\"100%,52px\"><\u002Fx-import>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script>\nvar BHW_HORMONE_SPECS = [{\"id\": \"master\", \"w\": 700, \"h\": 430, \"nodes\": [{\"id\": \"hypo\", \"label\": \"Hypothalamus\", \"sub\": \"TRH · CRH · GnRH · GHRH · Dopamine\", \"kind\": \"gland\", \"x\": 260, \"y\": 14, \"w\": 210, \"h\": 56}, {\"id\": \"ant\", \"label\": \"Anterior pituitary\", \"sub\": \"TSH ACTH LH FSH GH PRL\", \"kind\": \"gland\", \"x\": 260, \"y\": 150, \"w\": 210, \"h\": 56}, {\"id\": \"post\", \"label\": \"Posterior pituitary\", \"sub\": \"ADH · Oxytocin (made in hypothalamus)\", \"kind\": \"gland\", \"x\": 18, \"y\": 150, \"w\": 210, \"h\": 56}, {\"id\": \"targ\", \"label\": \"Target glands\", \"sub\": \"Thyroid · Adrenal · Gonad · Liver\", \"kind\": \"target\", \"x\": 260, \"y\": 300, \"w\": 210, \"h\": 56}], \"edges\": [{\"from\": \"hypo\", \"to\": \"ant\", \"sign\": \"+\", \"label\": \"portal\"}, {\"from\": \"hypo\", \"to\": \"post\", \"sign\": \"+\", \"label\": \"axonal\"}, {\"from\": \"ant\", \"to\": \"targ\", \"sign\": \"+\"}, {\"from\": \"targ\", \"to\": \"ant\", \"sign\": \"-\", \"curve\": 150}, {\"from\": \"targ\", \"to\": \"hypo\", \"sign\": \"-\", \"curve\": 250}], \"factors\": [{\"id\": \"stress\", \"label\": \"Stress\", \"sign\": \"+\", \"x\": 18, \"y\": 16, \"w\": 150, \"target\": \"hypo\"}, {\"id\": \"circ\", \"label\": \"Circadian / melatonin\", \"sign\": \"+\", \"x\": 18, \"y\": 66, \"w\": 160, \"target\": \"hypo\"}, {\"id\": \"dop\", \"label\": \"Dopamine agonists → ↓ prolactin\", \"sign\": \"-\", \"x\": 18, \"y\": 300, \"w\": 175, \"target\": \"ant\"}, {\"id\": \"mg-universal\", \"label\": \"Magnesium — shared cofactor, all 3 axes below\", \"sign\": \"+\", \"tier\": \"B\", \"x\": 486, \"y\": 300, \"w\": 196, \"target\": \"targ\"}, {\"id\": \"zn-universal\", \"label\": \"Zinc — shared cofactor, all 3 axes below\", \"sign\": \"+\", \"tier\": \"B\", \"x\": 486, \"y\": 344, \"w\": 196, \"target\": \"targ\"}], \"modifiers\": [{\"id\": \"alcohol\", \"group\": \"lifestyle\", \"label\": \"Alcohol\", \"targets\": [\"post\", \"targ\"], \"text\": \"↑ estrogen, ↓ testosterone downstream · suppresses ADH (diuresis) · depletes Mg, B-vitamins, zinc, folate · adds hepatic clearance burden\"}, {\"id\": \"tobacco\", \"group\": \"lifestyle\", \"label\": \"Tobacco / cigarettes\", \"targets\": [\"targ\"], \"text\": \"Promotes thyroid autoimmunity · alters SHBG and estrogen metabolism downstream\"}, {\"id\": \"nicotine\", \"group\": \"lifestyle\", \"label\": \"Nicotine\", \"targets\": [\"hypo\", \"targ\"], \"text\": \"Drives catecholamine and cortisol release — direction depends on chronicity\"}, {\"id\": \"cannabis\", \"group\": \"lifestyle\", \"label\": \"Cannabis\", \"targets\": [\"ant\", \"targ\"], \"text\": \"↓ testosterone downstream · variable effect on prolactin\"}, {\"id\": \"sleep\", \"group\": \"lifestyle\", \"label\": \"Sleep loss / shift n    var e = document.createElementNS(NS, tag);\n    for (var k in attrs) e.setAttribute(k, attrs[k]);\n    return e;\n  }\n  function div(cls, style) {\n    var d = document.createElement('div');\n    if (cls) d.className = cls;\n    if (style) d.setAttribute('style', style);\n    return d;\n  }\n  function center(n) { return { x: n.x + n.w / 2, y: n.y + n.h / 2 }; }\n  function border(n, tx, ty) {\n    var cx = n.x + n.w / 2, cy = n.y + n.h / 2;\n    var dx = tx - cx, dy = ty - cy;\n    if (dx === 0 && dy === 0) return { x: cx, y: cy };\n    var hw = n.w / 2, hh = n.h / 2;\n    var sx = dx !== 0 ? hw / Math.abs(dx) : Infinity;\n    var sy = dy !== 0 ? hh / Math.abs(dy) : Infinity;\n    var s = Math.min(sx, sy);\n    return { x: cx + dx * s, y: cy + dy * s };\n  }\n  function edgeGeom(a, b, curve) {\n    var ac = center(a), bc = center(b);\n    var s = border(a, bc.x, bc.y);\n    var t = border(b, ac.x, ac.y);\n    var dx = t.x - s.x, dy = t.y - s.y, len = Math.hypot(dx, dy) || 1;\n    var nx = -dy / len, ny = dx / len;\n    var k = curve || 0;\n    var cxp = (s.x + t.x) / 2 + nx * k;\n    var cyp = (s.y + t.y) / 2 + ny * k;\n    return { d: 'M' + s.x + ' ' + s.y + ' Q' + cxp + ' ' + cyp + ' ' + t.x + ' ' + t.y, lx: (s.x + 2 * cxp + t.x) / 4, ly: (s.y + 2 * cyp + t.y) / 4 };\n  }\n  function kindClass(kind) {\n    return 'bhw-node bhw-node-' + (kind || 'default');\n  }\n\n  function renderDiagram(container, s) {\n    container.innerHTML = '';\n    container.style.position = 'relative';\n    container.style.width = s.w + 'px';\n    container.style.height = s.h + 'px';\n\n    var active = (activeNode && activeNode.d === s.id) ? activeNode.n : null;\n    var mod = activeModifiers[s.id] || null;\n    var modTargets = null;\n    if (mod) {\n      var m = (s.modifiers || []).filter(function (x) { return x.id === mod; })[0];\n      modTargets = m ? m.targets : [];\n    }\n    var byId = {}; s.nodes.forEach(function (n) { byId[n.id] = n; });\n    var connected = {};\n    i ,122,85,.45)';\n      var l = document.createElement('div'); l.className = 'bhw-node-label'; l.textContent = n.label;\n      nd.appendChild(l);\n      if (n.sub) { var sub = document.createElement('div'); sub.className = 'bhw-node-sub'; sub.textContent = n.sub; nd.appendChild(sub); }\n      nd.addEventListener('click', function (ev) {\n        ev.stopPropagation();\n        activeNode = (activeNode && activeNode.d === s.id && activeNode.n === n.id) ? null : { d: s.id, n: n.id };\n        renderAll();\n      });\n      container.appendChild(nd);\n    });\n\n    if (showFactors) (s.factors || []).forEach(function (f) {\n      var tierB = f.tier === 'B';\n      var c = div('bhw-chip' + (tierB ? ' bhw-chip-tierb' : ''));\n      c.style.position = 'absolute'; c.style.left = f.x + 'px'; c.style.top = f.y + 'px'; c.style.width = f.w + 'px';\n      c.style.opacity = factorVis(f) ? 1 : 0.1;\n      c.textContent = (tierB ? '★ ' : '') + f.label;\n      container.appendChild(c);\n    });\n\n    labelEls.forEach(function (l) { container.appendChild(l); });\n\n    container.onclick = function () { activeNode = null; renderAll(); };\n  }\n\n  function renderModifierStrip(spec) {\n    var strip = document.getElementById('bhw-modifier-strip-' + spec.id);\n    if (!strip || !spec.modifiers || !spec.modifiers.length) return;\n    strip.innerHTML = '';\n    var active = activeModifiers[spec.id] || null;\n    ['lifestyle', 'medication'].forEach(function (grp) {\n      var items = spec.modifiers.filter(function (m) { return m.group === grp; });\n      if (!items.length) return;\n      var wrap = div('bhw-mod-group');\n      var h = document.createElement('div'); h.className = 'bhw-mod-group-title';\n      h.textContent = grp === 'lifestyle' ? 'Lifestyle & substances' : 'Medications';\n      wrap.appendChild(h);\n      var row = div('bhw-mod-row');\n      items.forEach(function (m) {\n        var btn = document.createElement('button');\n        btn.type = 'button';\n        btn.className
