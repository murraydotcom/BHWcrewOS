<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Your BHW Care Material</title>
  <link rel="stylesheet" href="/assets/bhw-tokens.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--page-wash),var(--bg);font-size:14px}.top{background:var(--deep-grad);color:white;padding:18px 24px}.brand{max-width:1240px;margin:auto;display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-weight:850}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;color:#dce8eb;margin:3px 0 0}.wrap{max-width:1240px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.doc-head{padding:15px 18px;border-bottom:1px solid var(--line)}.doc-head h2{margin:0;font-size:16px}.doc-head p{margin:4px 0 0;color:var(--ink-soft);font-size:11px}.viewer{width:100%;height:calc(100vh - 180px);min-height:620px;border:0;background:white}.response{padding:20px}.response h2{margin:0;font-size:17px}.intro{color:var(--ink-soft);font-size:11px;line-height:1.5;margin:5px 0 17px}.note{background:#eef4f3;border-radius:11px;padding:10px 11px;font-size:10px;line-height:1.5;margin-bottom:16px}.field{margin-bottom:17px}.label{display:block;font-size:12px;font-weight:750;margin-bottom:8px}.required{color:#a85846}.options{display:grid;gap:7px}.option{display:flex;align-items:flex-start;gap:8px;border:1px solid #e4dfd6;border-radius:11px;padding:10px 11px;background:white;cursor:pointer;font-size:12px}.option input{margin-top:2px}.input{width:100%;border:1px solid #d9d5cc;border-radius:10px;padding:11px;font:500 12px/1.45 var(--sans);background:white;color:var(--ink)}textarea.input{min-height:88px;resize:vertical}.btn{width:100%;border:0;border-radius:999px;background:var(--clay-grad);color:white;padding:13px;font:750 11px var(--sans);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}.btn:disabled{opacity:.55}.status{display:none;margin:12px 0;padding:11px;border-radius:10px;font-size:12px}.status.on{display:block}.status.error{background:#f8e8e5;color:#7d382e}.status.ok{background:#eaf2e7;color:#466243}.emergency{font-size:10px;color:#717873;line-height:1.5;margin-top:12px}.loading{padding:40px;text-align:center;color:var(--ink-soft)}@media(max-width:850px){.wrap{grid-template-columns:1fr;padding:12px}.viewer{height:70vh;min-height:480px}.top{padding:14px 16px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><div class="mark">BHW</div><div><h1>Baltimore Healthcare &amp; Wellness</h1><p>Your private care material and response</p></div></div></header>
  <main class="wrap" id="app"><section class="card"><div class="loading">Opening your care material…</div></section></main>
  <script>
    const API='https://bhw-medication-api-343692256275.us-east4.run.app';
    const params=new URLSearchParams(location.search),assignmentId=params.get('assignment')||'',token=params.get('token')||'',app=document.getElementById('app');
    const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const outcomeSets={
      acknowledge:[['completed','I reviewed and understand this material'],['question','I reviewed it but have a question'],['contact_requested','Please contact me']],
      feedback:[['completed','I am providing feedback'],['question','I have a question'],['problem','I had a problem'],['contact_requested','Please contact me']],
      follow_confirm:[['completed','I completed the instructions'],['unable','I could not complete the instructions'],['problem','I had a problem'],['question','I have a question'],['contact_requested','Please contact me']],
      hybrid:[['completed','I reviewed or completed this'],['question','I have a question'],['unable','I could not follow the plan'],['problem','I had a problem'],['contact_requested','Please contact me']]
    };
    function questionField(question){const choices=question.type==='yes_no'?['Yes','No']:(question.options||[]),required=question.required&&question.type!=='multi'?' required':'',star=question.required?'<span class="required"> *</span>':'';let control='';if(['yes_no','single','multi'].includes(question.type)){const type=question.type==='multi'?'checkbox':'radio';control=`<div class="options">${choices.map(choice=>`<label class="option"><input type="${type}" name="${esc(question.id)}" value="${esc(choice)}"${required}><span>${esc(choice)}</span></label>`).join('')}</div>`}else if(question.type==='scale'){control=`<div class="options">${[1,2,3,4,5].map(value=>`<label class="option"><input type="radio" name="${esc(question.id)}" value="${value}"${required}><span>${value}${value===1?' — low':value===5?' — high':''}</span></label>`).join('')}</div>`}else if(question.type==='long_text'){control=`<textarea class="input" name="${esc(question.id)}" maxlength="2000"${required}></textarea>`}else{control=`<input class="input" name="${esc(question.id)}" maxlength="500"${required}>`}return `<div class="field"><label class="label">${esc(question.label)}${star}</label>${control}</div>`}
    function render(assignment){document.title=`${assignment.title} — BHW`;const materialUrl=`${API}/v1/public/content-assignments/${encodeURIComponent(assignmentId)}/material?token=${encodeURIComponent(token)}`;const outcomes=outcomeSets[assignment.responseMode]||outcomeSets.hybrid;const outcomeField=assignment.responseMode==='fill_out'?'':`<div class="field"><span class="label">After reviewing this, what would you like BHW to know?<span class="required"> *</span></span><div class="options">${outcomes.map(([value,label])=>`<label class="option"><input type="radio" name="completionStatus" value="${value}" required><span>${esc(label)}</span></label>`).join('')}</div></div>`;app.innerHTML=`<section class="card"><div class="doc-head"><h2>${esc(assignment.title)}</h2><p>Review the complete material before sending your response.</p></div><iframe class="viewer" title="${esc(assignment.title)}" src="${materialUrl}"></iframe></section><section class="card response"><h2>Your response</h2><p class="intro">Your answers go directly to the BHW care team and stay connected to this material.</p><div class="note">This response inbox is not monitored continuously. Do not use it for an emergency.</div><form id="responseForm">${outcomeField}${(assignment.questions||[]).map(questionField).join('')}<div class="field"><label class="label" for="feedback">Additional feedback or question</label><textarea class="input" id="feedback" name="feedback" maxlength="4000"></textarea></div><label class="option" style="margin-bottom:14px"><input type="checkbox" name="urgentConcern"><span>I believe this concern needs review today</span></label><div class="status" id="status"></div><button class="btn" id="submitButton" type="submit">Send response to BHW</button><div class="emergency">For a medical emergency, call 911. For a mental health or substance-use crisis, call or text 988.</div></form></section>`;document.getElementById('responseForm').addEventListener('submit',event=>submit(event,assignment))}
    async function submit(event,assignment){event.preventDefault();const form=event.currentTarget,data=new FormData(form),responses={},button=document.getElementById('submitButton'),status=document.getElementById('status');for(const question of assignment.questions||[]){const value=question.type==='multi'?data.getAll(question.id):data.get(question.id);if(question.required&&question.type==='multi'&&!value.length){status.textContent=`Please answer: ${question.label}`;status.className='status on error';return}responses[question.id]=value}button.disabled=true;status.className='status';try{const response=await fetch(`${API}/v1/public/content-submissions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignmentId,token,completionStatus:data.get('completionStatus')||'completed',responses,feedback:data.get('feedback')||'',urgentConcern:data.get('urgentConcern')==='on'})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Unable to send response');status.textContent='Your response was received by BHW.';status.className='status on ok';button.hidden=true;form.querySelectorAll('input,textarea').forEach(input=>input.disabled=true)}catch(error){status.textContent='We could not send your response. Please try again or contact the office.';status.className='status on error';button.disabled=false}}
    async function load(){if(!assignmentId||!token){app.innerHTML='<section class="card"><div class="loading">This private link is incomplete. Please use the complete link sent by BHW.</div></section>';return}try{const response=await fetch(`${API}/v1/public/content-assignments/${encodeURIComponent(assignmentId)}?token=${encodeURIComponent(token)}`);const data=await response.json();if(!response.ok)throw new Error(data.error||'Link unavailable');render(data)}catch(error){app.innerHTML='<section class="card"><div class="loading">This care-material link is unavailable or has expired. Please contact BHW for a new link.</div></section>'}}
    load();
  </script>
</body>
</html>
