<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>BHWcrewOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec; --card:#fffdf9; --ink:#2e3d45; --ink-soft:#7a7f78; --deep:#2f4551;
  --blue:#80abbd; --clay:#b07a55; --clay-deep:#8f5c3d; --sage:#a8b59a; --sand:#dcc8b1; --teal:#5FA9A6;
  --line:#e9e2d4; --ok:#6f8f6a; --warn:#b07a55; --alert:#a85846;
  --pc-primary:#80abbd; --pc-charmed:#d9b45f; --pc-mind:#b07a55; --pc-porter:#8a6d5c; --pc-chronic:#a8b59a; --pc-flow:#5FA9A6; --pc-admin:#2f4551;
  --radius:18px; --shadow:0 10px 34px -14px rgba(47,69,81,.22), 0 2px 8px rgba(47,69,81,.05);
  --clay-grad:linear-gradient(120deg,#c68e63,#8f5c3d);
}
*{box-sizing:border-box;margin:0;padding:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
body{font-family:'Montserrat',sans-serif;background:
  radial-gradient(1200px 500px at 85% -10%, rgba(128,171,189,.13), transparent 60%),
  radial-gradient(900px 420px at -10% 110%, rgba(220,200,177,.28), transparent 55%),
  var(--bg);
  color:var(--ink);font-size:15px;line-height:1.6}
button{font-family:inherit;cursor:pointer}
select,input,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
:focus-visible{outline:3px solid var(--sand);outline-offset:2px;border-radius:8px}

/* ---- Login ---- */
#login{position:fixed;inset:0;background:
  radial-gradient(900px 600px at 20% 15%, rgba(128,171,189,.5), transparent 55%),
  linear-gradient(158deg,#3a5a68 0%,#2f4551 55%,#26383f 100%);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.login-card{background:var(--card);border-radius:22px;padding:46px 38px;max-width:410px;width:100%;
  border:1px solid rgba(220,200,177,.7);box-shadow:0 30px 80px -20px rgba(20,32,38,.5)}
.login-card .mark{font-weight:600;letter-spacing:.34em;font-size:10.5px;color:var(--clay-deep);text-transform:uppercase;text-align:center}
.login-card h1{font-size:30px;font-weight:300;letter-spacing:.01em;text-align:center;margin:10px 0 4px}
.login-card h1 b{font-weight:800}
.login-card h1 .os{color:var(--clay-deep);font-weight:800}
.login-card p{color:var(--ink-soft);font-size:13px;text-align:center;margin-bottom:24px}
.login-card label{display:block;font-size:10.5px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.22em}
.login-card select,.login-card input{width:100%;padding:14px 15px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.login-card select:focus,.login-card input:focus{border-color:var(--blue);outline:none}
.login-card input{text-align:center;letter-spacing:.3em;font-size:18px}
.login-card button{width:100%;margin-top:22px;padding:15px;background:var(--clay-grad);color:#fff;border:none;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 10px 24px -10px rgba(143,92,61,.65);transition:transform .15s ease, box-shadow .15s ease}
.login-card button:hover{transform:translateY(-1px);box-shadow:0 14px 28px -10px rgba(143,92,61,.7)}
.login-err{color:var(--alert);font-size:13px;min-height:18px;margin-top:12px;text-align:center}

/* ---- Shell ---- */
#app{display:none}
header.top{background:linear-gradient(120deg,#33505e,#2f4551 65%);color:#eef3f4;padding:0 22px}
.top-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;height:66px}
.wordmark{font-weight:300;font-size:18px;letter-spacing:.03em;white-space:nowrap;color:#f4f7f7}
.wordmark b{font-weight:800}
.wordmark .os{color:var(--sand);font-weight:800}
.whoami{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#a9c2cc;border-left:1px solid rgba(220,200,177,.35);padding-left:16px}
.top-right{margin-left:auto;display:flex;gap:9px;align-items:center}
.btn-ghost{background:rgba(244,247,247,.07);border:1px solid rgba(220,200,177,.4);color:#e9eef0;padding:8px 16px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;transition:background .15s ease}
.btn-ghost:hover{background:rgba(220,200,177,.22);border-color:var(--sand)}
.gold-rule{height:2px;background:linear-gradient(90deg,#c68e63,#8f5c3d 190px,rgba(220,200,177,.5) 190px,rgba(220,200,177,0) 100%)}
main{max-width:1240px;margin:0 auto;padding:30px 22px 100px;display:grid;grid-template-columns:238px 1fr;gap:30px}

nav.rail{position:sticky;top:22px;align-self:start;display:flex;flex-direction:column;gap:4px}
.rail-label{font-size:10px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft);padding:14px 14px 6px}
.tab{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid transparent;padding:13px 14px;border-radius:14px;font-size:13.5px;font-weight:600;color:var(--ink);transition:background .15s ease}
.tab .spine{width:3px;height:24px;border-radius:3px;background:var(--spine,var(--line));flex:none}
.tab:hover{background:rgba(255,253,249,.85)}
.tab.active{background:var(--card);border-color:rgba(220,200,177,.65);box-shadow:var(--shadow)}
.tab .badge{margin-left:auto;font-size:10.5px;font-weight:800;color:#fff;background:var(--alert);border-radius:20px;padding:2px 8px;min-width:22px;text-align:center}
.tab .badge:empty{display:none}

/* ---- Cards & KPIs ---- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(220,200,177,.55);padding:18px 20px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--kc,var(--sand))}
.kpi .n{font-size:32px;font-weight:300;letter-spacing:-.01em;line-height:1.05}
.kpi .l{font-size:10.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-top:7px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(220,200,177,.55);padding:24px 26px;margin-bottom:22px}
.card h2{font-size:15px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .grow{flex:1}
.card .lede{font-size:12.5px;color:var(--ink-soft);margin:6px 0 16px}
.prog-head{display:flex;gap:16px;margin-bottom:22px;align-items:flex-start}
.prog-head .bar{width:4px;border-radius:4px;background:linear-gradient(var(--pc),transparent);align-self:stretch}
.prog-head h1{font-size:27px;font-weight:300;letter-spacing:-.01em}
.prog-head h1::after{content:"";display:block;width:52px;height:2px;margin-top:8px;background:var(--clay-grad);border-radius:2px}
.prog-head p{font-size:13px;color:var(--ink-soft);margin-top:9px;max-width:620px}
.btn{background:var(--deep);color:#fff;border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;transition:transform .15s ease,opacity .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn.sec{background:transparent;color:var(--deep);border:1.5px solid var(--sand)}
.btn.sec:hover{background:rgba(220,200,177,.22)}
.btn.sm{padding:7px 14px;font-size:11px}
.btn.warn{background:var(--clay-grad)}
.btn:disabled{opacity:.5;cursor:default;transform:none}

/* ---- Inbox cards ---- */
.inbox{display:flex;flex-direction:column;gap:12px}
.hcard{border:1px solid var(--line);border-left:4px solid var(--alert);border-radius:14px;padding:15px 17px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#fffdf9,#fdfaf4)}
.hcard.ack{border-left-color:var(--clay)}
.hcard.sched{border-left-color:var(--blue)}
.hcard .h-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hcard b{font-size:14px}
.hcard .meta{font-size:12px;color:var(--ink-soft)}
.hcard .sum{font-size:13px;background:rgba(220,200,177,.16);border:1px solid rgba(220,200,177,.4);border-radius:10px;padding:10px 13px}
.hcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}

/* ---- Tables ---- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
th{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:10px 12px;border-bottom:1px solid var(--sand);font-weight:700}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(220,200,177,.1)}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:rgba(168,181,154,.22);color:#5c7a56;border-color:rgba(168,181,154,.5)}
.pill.warn{background:rgba(176,122,85,.14);color:#96603f;border-color:rgba(176,122,85,.4)}
.pill.alert{background:rgba(168,88,70,.12);color:var(--alert);border-color:rgba(168,88,70,.35)}
.pill.info{background:rgba(128,171,189,.16);color:#4a7387;border-color:rgba(128,171,189,.45)}
.pill.gray{background:rgba(122,127,120,.1);color:var(--ink-soft);border-color:var(--line)}

/* ---- Forms / modal ---- */
#modal{position:fixed;inset:0;background:rgba(38,56,63,.6);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:90;padding:22px;overflow-y:auto}
#modal.open{display:flex}
.mcard{background:var(--card);border-radius:20px;border:1px solid rgba(220,200,177,.7);padding:28px;max-width:530px;width:100%;margin-top:4vh;box-shadow:0 40px 90px -30px rgba(20,32,38,.55)}
.mcard h3{font-size:20px;font-weight:300}
.mcard h3::after{content:"";display:block;width:44px;height:2px;margin-top:7px;background:var(--clay-grad);border-radius:2px}
.mcard .msub{font-size:12.5px;color:var(--ink-soft);margin:10px 0 14px}
.f label{display:block;font-size:10px;font-weight:700;color:var(--ink-soft);margin:13px 0 5px;text-transform:uppercase;letter-spacing:.2em}
.f select,.f input,.f textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff}
.f select:focus,.f input:focus,.f textarea:focus{border-color:var(--blue);outline:none}
.f textarea{min-height:88px;resize:vertical}
.f .row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.macts{display:flex;gap:10px;margin-top:22px;justify-content:flex-end}
.ferr{color:var(--alert);font-size:12.5px;min-height:17px;margin-top:8px}
.needs{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.chip{border:1.5px solid var(--sand);border-radius:999px;padding:7px 15px;font-size:12px;font-weight:600;background:#fff;transition:background .15s ease}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:13px 24px;border-radius:999px;font-weight:600;font-size:13px;letter-spacing:.03em;display:none;z-index:95;max-width:92vw;box-shadow:0 16px 40px -14px rgba(20,32,38,.6)}
.res-cat{font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--clay-deep);margin:16px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--sand)}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
a.res{display:block;border:1px solid var(--line);border-radius:12px;padding:13px 15px;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px;line-height:1.4;background:linear-gradient(180deg,#fffdf9,#fdfaf4);transition:border-color .15s ease, transform .15s ease;position:relative}
a.res:hover{border-color:var(--blue);transform:translateY(-1px)}
a.res span{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:500;margin-top:4px}
a.res.pin{border-color:rgba(176,122,85,.5)}
a.res .star{color:var(--clay);margin-right:6px}
#np-overlay{position:fixed;inset:0;background:rgba(24,32,38,.45);display:none;align-items:center;justify-content:center;z-index:300;padding:18px}
#np-overlay.open{display:flex}
#np-overlay .mcard{background:#fff;border-radius:18px;padding:22px 24px;max-height:88vh;overflow-y:auto;width:100%;box-shadow:0 24px 60px rgba(15,20,26,.25)}
.tsk{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px;line-height:1.45;transition:background .12s ease}
.tsk:hover{background:rgba(128,171,189,.08)}
.tsk-box{flex:0 0 auto;width:19px;height:19px;border:1.5px solid var(--sand);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;margin-top:1px;background:#fff}
.tsk.on .tsk-box{background:var(--sage);border-color:var(--sage)}
.tsk.on span:last-child{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:rgba(51,66,74,.35)}
.awv-bar{display:flex;gap:8px;margin:14px 0 6px}
.awv-step{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--sand);background:#fff;font-weight:800;font-size:13px;color:var(--ink-soft);font-family:inherit}
.awv-step.has{border-color:var(--sage);color:var(--ink)}
.awv-step.on{background:var(--deep);border-color:var(--deep);color:#fff}
.awv-body{max-height:56vh;overflow-y:auto;padding-right:6px;margin-top:4px}
.awv-q{margin:12px 0}
.awv-l{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
.awv-q input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.empty{color:var(--ink-soft);font-size:13px;padding:8px 2px}
.view{display:none}.view.active{display:block}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-title{font-size:15px;font-weight:800;letter-spacing:.02em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding:4px 0}
.cal-cell{min-height:78px;border:1px solid var(--line);border-radius:10px;padding:6px 7px;cursor:pointer;background:#fffdf9;transition:border-color .15s ease}
.cal-cell:hover{border-color:var(--blue)}
.cal-cell.cal-empty{border:none;background:transparent;cursor:default}
.cal-cell.cal-today{border-color:var(--clay);background:linear-gradient(180deg,#fffaf3,#fdf5e9)}
.cal-daynum{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-bottom:4px}
.cal-cell.cal-today .cal-daynum{color:var(--clay-deep)}
.cal-evt{font-size:10.5px;font-weight:600;color:var(--ink);background:rgba(220,200,177,.25);border-left:2.5px solid var(--dc,var(--sand));border-radius:4px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-more{font-size:10px;color:var(--ink-soft);font-weight:700}
@media (max-width:900px){ .cal-cell{min-height:56px} .cal-evt{font-size:9.5px} }
@media (max-width:900px){
  main{grid-template-columns:1fr;padding:18px 14px 84px;gap:20px}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .rail-label{display:none}
  .tab{flex:none;background:var(--card);border-color:rgba(220,200,177,.6);box-shadow:var(--shadow);padding:11px 15px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .whoami{display:none}
  .kpi .n{font-size:27px}
  .prog-head h1{font-size:23px}
}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <img src="assets/bhw-medical-logo.png" alt="BHW Medical" style="display:block;width:78%;max-width:280px;margin:0 auto 14px">
    <h1 style="font-size:24px">BHW<b>crew</b><span class="os">OS</span></h1>
    <p>Internal operations. Sign in with your name and PIN.</p>
    <label for="loginStaff">I am</label>
    <select id="loginStaff"><option value="">Loading team…</option></select>
    <label for="loginPin">PIN</label>
    <input id="loginPin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <button onclick="doLogin()">Sign in</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="app">
<header class="top"><div class="top-inner">
  <svg class="mark-circles" width="34" height="34" viewBox="0 0 100 100" aria-hidden="true" style="flex:none">
<g fill="none" stroke-linecap="round">
<circle cx="38" cy="30" r="22" stroke="#dcc8b1" stroke-width="3.4" stroke-dasharray="126 12" transform="rotate(-35 38 30)"/>
<circle cx="58" cy="52" r="28" stroke="#a8b59a" stroke-width="3.8" stroke-dasharray="162 14" transform="rotate(80 58 52)"/>
<circle cx="30" cy="70" r="20" stroke="#80abbd" stroke-width="3.2" stroke-dasharray="114 12" transform="rotate(150 30 70)"/>
</g></svg>
  <div class="wordmark">BHW<b>crew</b><span class="os">OS</span></div>
  <div class="whoami" id="whoami"></div><button class="btn sm" style="margin-left:10px;background:rgba(244,247,247,.12);color:#f4f7f7;border:1.5px solid var(--sand)" onclick="openNewPatient()">＋ Patient</button>
  <div class="top-right">
    <button class="btn-ghost" onclick="refresh()">Refresh</button>
    <button class="btn-ghost" onclick="logout()">Sign out</button>
  </div>
</div></header>
<div class="gold-rule"></div>
<main>
  <nav class="rail" id="rail" aria-label="Pages"></nav>
  <div id="views"></div>
</main>
</div>

<div id="modal" role="dialog" aria-modal="true"><div class="mcard" id="mcard"></div></div>
<div id="toast" role="status"></div>

<script>
/* ============ BHWcrewOS front end ============ */
const API_AUTH = "/.netlify/functions/auth";
const API_DATA = "/.netlify/functions/ops-data";
const API_ACT  = "/.netlify/functions/action";
const API_REFTPL = "/.netlify/functions/referral-templates";
const API_GAPS = "/.netlify/functions/care-gaps";
let REF_TEMPLATES = null; // lazy-loaded cache of destination referral templates

const DIV_COLORS = {
  "Primary Care":"var(--pc-primary)", "CharmEd Minds":"var(--pc-charmed)",
  "Mind & Mood Recovery":"var(--pc-mind)", "The Porter House":"var(--pc-porter)",
  "Care Management":"var(--pc-chronic)", "Flow":"var(--pc-flow)", "Admin Master":"var(--pc-admin)"
};
const DIV_BLURBS = {
  "Primary Care":"Panel care, referrals out, and warm handoffs across BHW.",
  "CharmEd Minds":"Lifespan cognition and brain health — confidence through cognition and education.",
  "Mind & Mood Recovery":"Behavioral health and the Pathway to the Sunrise program.",
  "The Porter House":"Behavioral health transition housing — 2nd floor residents and coordination.",
  "Care Management":"APCM, CCM, RPM, BHI, CoCM, and care coordination.",
  "Flow":"Vascular stabilization referral pathway (Room 4).",
  "Admin Master":"Whole-circle view: every division, every referral, the full schedule."
};
const SERVICES = ["Individual Therapy","Counseling","Med Management","Family Therapy","Group","Flow — Vascular Stabilization","CharmEd Session","Pediatric Visit","Sensory/Family Exam","Primary Care Visit","AWV/Physical","GYN","Intake","Biopsychosocial","Warm Handoff Meeting","1:1 Coordination","Case Mgmt Meeting","Staff Meeting","Training","Workshop","Cohort Session","Event","Nutrition Education","Admin Block"];
const PROGRAMS = ["APCM","CCM","RPM","BHI","CoCM","Care Coordination"];
const ACTIVITIES = ["Phone call","Care plan","Coordination","Device review","Chart review","Outreach"];
const NEEDS = ["Consultation","Biopsychosocial","Intake","Med Eval"];
const DEVICES = ["BP cuff","Pulse ox","Glucometer","Scale"];

let TOKEN = sessionStorage.getItem("crewos_token") || "";
let D = null; // data payload

/* ---------- helpers ---------- */
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none", 2600); }
function pill(text, cls){ return `<span class="pill ${cls}">${esc(text)}</span>`; }
function statusPill(s){
  const map={"Sent":"warn","Received":"info","In Progress":"warn","Completed":"ok","Declined/Redirect":"alert","New":"alert","Acknowledged":"warn","Scheduled":"info","Cancelled":"alert","Urgent":"alert","Routine":"gray"};
  return pill(s, map[s]||"gray");
}
const patLabel = id => (D && D.patientLabel[id]) || "—";
const staffLabel = id => (D && D.staffName[id]) || "—";

async function api(url, body){
  const res = await fetch(url, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type":"application/json", ...(TOKEN?{Authorization:`Bearer ${TOKEN}`}:{}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(()=>({error:"Server error"}));
  if(res.status===401){ logout(); throw new Error("Signed out"); }
  if(!res.ok) throw new Error(data.error||"Request failed");
  return data;
}

(async function initRoster(){

async function doLogin(){
  const staffId = document.getElementById("loginStaff").value;
  const pin = document.getElementById("loginPin").value.trim();
  const err = document.getElementById("loginErr");
  err.textContent = "";
  try{
    const res = await fetch(API_AUTH,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",staffId,pin})});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error||"Sign-in failed");
    TOKEN = data.token; sessionStorage.setItem("crewos_token",TOKEN);
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    await refresh();
  }catch(e){ err.textContent = e.message; }
}
document.getElementById("loginPin").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
function logout(){ TOKEN=""; sessionStorage.removeItem("crewos_token"); location.reload(); }

async function refresh(){
  D = await api(API_DATA);

  const me = (D.staff||[]).find(s=>s.id===D.user.staffId); D.user.roleHint = me ? me.role : "";

function checkEmbeds(){
  document.querySelectorAll("iframe[data-fb]").forEach(function(f){
    var fb=document.getElementById(f.dataset.fb);
    if(!fb) return;
    var verdict=function(){
      var ok=false;
      try{ ok = !!(f.contentDocument && f.contentDocument.body && f.contentDocument.body.children.length); }catch(err){ ok=false; }
      if(!ok){ fb.style.display="block"; f.style.display="none"; }
      else { fb.style.display="none"; f.style.display="block"; }
    };
    f.addEventListener("load", function(){ setTimeout(verdict, 250); });
    setTimeout(verdict, 3500);
  });
}

/* ---------- My Space: office calendar ---------- */
let CAL = null; // {year, month}
function calInit(){
  if(!CAL){ const n=new Date(); CAL={year:n.getFullYear(), month:n.getMonth()}; }
}
function calSchedByDate(){
  const map = {};
  (D.schedule||[]).filter(b=>b.status==="Scheduled").forEach(b=>{
    (map[b.date] = map[b.date] || []).push(b);
  });
  return map;
}
function calRender(){
  calInit();
  const map = calSchedByDate();
  const first = new Date(CAL.year, CAL.month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(CAL.year, CAL.month+1, 0).getDate();
  const monthName = first.toLocaleString('en-US',{month:'long'});
  const todayStr = new Date().toISOString().slice(0,10);
  let cells = "";
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${CAL.year}-${String(CAL.month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const items = (map[dateStr]||[]).slice().sort((a,b)=>a.start.localeCompare(b.start));
    const isToday = dateStr===todayStr;
    const shown = items.slice(0,3);
    cells += `<div class="cal-cell ${isToday?"cal-today":""}" onclick="calDayOpen('${dateStr}')">
      <div class="cal-daynum">${d}</div>
      ${shown.map(b=>`<div class="cal-evt" style="--dc:${DIV_COLORS[b.division]||"var(--sand)"}">${esc(b.start)} ${esc(b.service)}</div>`).join("")}
      ${items.length>3?`<div class="cal-more">+${items.length-3} more</div>`:""}
    </div>`;
  }
  return `<div class="cal-head">
    <button class="btn sm sec" onclick="calNav(-1)">← Prev</button>
    <div class="cal-title">${esc(monthName)} ${CAL.year}</div>
    <button class="btn sm sec" onclick="calNav(1)">Next →</button>
  </div>
  <div class="cal-grid">
    ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="cal-dow">${d}</div>`).join("")}
    ${cells}
  </div>`;
}
function calNav(delta){
  calInit();
  CAL.month += delta;
  if(CAL.month<0){ CAL.month=11; CAL.year--; }
  if(CAL.month>11){ CAL.month=0; CAL.year++; }
  const host = document.getElementById("cal-host");
  if(host) host.innerHTML = calRender();
}
function calDayOpen(dateStr){
  const items = (calSchedByDate()[dateStr]||[]).slice().sort((a,b)=>a.start.localeCompare(b.start));
  openModal(`<h3>${esc(dateStr)}</h3><div class="msub">Everything booked in the building this day.</div>
    <div class="f">
    ${items.length ? items.map(b=>`<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px">
      <b>${esc(b.start)}–${esc(b.end)}</b> · ${esc(b.service)}<br>
      <span style="font-size:12px;color:var(--ink-soft)">${esc(roomName(b.room))} · ${esc(b.division)} · ${b.staff.map(staffLabel).map(esc).join(", ")}</span>
    </div>`).join("") : `<div class="empty">Nothing booked this day.</div>`}
    <div class="macts"><button class="btn sec" onclick="closeModal()">Close</button><button class="btn" onclick="closeModal();openBookingForm()">+ Book a room</button></div>
    </div>`);
}
/* ---------- My Space: personal reminders (private per employee, this device) ---------- */
function remKey(){ return `bhw-reminders-${(D.user&&D.user.staffId)||"x"}`; }
function remLoad(){ try{ return JSON.parse(localStorage.getItem(remKey())||"[]"); }catch{ return []; } }
function remSave(list){ try{ localStorage.setItem(remKey(), JSON.stringify(list)); }catch{} }
function remindersCard(){
  const list = remLoad().slice().sort((a,b)=>(a.done-b.done)||String(a.due||"9999").localeCompare(String(b.due||"9999")));
  return `<div class="card"><h2>My reminders <span class="grow"></span><button class="btn sm" onclick="openReminderForm()">+ Add reminder</button></h2>
    <p class="lede">Personal to-dos — visible only to you, on this device.</p>
    <div class="inbox" id="rem-list">${list.length ? list.map(remRow).join("") : `<div class="empty">No reminders yet.</div>`}</div>
  </div>`;
}
function remRow(r){
  return `<div class="tsk ${r.done?"on":""}" style="display:flex;align-items:center;gap:10px" onclick="remToggle('${r.id}')"><span class="tsk-box">${r.done?"✓":""}</span><span style="flex:1">${esc(r.text)}${r.due?` <span class="pill gray">${esc(r.due)}</span>`:""}</span>
    <button class="btn sm sec" onclick="event.stopPropagation();remDelete('${r.id}')">✕</button></div>`;
}
function openReminderForm(){
  openModal(`<h3>Add a reminder</h3><div class="msub">Just for you — nobody else sees this.</div>
  <div class="f"><label>Reminder</label><input type="text" id="r-text" placeholder="Call the vendor back">
  <label>Due date (optional)</label><input type="date" id="r-due">
  <div class="ferr" id="f-err"></div>
  <div class="macts"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="remSubmit()">Add</button></div></div>`);
}
function remSubmit(){
  const text = val("r-text");
  if(!text){ document.getElementById("f-err").textContent = "Enter a reminder."; return; }
  const list = remLoad();
  list.push({ id: "r"+Date.now()+Math.random().toString(36).slice(2,7), text, due: val("r-due")||"", done:false });
  remSave(list); closeModal(); mySpaceRefresh(); toast("Reminder added");
}
function remToggle(id){
  remSave(remLoad().map(r=>r.id===id?{...r,done:!r.done}:r));
  mySpaceRefresh();
}
function remDelete(id){
  remSave(remLoad().filter(r=>r.id!==id));
  mySpaceRefresh();
}

function mySpaceRefresh(){

function mySpaceInner(){
  const todayStr = new Date().toISOString().slice(0,10);

let AWV = null; // {id, patientId, answers:[{},{},{},{},{}], step}

function awvCard(div){
  if(!D.awv) return "";
  const open = D.awv.filter(e=>e.status==="In Progress");
  const done = D.awv.filter(e=>e.status==="Completed").slice(0,5);
  return `<div class="card">
    <h2>AWV — guided sequence <span class="grow"></span><button class="btn sm" onclick="awvStart()">▶ Start new AWV</button></h2>
    <p class="lede">The five steps as one guided flow: HRA → Office Tests → Prevention Plan → Nutrition & Activity → ACP. Scores and flags calculate automatically; the summary routes the next steps.</p>
    ${(function(){
      const pend = D.awv.filter(e=>e.status==="Completed" && e.review==="Pending Review");
      if(!pend.length) return "";
      const isProv = /CRNP|PMHNP|MD|DO/i.test(D.user.roleHint||"") || D.user.access==="Admin";
      return `<div class="res-cat" style="color:var(--alert)">⚠ Awaiting provider review & signature (${pend.length})</div>
      <div class="tbl-wrap"><table><thead><tr><th>Patient</th><th>Date</th><th>Flags</th><th></th></tr></thead><tbody>
      ${pend.map(e=>{const d=daysSince(e.date);return `<tr><td><b>${esc(patLabel(e.patient))}</b> ${d>=2?`<span class="pill alert">waiting ${d}d</span>`:""}</td><td>${esc(e.date)}</td>
        <td>${e.flags.length?e.flags.map(f=>`<span class="pill ${/positive|Cognitive/.test(f)?"alert":"warn"}">${esc(f)}</span>`).join(" "):"—"}</td>
        <td>${isProv?`<button class="btn sm warn" onclick="awvSignOpen('${e.id}')">Review & Sign</button>`:`<span class="pill warn">Pending provider</span>`}</td></tr>`;}).join("")}
      </tbody></table></div>`;
    })()}
    ${open.length ? `<div class="tbl-wrap"><table><thead><tr><th>Patient</th><th>Date</th><th>Progress</th><th></th></tr></thead><tbody>
      ${open.map(e=>`<tr><td><b>${esc(patLabel(e.patient))}</b></td><td>${esc(e.date)}</td>
        <td>${e.steps.map((s,i)=>`<span class="pill ${s==="Complete"?"ok":s==="In Progress"?"warn":"gray"}">${i+1}</span>`).join(" ")}</td>
        <td><button class="btn sm" onclick="awvResume('${e.id}')">Resume</button></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">No AWVs in progress.</div>`}
    ${done.length ? `<p class="lede" style="margin-top:12px">Recently completed: ${done.map(e=>esc(patLabel(e.patient))+" ("+esc(e.date)+")"+(e.review==="Reviewed & Signed"?" ✓ signed":"")).join(" · ")}</p>` : ""}
  </div>`;
}

function awvStart(){
  openModal(`<h3>Start an AWV</h3><div class="msub">Pick the patient — the wizard saves after every step, so it's safe to pause and resume.</div>
  <div class="f"><label>Patient</label><select id="f-pat"><option value="">Select patient…</option>${patientOptions()}</select>
  <div class="ferr" id="f-err"></div>
  <div class="macts"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="awvBegin()">Begin step 1</button></div></div>`);
}
async function awvBegin(){
  const pid = val("f-pat");
  if(!pid){ document.getElementById("f-err").textContent="Pick a patient."; return; }
  try{
    const res = await api(API_ACT, {action:"awv-save", patientId:pid, step:1, stepStatus:"In Progress", answers:{}});
    AWV = { id: res.id, patientId: pid, answers: [{},{},{},{},{}], step: 0 };
    awvRender();
    toast("AWV started — print/obtain: MOLST, MD Advance Directive, clock-draw sheet, and dx-relevant health education.");
  }catch(e){ document.getElementById("f-err").textContent = e.message; }
}
function awvResume(id){
  const e = D.awv.find(x=>x.id===id); if(!e) return;
  const step = e.steps.findIndex(s=>s!=="Complete");
  AWV = { id: e.id, patientId: e.patient, answers: e.answers.map(a=>a||{}), step: step<0?4:step };
  awvRender();
}

  w.document.close();
}
function awvRender(){
  const s = AWV_FLOW[AWV.step];
  const A = AWV.answers[AWV.step];
  const bar = AWV_FLOW.map((st,i)=>`<button class="awv-step ${i===AWV.step?"on":""} ${AWV.answers[i]&&Object.keys(AWV.answers[i]).length?"has":""}" onclick="awvGo(${i})">${i+1}</button>`).join("");
  const items = s.items.map((it,idx)=>{
    if(it.h) return `<div class="res-cat">${esc(it.h)}</div>`;
    if(it.i) return `<p class="lede" style="margin:6px 0 10px">${esc(it.i)}</p>`;
    const v = A[it.k];
    if(it.t==="radio") return `<div class="awv-q"><div class="awv-l">${esc(it.q)}</div><div class="needs">${it.o.map(o=>`<button class="chip ${v===o?"on":""}" onclick="awvSet('${it.k}',${JSON.stringify(o).replace(/"/g,"&quot;")},false)">${esc(o)}</button>`).join("")}</div></div>`;
    if(it.t==="multi") return `<div class="awv-q"><div class="awv-l">${esc(it.q)}</div><div class="needs">${it.o.map(o=>`<button class="chip ${(v||[]).includes(o)?"on":""}" onclick="awvSet('${it.k}',${JSON.stringify(o).replace(/"/g,"&quot;")},true)">${esc(o)}</button>`).join("")}</div></div>`;
    if(it.t==="num") return `<div class="awv-q"><div class="awv-l">${esc(it.q)}</div><input type="number" inputmode="numeric" value="${v??""}" onchange="awvVal('${it.k}',this.value)" style="max-width:140px"></div>`;
    return `<div class="awv-q"><div class="awv-l">${esc(it.q)}</div><input type="text" value="${esc(v??"")}" onchange="awvVal('${it.k}',this.value)"></div>`;
  }).join("");
  const computed = awvComputedLine();
  openModal(`<h3>${s.icon} Step ${AWV.step+1} of 5 — ${esc(s.t)}</h3>
  <div class="msub">${esc(patLabel(AWV.patientId))} · saves when you tap Next</div>
  <div class="awv-bar">${bar}</div>
  ${AWV.step===0?awvPrepCard():""}
  <div class="f awv-body">${items}</div>
  ${computed}
  <div class="ferr" id="f-err"></div>
  <div class="macts">
    <button class="btn sec" onclick="awvSave('In Progress',false)">Save & close</button>
    ${AWV.step>0?`<button class="btn sec" onclick="awvGo(${AWV.step-1})">← Back</button>`:""}
    <button class="btn" onclick="awvSave('Complete',true)">${AWV.step<4?"Next →":"Finish → Summary"}</button>
  </div>`);
  const body = document.querySelector(".mcard"); if(body) body.style.maxWidth = "720px";
}
function awvSet(k, v, multi){
  const A = AWV.answers[AWV.step];
  if(multi){ A[k] = A[k]||[]; A[k] = A[k].includes(v) ? A[k].filter(x=>x!==v) : [...A[k], v]; }
  else A[k] = (A[k]===v ? undefined : v);
  awvRender();
}
function awvVal(k, v){ AWV.answers[AWV.step][k] = v; }

function awvScores(){
  const a1 = AWV.answers[0], a2 = AWV.answers[1], a4 = AWV.answers[3];
  const recall = {"0 words":0,"1 word":1,"2 words":2,"3 words":3}[a2.recall];
  const clock = a2.clock ? (a2.clock.startsWith("Normal")?2:0) : undefined;
  const miniCog = (recall!==undefined && clock!==undefined) ? recall+clock : undefined;
  let diet; const dks = ["d1","d2","d3","d4","d5","d6","d7","d8"];
  if(dks.some(k=>a4[k])){ diet = dks.reduce((t,k)=>{ const m=(a4[k]||"").match(/\((\d)\)/); return t + (m?+m[1]:0); },0); }
  const exercise = (a4.evsdays && a4.evsmin) ? (+a4.evsdays)*(+a4.evsmin) : undefined;
  return { miniCog, diet, exercise };
}
function awvFlags(){
  const a1 = AWV.answers[0], a5 = AWV.answers[4];
  const c = awvScores();
  const f = [];
  const hi = v => v==="More than half the days"||v==="Nearly every day";
  if(c.miniCog!==undefined && c.miniCog<4) f.push("Cognitive follow-up");
  if(hi(a1.phq1)||hi(a1.phq2)) f.push("Depression screen positive");
  if(hi(a1.gad1)||hi(a1.gad2)) f.push("Anxiety screen positive");
  if([a1.fell,a1.unsteady,a1.fearfall].filter(v=>v==="Yes").length>=1) f.push("Fall risk");
  if([a1.snore,a1.daytired,a1.apnea,a1.htn].filter(v=>v==="Yes").length>=2) f.push("Sleep apnea signals");
  if(a1.medprob==="Yes"||a1.medaccess==="Yes") f.push("Med access barrier");
  if(a1.ccm==="Yes, enroll") f.push("CCM enrollment yes");
  if(a1.rpm==="Yes, enroll") f.push("RPM enrollment yes");
  if(a1.hrsn==="Yes") f.push("HRSN screening agreed");
  if((a5.acpbill||[]).some(x=>x.includes("99497"))) f.push("ACP billed 99497");
  if(a1.wantdocs==="Yes") f.push("Wants life-planning docs");
  return f;
}
function awvComputedLine(){
  const c = awvScores();
  const bits = [];
  if(AWV.step===1 && c.miniCog!==undefined) bits.push(`Mini-Cog: <b>${c.miniCog}/5</b>${c.miniCog<4?' <span class="pill alert">flag — further eval</span>':' <span class="pill ok">no flag</span>'}`);
  if(AWV.step===3){
    if(c.diet!==undefined) bits.push(`Diet score: <b>${c.diet}/16</b>`);
    if(c.exercise!==undefined) bits.push(`Exercise: <b>${c.exercise} min/wk</b>${c.exercise<150?' <span class="pill warn">under 150 — counsel</span>':' <span class="pill ok">meets goal</span>'}`);
  }
  return bits.length ? `<p class="lede" style="margin-top:10px">${bits.join(" &nbsp;·&nbsp; ")}</p>` : "";
}
async function awvSave(stepStatus, advance){
  const body = { action:"awv-save", id:AWV.id, step:AWV.step+1, stepStatus,
    answers:AWV.answers[AWV.step], computed:awvScores(), flags:awvFlags() };
  try{
    await api(API_ACT, body);
    if(!advance){ closeModal(); refreshSoft(); return; }
    if(AWV.step<4){ AWV.step++; awvRender(); }
    else awvSummary();
  }catch(e){ const el=document.getElementById("f-err"); if(el) el.textContent=e.message; }
}
function awvGo(i){ AWV.step = i; awvRender(); }

function awvSummary(){
  const flags = awvFlags(), c = awvScores();
  const acts = [];
  if(flags.includes("Depression screen positive")||flags.includes("Anxiety screen positive"))
    acts.push(`<button class="btn sm warn" onclick="closeModal();openHandoffForm('Primary Care');setTimeout(()=>{document.getElementById('f-to').value='Mind & Mood Recovery';document.getElementById('f-pat').value='${AWV.patientId}';},50)">→ Warm handoff to Mind & Mood</button>`);
  if(flags.includes("CCM enrollment yes")||flags.includes("RPM enrollment yes"))
    acts.push(`<button class="btn sm" onclick="awvEnrollReferral()">→ Send enrollment referral to Care Management</button>`);
  if(flags.includes("Fall risk")||flags.includes("Med access barrier")||flags.includes("HRSN screening agreed"))
    acts.push(`<button class="btn sm sec" onclick="closeModal();openReferralForm('Primary Care');setTimeout(()=>{document.getElementById('f-to').value='Care Management';document.getElementById('f-type').value='SDH';document.getElementById('f-pat').value='${AWV.patientId}';},50)">→ SDH referral to care management</button>`);
  openModal(`<h3>✅ AWV Summary</h3><div class="msub">${esc(patLabel(AWV.patientId))} — review flags, fire the next steps, then mark complete.</div>
  <div class="f">
    <div class="awv-q"><div class="awv-l">Flags</div>${flags.length?flags.map(f=>`<span class="pill ${/positive|Cognitive/.test(f)?"alert":/risk|barrier|apnea/.test(f)?"warn":"ok"}">${esc(f)}</span> `).join(""):'<span class="pill ok">None</span>'}</div>
    <div class="awv-q"><div class="awv-l">Scores</div>${c.miniCog!==undefined?`Mini-Cog ${c.miniCog}/5 · `:""}${c.diet!==undefined?`Diet ${c.diet}/16 · `:""}${c.exercise!==undefined?`Exercise ${c.exercise} min/wk`:""}</div>
    <div class="awv-q" id="awv-gaps"><div class="awv-l">Open care gaps <span class="pill gray">payer report</span></div><div class="lede" style="margin:0">Checking the Medicare Wellness Report…</div></div>
    ${acts.length?`<div class="awv-q"><div class="awv-l">Suggested next steps</div><div class="acts" style="display:flex;gap:8px;flex-wrap:wrap">${acts.join("")}</div></div>`:""}
    <p class="lede">Remember: G0438 (initial) / G0439 (subsequent); 99497 if ACP hit 30 minutes. Document in CharmHealth. On completion this encounter moves to <b>Awaiting provider review</b> — Amaris or Yahaira signs it from the AWV card.</p>
    <div class="macts"><button class="btn sec" onclick="closeModal()">Close</button><button class="btn" onclick="awvComplete()">Mark AWV Completed</button></div>
  </div>`);
  awvGapsLoad(AWV.patientId);
}
// Pull this patient's open preventive gaps from the payer Wellness Report and
// render them into the AWV summary. Matched by Insurance Member ID (name as
// fallback). Never blocks the summary — failures just show a quiet note.
async function awvGapsLoad(patientId){
  const box = document.getElementById("awv-gaps");
  if(!box) return;
  const p = (D.patients||[]).find(x=>x.id===patientId) || {};
  try{
    const r = await api(API_GAPS, {action:"for", memberId:p.memberId||"", name:p.name||""});
    if(document.getElementById("awv-gaps")!==box) return; // modal moved on
    if(!r.matched){
      box.innerHTML = `<div class="awv-l">Open care gaps <span class="pill gray">payer report</span></div><div class="lede" style="margin:0">No matching row in the Medicare Wellness Report ${p.memberId?"for this Member ID":"by name"}. Upload this month's report to the Gaps in Care page if it's missing.</div>`;
      return;
    }
    const open = r.gaps.filter(g=>g.open), other = r.gaps.filter(g=>!g.open);
    const chip = g=>`<span class="pill ${g.open?"alert":"gray"}" title="${esc(g.state)}${g.hcpcs?" · "+esc(g.hcpcs):""}">${esc(g.label)}${g.hcpcs?` · ${esc(g.hcpcs)}`:""}</span>`;

function cmCard(){

function cmStart(){
  openModal(`<h3>Start a CharmEd assessment</h3><div class="msub">Pick the patient — the flowsheet saves after every step.</div>
  <div class="f"><label>Patient</label><select id="f-pat"><option value="">Select patient…</option>${patientOptions()}</select>
  <div class="ferr" id="f-err"></div>
  <div class="macts"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="cmBegin()">Begin intake</button></div></div>`);
}
async function cmBegin(){
  const pid = val("f-pat");
  if(!pid){ document.getElementById("f-err").textContent="Pick a patient."; return; }
  try{
    const res = await api(API_ACT, {action:"cm-save", patientId:pid, step:1, stepStatus:"In Progress", answers:{}});
    CM = { id: res.id, patientId: pid, answers: [{},{},{},{},{},{}], step: 0 };
    cmRender();
  }catch(e){ document.getElementById("f-err").textContent = e.message; }
}
function cmResume(id){
  const e = D.charmed.find(x=>x.id===id); if(!e) return;
  const step = e.steps.findIndex(s=>s!=="Complete");
  CM = { id: e.id, patientId: e.patient, answers: e.answers.map(a=>a||{}), step: step<0?5:step };
  cmRender();
}

function cmRender(){
  const s = CM_FLOW[CM.step];
  const A = CM.answers[CM.step];
  // pre-seed screener suggestions when arriving at step 5
  if(CM.step===4 && !A.screeners){
    A.screeners = cmSuggestScreeners();
  }
  const bar = CM_FLOW.map((st,i)=>`<button class="awv-step ${i===CM.step?"on":""} ${CM.answers[i]&&Object.keys(CM.answers[i]).length?"has":""}" onclick="cmGo(${i})">${i+1}</button>`).join("");
  const items = s.items.map(it=>{
    if(it.h) return `<div class="res-cat">${esc(it.h)}</div>`;
    if(it.i) return `<p class="lede" style="margin:6px 0 10px">${esc(it.i)}</p>`;
    const v = A[it.k];
    if(it.t==="radio") return `<div class="awv-q"><div class="awv-l">${esc(it.q)}</div><div class="needs">${it.o.map(o=>`<button class="chip ${v===o?"on":""}" onclick="cmSet('${it.k}',${JSON.stringify(o).replace(/"/g,"&quot;")},false)">${esc(o)}</button>`).join("")}</div></div>`;
    if(it.t==="multi") return `<div class="awv-q"><div class="awv-l">${esc(it.q)}</div><div class="needs">${it.o.map(o=>`<button class="chip ${(v||[]).includes(o)?"on":""}" onclick="cmSet('${it.k}',${JSON.stringify(o).replace(/"/g,"&quot;")},true)">${esc(o)}</button>`).join("")}</div></div>`;
    return `<div class="awv-q"><div class="awv-l">${esc(it.q)}</div><input type="text" value="${esc(v??"")}" onchange="cmVal('${it.k}',this.value)"></div>`;
  }).join("");
  const hint = CM.step===4 ? `<p class="lede" style="margin-top:8px">Suggested for <b>${esc(CM.answers[0].age||"age not set")}</b>${cmMaskCount()>=3?" · 2e flags present — autism screeners kept in the mix":""}.</p>` : "";
  openModal(`<h3>${s.icon} Step ${CM.step+1} of 6 — ${esc(s.t)}</h3>
  <div class="msub">${esc(patLabel(CM.patientId))} · saves when you tap Next</div>
  <div class="awv-bar">${bar}</div>
  <div class="f awv-body">${items}</div>
  ${hint}
  <div class="ferr" id="f-err"></div>
  <div class="macts">
    <button class="btn sec" onclick="cmSave('In Progress',false)">Save & close</button>
    ${CM.step>0?`<button class="btn sec" onclick="cmGo(${CM.step-1})">← Back</button>`:""}
    <button class="btn" onclick="cmSave('Complete',true)">${CM.step<5?"Next →":"Finish → Summary"}</button>
  </div>`);
  const body = document.querySelector(".mcard"); if(body) body.style.maxWidth = "720px";
}
function cmSet(k, v, multi){
  const A = CM.answers[CM.step];
  if(multi){ A[k] = A[k]||[]; A[k] = A[k].includes(v) ? A[k].filter(x=>x!==v) : [...A[k], v]; }
  else A[k] = (A[k]===v ? undefined : v);
  cmRender();
}
function cmVal(k, v){ CM.answers[CM.step][k] = v; }
function cmGo(i){ CM.step = i; cmRender(); }
function cmMaskCount(){ return (CM.answers[2].masking||[]).length; }

function cmSuggestScreeners(){
  const age = CM.answers[0].age;
  let list = [...(CM_AGE_SCREENERS[age] || [])];
  const academic = CM.answers[1].academic || [];
  if(academic.some(a=>["Reading","Writing","Spelling"].includes(a)) && !list.includes("Dyslexia/Dysgraphia/Dyscalculia")) list.push("Dyslexia/Dysgraphia/Dyscalculia");
  const famhx = CM.answers[3].famhx || [];
  if(famhx.includes("Trauma history") || (CM.answers[3].stressors||[]).some(s=>["Loss","Illness","Housing stress"].includes(s))) list.push("Trauma Screening");
  if(cmMaskCount()>=3){ ["CAST","SRS-2 Short"].forEach(x=>{ if(!list.includes(x)) list.push(x); }); }
  return list;
}

function cmFlags(){
  const a3=CM.answers[2], a4=CM.answers[3], a6=CM.answers[5];
  const f=[];
  if(cmMaskCount()>=3) f.push("High-masking/2e profile");
  const mh=(a4.mh||[]).filter(x=>x!=="No mental health concerns");
  if(mh.length>=2 || a4.stress==="High" || (a6.emotional||[]).length>=2) f.push("Mental health concerns");
  if((a6.trauma||[]).some(x=>x!=="No known trauma")) f.push("Trauma-informed approach");
  if((a4.sleep||[]).includes("Snoring / mouth breathing")) f.push("Sleep concerns — medical");
  if((a4.medical||[]).some(x=>x!=="None reported")) f.push("Medical follow-up");
  if((a6.adhd||"").startsWith("Possible")||a6.adhd==="Diagnosed") f.push("ADHD possible");
  if(["Mild concerns","Moderate concerns","High concerns","Diagnosed"].includes(a6.asd)) f.push("ASD concerns");
  if((a6.learning||[]).length) f.push("Learning disorder flags");
  if(a6.efsev==="Significant") f.push("EF significant");
  if(a6.sensimpact==="Significant") f.push("Sensory significant");
  if((a4.support||[]).includes("Limited support")) f.push("Limited support system");
  return f;
}

async function cmSave(stepStatus, advance){
  const statusByStep = {5:"Screeners Pending", 6:"Scores Ready"};
  const body = { action:"cm-save", id:CM.id, step:CM.step+1, stepStatus,
    answers:CM.answers[CM.step], flags:cmFlags(),
    ageGroup: CM.answers[0].age || undefined,
    screeners: CM.answers[4].screeners || undefined };
  if(advance && stepStatus==="Complete" && statusByStep[CM.step+1]) body.status = statusByStep[CM.step+1];
  try{
    await api(API_ACT, body);
    if(!advance){ closeModal(); refreshSoft(); return; }
    if(CM.step<5){ CM.step++; cmRender(); }
    else cmSummary();
  }catch(e){ const el=document.getElementById("f-err"); if(el) el.textContent=e.message; }
}

function cmSummary(){
  const flags = cmFlags();
  const acts = [];
  if(flags.includes("Mental health concerns")||flags.includes("Trauma-informed approach"))
    acts.push(`<button class="btn sm warn" onclick="closeModal();openHandoffForm('CharmEd Minds');setTimeout(()=>{document.getElementById('f-to').value='Mind & Mood Recovery';document.getElementById('f-pat').value='${CM.patientId}';},50)">→ Warm handoff to Mind & Mood</button>`);
  if(flags.includes("Sleep concerns — medical")||flags.includes("Medical follow-up"))
    acts.push(`<button class="btn sm" onclick="closeModal();openReferralForm('CharmEd Minds');setTimeout(()=>{document.getElementById('f-to').value='Primary Care';document.getElementById('f-pat').value='${CM.patientId}';},50)">→ Medical referral to Primary Care</button>`);
  if((CM.answers[5].recs||[]).includes("Medication evaluation"))
    acts.push(`<button class="btn sm sec" onclick="closeModal();openReferralForm('CharmEd Minds');setTimeout(()=>{document.getElementById('f-to').value='Primary Care';document.getElementById('f-pat').value='${CM.patientId}';document.getElementById('f-det').value='Medication evaluation recommended from CharmEd assessment.';},50)">→ Med evaluation referral</button>`);
  acts.push(`<button class="btn sm warn" onclick="closeModal();cmSendOpen('${CM.id}','peds')">📤 Email the screeners now</button>`);
  acts.push(`<button class="btn sm" onclick="closeModal();cpEnroll('${CM.patientId}')">→ Enroll in 12-week program</button>`);
  openModal(`<h3>⭐ Assessment Summary</h3><div class="msub">${esc(patLabel(CM.patientId))} — flags, routing, and stage.</div>
  <div class="f">
    <div class="awv-q"><div class="awv-l">Flags</div>${flags.length?flags.map(f=>`<span class="pill ${/Mental|Trauma/.test(f)?"alert":/Medical|Sleep|EF|Learning/.test(f)?"warn":"info"}">${esc(f)}</span> `).join(""):'<span class="pill ok">None</span>'}</div>
    <div class="awv-q"><div class="awv-l">Screeners queued</div>${(CM.answers[4].screeners||[]).map(s=>`<span class="pill gray">${esc(s)}</span>`).join(" ")||"—"}</div>
    ${acts.length?`<div class="awv-q"><div class="awv-l">Suggested next steps</div><div style="display:flex;gap:8px;flex-wrap:wrap">${acts.join("")}</div></div>`:""}
    <p class="lede">Stage is now <b>Scores Ready</b>. After the feedback session with the family, mark the assessment complete.</p>
    <div class="macts">
      <button class="btn sec" onclick="cmStage('Feedback Session')">Mark Feedback Session</button>
      <button class="btn" onclick="cmStage('Complete')">Mark Complete</button>
    </div>
  </div>`);
}
async function cmStage(status){
  try{
    await api(API_ACT, {action:"cm-save", id:CM.id, status, flags:cmFlags()});
    toast(`Assessment marked ${status}`); closeModal(); CM=null; refreshSoft();
  }catch(e){ toast("⚠ "+e.message); }
}

let CMA = null;

function cmaCard(){
  if(!D.charmedAdult) return "";
  const open = D.charmedAdult.filter(e=>!["Complete","Abandoned"].includes(e.status));
  const done = D.charmedAdult.filter(e=>e.status==="Complete").slice(0,5);
  return `<div class="card">
    <h2>Adult assessment — guided flowsheet <span class="grow"></span><button class="btn sm" onclick="cmaStart()">▶ Start adult assessment</button></h2>
    <p class="lede">The Adult Assessment Hub intake as one guided flow: concerns → EF/social/sensory → mental health & cognition → substance/injury/trauma → vascular & sleep → screeners. Brain-based routing flags fire automatically, including Flow vascular candidates.</p>
    ${open.length ? `<div class="tbl-wrap"><table><thead><tr><th>Patient</th><th>Stage</th><th>Progress</th><th></th></tr></thead><tbody>
      ${open.map(e=>`<tr><td><b>${esc(patLabel(e.patient))}</b></td>
        <td><span class="pill info">${esc(e.status)}</span></td>
        <td>${e.steps.map((s,i)=>`<span class="pill ${s==="Complete"?"ok":s==="In Progress"?"warn":"gray"}">${i+1}</span>`).join(" ")}</td>
        <td style="white-space:nowrap"><button class="btn sm" onclick="cmaResume('${e.id}')">Resume</button>${(e.screeners||[]).length&&["Intake","Screeners Pending"].includes(e.status)?` <button class="btn sm sec" onclick="cmSendOpen('${e.id}','adult')">📤 Send</button>`:""}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">No adult assessments in progress.</div>`}
    ${done.length ? `<p class="lede" style="margin-top:12px">Recently completed: ${done.map(e=>esc(patLabel(e.patient))+" ("+esc(e.date)+")").join(" · ")}</p>` : ""}
  </div>`;
}

function cmaStart(){
  openModal(`<h3>Start an adult assessment</h3><div class="msub">Age 18+. Saves after every step.</div>
  <div class="f"><label>Patient</label><select id="f-pat"><option value="">Select patient…</option>${patientOptions()}</select>
  <div class="ferr" id="f-err"></div>
  <div class="macts"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="cmaBegin()">Begin intake</button></div></div>`);
}
async function cmaBegin(){
  const pid = val("f-pat");
  if(!pid){ document.getElementById("f-err").textContent="Pick a patient."; return; }
  try{
    const res = await api(API_ACT, {action:"cma-save", patientId:pid, step:1, stepStatus:"In Progress", answers:{}});
    CMA = { id: res.id, patientId: pid, answers: [{},{},{},{},{},{}], step: 0 };
    cmaRender();
  }catch(e){ document.getElementById("f-err").textContent = e.message; }
}
function cmaResume(id){
  const e = D.charmedAdult.find(x=>x.id===id); if(!e) return;
  const step = e.steps.findIndex(s=>s!=="Complete");
  CMA = { id: e.id, patientId: e.patient, answers: e.answers.map(a=>a||{}), step: step<0?5:step };
  cmaRender();
}

function cmaRender(){
  const s = CMA_FLOW[CMA.step];
  const A = CMA.answers[CMA.step];
  if(CMA.step===5 && !A.screeners) A.screeners = cmaSuggestScreeners();
  const bar = CMA_FLOW.map((st,i)=>`<button class="awv-step ${i===CMA.step?"on":""} ${CMA.answers[i]&&Object.keys(CMA.answers[i]).length?"has":""}" onclick="cmaGo(${i})">${i+1}</button>`).join("");
  const items = s.items.map(it=>{
    if(it.h) return `<div class="res-cat">${esc(it.h)}</div>`;
    if(it.i) return `<p class="lede" style="margin:6px 0 10px">${esc(it.i)}</p>`;
    const v = A[it.k];
    if(it.t==="radio") return `<div class="awv-q"><div class="awv-l">${esc(it.q)}</div><div class="needs">${it.o.map(o=>`<button class="chip ${v===o?"on":""}" onclick="cmaSet('${it.k}',${JSON.stringify(o).replace(/"/g,"&quot;")},false)">${esc(o)}</button>`).join("")}</div></div>`;
    if(it.t==="multi") return `<div class="awv-q"><div class="awv-l">${esc(it.q)}</div><div class="needs">${it.o.map(o=>`<button class="chip ${(v||[]).includes(o)?"on":""}" onclick="cmaSet('${it.k}',${JSON.stringify(o).replace(/"/g,"&quot;")},true)">${esc(o)}</button>`).join("")}</div></div>`;
    return `<div class="awv-q"><div class="awv-l">${esc(it.q)}</div><input type="text" value="${esc(v??"")}" onchange="cmaVal('${it.k}',this.value)"></div>`;
  }).join("");
  openModal(`<h3>${s.icon} Step ${CMA.step+1} of 6 — ${esc(s.t)}</h3>
  <div class="msub">${esc(patLabel(CMA.patientId))} · adult (18+) · saves when you tap Next</div>
  <div class="awv-bar">${bar}</div>
  <div class="f awv-body">${items}</div>
  <div class="ferr" id="f-err"></div>
  <div class="macts">
    <button class="btn sec" onclick="cmaSave('In Progress',false)">Save & close</button>
    ${CMA.step>0?`<button class="btn sec" onclick="cmaGo(${CMA.step-1})">← Back</button>`:""}
    <button class="btn" onclick="cmaSave('Complete',true)">${CMA.step<5?"Next →":"Finish → Summary"}</button>
  </div>`);
  const body = document.querySelector(".mcard"); if(body) body.style.maxWidth = "720px";
}
function cmaSet(k, v, multi){
  const A = CMA.answers[CMA.step];
  if(multi){ A[k] = A[k]||[]; A[k] = A[k].includes(v) ? A[k].filter(x=>x!==v) : [...A[k], v]; }
  else A[k] = (A[k]===v ? undefined : v);
  cmaRender();
}
function cmaVal(k, v){ CMA.answers[CMA.step][k] = v; }
function cmaGo(i){ CMA.step = i; cmaRender(); }

function cmaFlags(){
  const a1=CMA.answers[0], a2=CMA.answers[1], a3=CMA.answers[2], a4=CMA.answers[3], a5=CMA.answers[4];
  const f=[];
  const socialSig=(a2.social||[]).filter(x=>x!=="No concerns");
  if(socialSig.length>=3 || (a1.referral||[]).includes("Autism traits") || (a1.referral||[]).includes("Late diagnosis evaluation")) f.push("Autism traits — full screen");
  if((a2.ef||[]).length>=4 || (a1.referral||[]).includes("ADHD")) f.push("ADHD signals");
  const cogSig=(a3.cog||[]).filter(x=>x!=="None");
  if(cogSig.length>=3 || (a5.changes||[]).length>=3) f.push("Cognitive red flags");
  if(a5.pattern==="Sudden change") f.push("Sudden cognitive change — urgent");
  if(["Gradual worsening","Sudden change","After illness or injury"].includes(a5.pattern) || cogSig.length>=3) f.push("MOCA pre-screen indicated");
  const vascDx=(a5.vasc||[]).filter(x=>x!=="No known vascular issues");
  const vascRf=(a5.vascrisk||[]).filter(x=>x!=="None");
  if(vascDx.length>=1 || vascRf.length>=2) f.push("Vascular risk — Flow candidate");
  const oxy=(a5.oxy||[]).filter(x=>x!=="None");
  if(oxy.some(x=>["Sleep apnea","Snoring / mouth breathing","Daytime sleepiness"].includes(x))) f.push("Sleep/oxygenation concerns");
  const trauma=(a4.trauma||[]).filter(x=>!["None","Prefer not to answer"].includes(x));
  if(trauma.length && ["Yes","Maybe"].includes(a4.traumacog)) f.push("Trauma-informed approach");
  const subs=(a4.subs||[]).filter(x=>!["No history of substance use","Prefer not to answer"].includes(x));
  if(subs.length && (a4.subimpact||[]).some(x=>x!=="No noticeable impact")) f.push("Substance-cognition interaction");
  const mh=(a3.mh||[]).filter(x=>x!=="None");
  if(mh.length>=2) f.push("Mental health concerns");
  if((a4.tbi||[]).some(x=>x!=="No known brain injuries")) f.push("TBI history");
  return f;
}

function cmaSuggestScreeners(){
  const flags = cmaFlags();
  const a1=CMA.answers[0], a3=CMA.answers[2];
  let list = ["Adult EF Checklist"];
  if(flags.includes("Autism traits — full screen")) list.push("AQ-10","RAADS-14","Adult Sensory Profile — Short");
  if(flags.includes("ADHD signals")) list.push("ASRS","W-FIRS-S");
  if(flags.includes("Mental health concerns") || (a3.mh||[]).some(x=>["Anxiety","Depression","Chronic stress"].includes(x))) list.push("PHQ-9","GAD-7");
  if((a1.referral||[]).includes("Academic or work struggles") || (a1.difficulties||[]).includes("Memory")) list.push("Adult Dyslexia Screener");
  if(flags.includes("Trauma-informed approach")) list.push("Gentle ACE/Trauma Screen");
  if(flags.includes("Cognitive red flags")||flags.includes("TBI history")||flags.includes("Substance-cognition interaction")) list.push("Cognitive Red Flags Checklist");
  if(flags.includes("MOCA pre-screen indicated")) list.push("MOCA Pre-Screen (Provider)");
  return [...new Set(list)];
}

async function cmaSave(stepStatus, advance){
  const body = { action:"cma-save", id:CMA.id, step:CMA.step+1, stepStatus,
    answers:CMA.answers[CMA.step], flags:cmaFlags(),
    screeners: CMA.answers[5].screeners || undefined };
  if(advance && stepStatus==="Complete" && CMA.step===5) body.status = "Screeners Pending";
  try{
    await api(API_ACT, body);
    if(!advance){ closeModal(); refreshSoft(); return; }
    if(CMA.step<5){ CMA.step++; cmaRender(); }
    else cmaSummary();
  }catch(e){ const el=document.getElementById("f-err"); if(el) el.textContent=e.message; }
}

function cmaSummary(){
  const flags = cmaFlags();
  const acts = [];
  if(flags.includes("Vascular risk — Flow candidate"))
    acts.push(`<button class="btn sm" onclick="closeModal();openReferralForm('CharmEd Minds');setTimeout(()=>{document.getElementById('f-to').value='Flow';document.getElementById('f-type').value='Flow Pathway';document.getElementById('f-pat').value='${CMA.patientId}';document.getElementById('f-det').value='Adult assessment flagged vascular/perfusion risk — Flow vascular stabilization candidate.';},50)">→ Flow pathway referral</button>`);
  if(flags.includes("Mental health concerns")||flags.includes("Trauma-informed approach")||flags.includes("Substance-cognition interaction"))
    acts.push(`<button class="btn sm warn" onclick="closeModal();openHandoffForm('CharmEd Minds');setTimeout(()=>{document.getElementById('f-to').value='Mind & Mood Recovery';document.getElementById('f-pat').value='${CMA.patientId}';},50)">→ Warm handoff to Mind & Mood</button>`);
  if(flags.includes("Sleep/oxygenation concerns")||flags.includes("Sudden cognitive change — urgent"))
    acts.push(`<button class="btn sm sec" onclick="closeModal();openReferralForm('CharmEd Minds');setTimeout(()=>{document.getElementById('f-to').value='Primary Care';document.getElementById('f-pat').value='${CMA.patientId}';document.getElementById('f-pri').value='${flags.includes("Sudden cognitive change — urgent")?"Urgent":"Routine"}';},50)">→ Medical referral to Primary Care${flags.includes("Sudden cognitive change — urgent")?" (URGENT)":""}</button>`);
  acts.push(`<button class="btn sm warn" onclick="closeModal();cmSendOpen('${CMA.id}','adult')">📤 Email the screeners now</button>`);
  acts.push(`<button class="btn sm" onclick="closeModal();cpEnroll('${CMA.patientId}')">→ Enroll in 12-week program</button>`);
  openModal(`<h3>⭐ Adult Assessment Summary</h3><div class="msub">${esc(patLabel(CMA.patientId))} — flags, routing, and stage.</div>
  <div class="f">
    <div class="awv-q"><div class="awv-l">Flags</div>${flags.length?flags.map(f=>`<span class="pill ${/urgent|red flags|Trauma|Mental/.test(f)?"alert":/Flow/.test(f)?"ok":"warn"}">${esc(f)}</span> `).join(""):'<span class="pill ok">None</span>'}</div>
    <div class="awv-q"><div class="awv-l">Screeners queued</div>${(CMA.answers[5].screeners||[]).map(s=>`<span class="pill gray">${esc(s)}</span>`).join(" ")||"—"}</div>
    ${acts.length?`<div class="awv-q"><div class="awv-l">Suggested next steps</div><div style="display:flex;gap:8px;flex-wrap:wrap">${acts.join("")}</div></div>`:""}
    ${flags.includes("Sudden cognitive change — urgent")?`<p class="lede" style="color:var(--alert);font-weight:600">Sudden cognitive change reported — provider review same-day.</p>`:""}
    <p class="lede">Stage is now <b>Screeners Pending</b>. When scores come back, update the stage — feedback session, then complete.</p>
    <div class="macts">
      <button class="btn sec" onclick="cmaStage('Scores Ready')">Mark Scores Ready</button>
      <button class="btn sec" onclick="cmaStage('Feedback Session')">Mark Feedback Session</button>
      <button class="btn" onclick="cmaStage('Complete')">Mark Complete</button>
    </div>
  </div>`);
}
async function cmaStage(status){
  try{
    await api(API_ACT, {action:"cma-save", id:CMA.id, status, flags:cmaFlags()});
    toast(`Assessment marked ${status}`); closeModal(); CMA=null; refreshSoft();
  }catch(e){ toast("⚠ "+e.message); }
}


/* ============ CharmEd 12-Week Program Tracker ============ */
const CP_TRACKS = ["Children","Teens/Young Adults","Adults","Substance Use & Recovery","Chronic Disease & Brain Fog","Suspected Autism/ADHD/AuDHD","Older Adults"];
const CP_BATTERY = ["Creyos","CogniFit","AQ-10","RAADS-14","ASRS","Vanderbilt","SRS-2 Short","PHQ-9/GAD-7","Adult EF Checklist","Sensory Profile","MOCA","Dyslexia/Dysgraphia/Dyscalculia","Other"];

function cpWeek(startDate){ if(!startDate) return 0; return Math.min(13, Math.floor((Date.now()-new Date(startDate))/(7*86400000))+1); }
function cpAutoStage(week){
  if(week<=0) return "Enrolled";
  if(week<=4) return "Weeks 1-4 — Foundations";
  if(week<=8) return "Weeks 5-8 — Building";
  if(week<=11) return "Weeks 9-11 — Consolidation";
  return "Week 12 — Retest Due";
}

function cpCard(){
  if(!D.charmedProgram) return "";
  const active = D.charmedProgram.filter(e=>!["Graduated","Withdrawn"].includes(e.stage));
  const grads = D.charmedProgram.filter(e=>e.stage==="Graduated").slice(-5);
  const retestDue = active.filter(e=>cpWeek(e.startDate)>=12 && e.stage!=="Retest Complete");
  return `<div class="card">
    <h2>12-week program tracker <span class="grow"></span>${retestDue.length?`<span class="pill alert">⚠ ${retestDue.length} retest${retestDue.length>1?"s":""} due</span>`:""}<button class="btn sm" onclick="cpEnroll()">+ Enroll patient</button></h2>
    <p class="lede">Every enrollee's week auto-advances from their start date. Week 12 demands a retest of the same baseline battery before graduation — no retest, no graduation.</p>
    ${active.length ? `<div class="tbl-wrap"><table><thead><tr><th>Patient</th><th>Track</th><th>Week</th><th>Stage</th><th></th></tr></thead><tbody>
      ${active.map(e=>{
        const wk = cpWeek(e.startDate);
        const auto = e.stage==="Retest Complete" ? "Retest Complete" : cpAutoStage(wk);
        const pct = Math.min(100, Math.round((Math.min(wk,12)/12)*100));
        return `<tr><td><b>${esc(patLabel(e.patient))}</b></td><td><span class="pill gray">${esc(e.track||"—")}</span></td>
          <td><div style="min-width:110px"><div style="font-size:11px;font-weight:700;margin-bottom:3px">Week ${Math.min(wk,12)} / 12</div>
            <div style="height:6px;background:var(--line);border-radius:4px"><div style="height:6px;width:${pct}%;background:${wk>=12?"var(--alert)":"var(--sage)"};border-radius:4px"></div></div></div></td>
          <td><span class="pill ${auto==="Week 12 — Retest Due"?"alert":auto==="Retest Complete"?"ok":"info"}">${esc(auto)}</span></td>
          <td>${e.stage==="Retest Complete"
            ? `<button class="btn sm" onclick="act({action:'prog-save',id:'${e.id}',stage:'Graduated'},'Graduated 🎓')">Graduate</button>`
            : wk>=12
              ? `<button class="btn sm warn" onclick="cpRetest('${e.id}')">Log retest</button>`
              : `<button class="btn sm sec" onclick="cpNote('${e.id}')">+ Note</button>`}</td></tr>`;
      }).join("")}
    </tbody></table></div>` : `<div class="empty">No active enrollments. Enroll from a completed assessment or with the button above.</div>`}
    ${grads.length ? `<p class="lede" style="margin-top:12px">Graduated: ${grads.map(e=>esc(patLabel(e.patient))).join(" · ")} 🎓</p>` : ""}
  </div>`;
}

function cpEnroll(preferPatient){
  openModal(`<h3>Enroll in the 12-week program</h3><div class="msub">Captures the baseline battery so week 12 retests the same set.</div>
  <div class="f">
    <label>Patient</label><select id="f-pat"><option value="">Select patient…</option>${patientOptions()}</select>
    <label>Track</label><select id="f-track">${CP_TRACKS.map(t=>`<option>${t}</option>`).join("")}</select>
    <label>Start date</label><input type="date" id="f-date" value="${new Date().toISOString().slice(0,10)}">
    <label>Baseline battery (what was tested at intake)</label>
    <div class="needs" id="f-batt">${CP_BATTERY.map(b=>`<button class="chip" type="button" onclick="this.classList.toggle('on')" data-b="${b}">${b}</button>`).join("")}</div>
    <label>Baseline summary (scores / headline findings)</label><textarea id="f-base"></textarea>
    <div class="ferr" id="f-err"></div>
    <div class="macts"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="cpEnrollSubmit()">Enroll</button></div>
  </div>`);
  if(preferPatient) document.getElementById("f-pat").value = preferPatient;
}
async function cpEnrollSubmit(){
  const battery=[...document.querySelectorAll("#f-batt .chip.on")].map(c=>c.dataset.b);
  try{
    await api(API_ACT, {action:"prog-save", patientId:val("f-pat"), track:val("f-track"), startDate:val("f-date"), battery, baselineSummary:val("f-base"), baselineDate:val("f-date")});
    toast("Enrolled in the 12-week program"); closeModal(); refreshSoft();
  }catch(e){ document.getElementById("f-err").textContent = e.message; }
}
function cpRetest(id){
  const e = D.charmedProgram.find(x=>x.id===id); if(!e) return;
  openModal(`<h3>Week 12 — Cognitive Retest</h3><div class="msub">${esc(patLabel(e.patient))} · re-run the baseline battery and log results.</div>
  <div class="f">

/* ============ The Porter House — Life Readiness, BH Screening & Growth Plan ============ */
const PH_DOMAINS = [
 {d:"Home & Housing", skills:["Keeps living space clean","Does laundry independently","Basic upkeep / reports maintenance","Understands house rules & lease basics"]},
 {d:"Money & Finances", skills:["Has and manages a bank account","Builds & follows a weekly budget","Pays bills on time","Understands benefits (SNAP/SSI/etc.)"]},
 {d:"Food & Nutrition", skills:["Plans meals for the week","Grocery shops within budget","Cooks 5+ basic meals","Safe food storage & handling"]},
 {d:"Health & Medication", skills:["Takes medications as prescribed","Schedules & keeps appointments","Has insurance card & knows how to use it","Knows urgent vs routine care"]},
 {d:"BH Self-Management", skills:["Names triggers & early warning signs","Uses coping skills that work","Has & uses a crisis plan","Engages in therapy/BHI consistently"]},
 {d:"Work & School", skills:["Resume & ID ready","Actively job searching or enrolled","Interview & workplace communication","Maintains attendance & reliability"]},
 {d:"Transportation", skills:["Navigates bus/transit","Plans routes & timing","Has transit cards/apps set up","Backup plan when transport fails"]},
 {d:"Legal & Documents", skills:["Has state ID","Has vital documents (SS card, birth certificate)","Meets legal obligations (court/probation if any)","Understands tenant rights"]},
 {d:"Social & Communication", skills:["Sets & holds boundaries","Resolves conflict without escalation","Has 2+ supportive contacts","Asks for help appropriately"]},
 {d:"Daily Living", skills:["Consistent daily routine","Hygiene & self-care","Healthy sleep schedule","Manages phone & communication"]},
];
const PH_SCALE = ["1 · Full support","2 · Developing","3 · Nearly independent","4 · Independent"];
const PH_DRIVERS = ["Substance use / in recovery","Untreated or undertreated mental illness","Trauma history","Housing instability history","Family conflict / estrangement","Unemployment / income loss","Justice involvement","Medical condition","Domestic violence","Aging out of foster care","Other"];

function phWeek(moveIn){ if(!moveIn) return 0; return Math.min(14, Math.floor((Date.now()-new Date(moveIn))/(7*86400000))+1); }
function phAutoStage(week, saved){
  if(["Graduated — Independent","Extended Stay","Discharged — Other"].includes(saved)) return saved;
  if(week<=4) return "Month 1 — Stabilize & Assess";
  if(week<=8) return "Month 2 — Build Skills";
  if(week<=13) return "Month 3 — Launch Prep";
  return "Launch Review Due";
}
function phPct(lr){
  const vals = Object.values(lr||{}).map(Number).filter(n=>n>=1);
  if(!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/(vals.length*4))*100);
}
function phDomainAvgs(lr){
  return PH_DOMAINS.map((dom,di)=>{
    const vals = dom.skills.map((_,si)=>Number((lr||{})[`d${di}s${si}`])).filter(n=>n>=1);
    return { d: dom.d, avg: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null };
  });
}

      const wk = phWeek(p.moveIn);

          ${p.gad!==null?`<span class="pill ${gadHot?"alert":"ok"}">GAD-7 ${p.gad}</span>`:""}
          ${(phqHot||gadHot)?`<span class="pill alert">escalate to Amaris</span>`:""}
        </div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
          ${p.basePct!==null?`<div style="min-width:220px;flex:1"><div style="font-size:11px;font-weight:700;margin-bottom:3px">Readiness: ${p.basePct}% at move-in ${p.latestPct!==null?`→ <span style="color:${p.latestPct>=p.basePct?"var(--sage-deep,#6d7d5f)":"var(--alert)"}">${p.latestPct}% now</span>`:""}</div>
            <div style="height:8px;background:var(--line);border-radius:5px;position:relative">
              <div style="height:8px;width:${p.basePct}%;background:var(--sand);border-radius:5px;position:absolute"></div>
              ${p.latestPct!==null?`<div style="height:8px;width:${p.latestPct}%;background:var(--sage);border-radius:5px;position:absolute"></div>`:""}
            </div></div>`:`<span class="pill warn">Baseline assessment needed</span>`}

        ${p.drivers.length?`<div style="margin-bottom:8px">${p.drivers.map(d=>`<span class="pill gray">${esc(d)}</span>`).join(" ")}</div>`:""}
        ${p.goals.length?`<div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px"><b>Goals:</b> ${p.goals.filter(g=>g.status!=="Done").length} active · ${p.goals.filter(g=>g.status==="Done").length} done</div>`:""}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${!p.baseline?`<button class="btn sm" onclick="phLR('${p.id}','baseline')">Baseline assessment</button>`:`<button class="btn sm sec" onclick="phLR('${p.id}','latest')">Re-assess readiness</button>`}
          <button class="btn sm sec" onclick="phScreen('${p.id}')">Log BH screen</button>

            ? `<button class="btn sm" onclick="act({action:'ph-plan-save',id:'${p.id}',stage:'Graduated — Independent'},'Graduated — independent! 🏠')">Graduate</button>
               <button class="btn sm sec" onclick="act({action:'ph-plan-save',id:'${p.id}',stage:'Extended Stay'},'Marked extended stay')">Extend stay</button>`
            : `<span class="pill warn">Re-assessment required before graduation</span>`) : ""}

    }).join("") : `<div class="empty">No active growth plans. Start one at move-in.</div>`}

let PHLR = null;
function phLR(id, kind){
  const p = D.phPlans.find(x=>x.id===id); if(!p) return;
  PHLR = { id, kind, scores: {...(kind==="latest" ? (p.latest||p.baseline||{}) : (p.baseline||{}))} };
  phLRRender(p);
}
function phLRRender(p){
  const rows = PH_DOMAINS.map((dom,di)=>`
    <div class="res-cat">${esc(dom.d)}</div>
    ${dom.skills.map((s,si)=>{
      const k = `d${di}s${si}`, v = Number(PHLR.scores[k])||0;
      return `<div class="awv-q"><div class="awv-l">${esc(s)}</div><div class="needs">
        ${PH_SCALE.map((lbl,i)=>`<button class="chip ${v===i+1?"on":""}" onclick="phLRSet('${k}',${i+1})">${lbl}</button>`).join("")}
      </div></div>`;
    }).join("")}`).join("");
  const pct = phPct(PHLR.scores);
  openModal(`<h3>${PHLR.kind==="baseline"?"🧭 Life Readiness — Baseline":"🧭 Life Readiness — Re-assessment"}</h3>
  <div class="msub">${esc(patLabel(p.patient))} · 1 = full support needed → 4 = independent</div>
  <div class="f awv-body">${rows}</div>
  <p class="lede" style="margin-top:8px">Overall readiness so far: <b>${pct!==null?pct+"%":"—"}</b> ${pct!==null&&PHLR.kind==="latest"&&p.basePct!==null?`(baseline was ${p.basePct}%)`:""}</p>
  <div class="ferr" id="f-err"></div>
  <div class="macts"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="phLRSave()">Save assessment</button></div>`);
  const body = document.querySelector(".mcard"); if(body) body.style.maxWidth = "720px";
}
function phLRSet(k, v){
  PHLR.scores[k] = (PHLR.scores[k]===v ? undefined : v);
  const p = D.phPlans.find(x=>x.id===PHLR.id);
  const scroll = document.querySelector(".awv-body") ? document.querySelector(".awv-body").scrollTop : 0;
  phLRRender(p);
  const nb = document.querySelector(".awv-body"); if(nb) nb.scrollTop = scroll;
}
async function phLRSave(){
  const clean = Object.fromEntries(Object.entries(PHLR.scores).filter(([,v])=>v>=1));
  const pct = phPct(clean);
  if(pct===null){ document.getElementById("f-err").textContent = "Score at least a few skills first."; return; }
  try{
    await api(API_ACT, {action:"ph-plan-save", id:PHLR.id, lrKind:PHLR.kind, lr:clean, lrPct:pct});
    toast(`${PHLR.kind==="baseline"?"Baseline":"Re-assessment"} saved — ${pct}% ready`); closeModal(); PHLR=null; refreshSoft();
  }catch(e){ document.getElementById("f-err").textContent = e.message; }
}

function phScreen(id){
  const p = D.phPlans.find(x=>x.id===id); if(!p) return;
  const hist = p.screens.length ? `<div class="awv-q"><div class="awv-l">History</div>${p.screens.slice(-4).map(s=>`<span class="pill gray">${esc(s.date||"")}: PHQ ${esc(String(s.phq9??"—"))} · GAD ${esc(String(s.gad7??"—"))}</span>`).join(" ")}</div>` : "";

  <div class="f">${hist}

async function phScreenSave(id){
  const p = D.phPlans.find(x=>x.id===id); if(!p) return;

function phGoals(id){

  window.__phGoals = p.goals.map(g=>({...g}));

function phGoalsRender(id){
  const p = D.phPlans.find(x=>x.id===id);
  const g = window.__phGoals;
  openModal(`<h3>Individualized growth goals</h3><div class="msub">${esc(patLabel(p.patient))} · built from the lowest-scoring domains + the symptom drivers</div>
  <div class="f">
    ${g.length?g.map((x,i)=>`<div style="display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px">
      <div style="flex:1"><b style="font-size:12.5px">${esc(x.domain||"")}</b> · ${esc(x.goal)} <span class="pill gray">${esc(x.month||"")}</span></div>
      <button class="chip ${x.status==="Done"?"on":""}" onclick="__phGoals[${i}].status=__phGoals[${i}].status==='Done'?'Active':'Done';phGoalsRender('${id}')">${x.status==="Done"?"✓ Done":"Active"}</button>
      <button class="chip" onclick="__phGoals.splice(${i},1);phGoalsRender('${id}')">✕</button>
    </div>`).join(""):'<div class="empty">No goals yet — add or auto-suggest.</div>'}
    <div class="res-cat">Add a goal</div>
    <label>Domain</label><select id="g-dom">${PH_DOMAINS.map(d=>`<option>${d.d}</option>`).join("")}<option>BH / Mind & Mood</option></select>
    <label>Goal</label><input type="text" id="g-goal" placeholder="Open a bank account and set up direct deposit">
    <label>Target</label><select id="g-mon"><option>Month 1</option><option>Month 2</option><option>Month 3</option></select>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn sm sec" onclick="if(val('g-goal')){__phGoals.push({domain:val('g-dom'),goal:val('g-goal'),month:val('g-mon'),status:'Active'});phGoalsRender('${id}')}">+ Add goal</button>
      <button class="btn sm sec" onclick="phGoalsSuggest('${id}')">✨ Auto-suggest from scores & drivers</button>
    </div>
    <div class="ferr" id="f-err"></div>
    <div class="macts"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="phGoalsSave('${id}')">Save goals</button></div>
  </div>`);
}
function phGoalsSuggest(id){
  const p = D.phPlans.find(x=>x.id===id);
  const lr = p.latest || p.baseline;
  const sugg = [];
  if(lr){
    phDomainAvgs(lr).filter(x=>x.avg!==null && x.avg<2.5).forEach(x=>
      sugg.push({domain:x.d, goal:`Bring ${x.d} to "nearly independent" — weekly practice with case lead`, month:"Month 2", status:"Active"}));
  }
  if(p.drivers.includes("Unemployment / income loss")) sugg.push({domain:"Work & School", goal:"Resume complete + 5 applications/week; connect with workforce program", month:"Month 2", status:"Active"});
  if(p.drivers.includes("Substance use / in recovery")) sugg.push({domain:"BH / Mind & Mood", goal:"Consistent recovery supports — group attendance + relapse prevention plan reviewed with Mind & Mood", month:"Month 1", status:"Active"});
  if(p.drivers.includes("Untreated or undertreated mental illness")||p.drivers.includes("Trauma history")) sugg.push({domain:"BH / Mind & Mood", goal:"Engaged in therapy/BHI — monthly screens trending down", month:"Month 1", status:"Active"});
  if(p.drivers.includes("Justice involvement")) sugg.push({domain:"Legal & Documents", goal:"All court/probation obligations mapped with dates; no missed appearances", month:"Month 1", status:"Active"});
  const existing = new Set(window.__phGoals.map(g=>g.goal));
  sugg.filter(s=>!existing.has(s.goal)).forEach(s=>window.__phGoals.push(s));
  phGoalsRender(id);
