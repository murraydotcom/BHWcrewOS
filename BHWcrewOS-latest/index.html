/* ============ Medicare Prevention Tracker (Stedi → HETS) ============ */
const API_STEDI = "/.netlify/functions/stedi";

function prevCard(){
  if(!D.prevention) return "";
  const medicare = (D.patients||[]).filter(p=>["Medicare","Medicare + Medicaid"].includes(p.insurance));
  if(!medicare.length && !D.prevention.length) return "";
  const byPat = Object.fromEntries(D.prevention.map(r=>[r.patient, r]));
  // Hub-completed AWVs override: done here within 11 months = Recently done, no waiting on CMS records
  (D.awv||[]).filter(e=>e.status==="Completed" && e.date).forEach(e=>{
    const months = (Date.now()-new Date(e.date))/(30.44*86400000);
    if(months < 11){
      const r = byPat[e.patient] || (byPat[e.patient] = {patient:e.patient, coverage:"Active", planType:"Unknown", maName:"", lastChecked:null, awvNext:null});
      r.awvStatus = "Recently done"; r.awvLast = e.date; r.doneInHub = true;
    }
  });
  const rows = medicare.map(p=>({ p, r: byPat[p.id] || null }))
    .sort((a,b)=>{
      const rank = x => !x.r ? 1 : x.r.awvStatus==="Due now" ? 0 : x.r.awvStatus==="Upcoming" ? 2 : x.r.awvStatus==="Unknown" ? 3 : 4;
      return rank(a)-rank(b);
    });
  const due = rows.filter(x=>x.r && x.r.awvStatus==="Due now").length;
  return `<div class="card">
    <h2>Medicare prevention — AWV work queue <span class="grow"></span>${due?`<span class="pill alert">${due} due now</span>`:""}<button class="btn sm" onclick="prevBatch()">⟳ Run batch check</button></h2>
    <p class="lede">Live from CMS (HETS) via Stedi: coverage, plan type, and AWV eligibility per Medicare patient. Due patients are one tap from the AWV wizard.</p>
    ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Patient</th><th>Coverage</th><th>Plan</th><th>AWV</th><th>Gaps</th><th>Checked</th><th></th></tr></thead><tbody>
      ${rows.map(({p,r})=>`<tr>
        <td><b>${esc(p.name)}</b> ${!p.hasMbi?'<span class="pill warn">MBI needed</span>':""}</td>
        <td>${r?`<span class="pill ${r.coverage==="Active"?"ok":r.coverage==="Inactive"?"alert":"warn"}">${esc(r.coverage)}</span>`:'<span class="pill gray">Never checked</span>'}</td>
        <td>${r?esc(r.planType==="Medicare Advantage"?("MA"+(r.maName?" · "+r.maName:"")):r.planType):"—"}</td>
        <td>${r?`<span class="pill ${r.awvStatus==="Due now"?"alert":r.awvStatus==="Upcoming"?"warn":r.awvStatus==="Recently done"?"ok":"gray"}">${esc(r.awvStatus)}</span>${r.awvNext?` <span class="pill gray">next ${esc(r.awvNext)}</span>`:""}${r.awvLast?` <span class="pill gray">last ${esc(r.awvLast)}${r.doneInHub?" ✓ here":""}</span>`:""}`:"—"}</td>
        <td>${gapsCell(p)}</td>
        <td style="font-size:11.5px;color:var(--ink-soft)">${r?esc(r.lastChecked||""):""}</td>
        <td style="white-space:nowrap">
          ${!p.hasMbi?`<button class="btn sm sec" onclick="prevMbi('${p.id}')">+ MBI</button>`:`<button class="btn sm sec" onclick="prevCheck('${p.id}')">Check</button>`}
          ${r&&r.awvStatus==="Due now"?`<button class="btn sm warn" onclick="prevStartAwv('${p.id}')">▶ Start AWV</button>`:""}
        </td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">No Medicare patients in the index yet — set Insurance to Medicare on registration and they appear here.</div>`}
  </div>`;
}

// ---- Care gaps from the payer Medicare Wellness Report (one cached list read) ----
// CARE_GAPS: null = not yet loaded, "err" = load failed, else { byId, byName }.
let CARE_GAPS = null, CARE_GAPS_LOADING = false;
const gapKey = (s) => String(s||"").toLowerCase().split(",").reverse().join(" ").replace(/[^a-z0-9]/g,"");
function gapsFor(p){
  if(!CARE_GAPS || CARE_GAPS==="err") return null;
  return (p.memberId && CARE_GAPS.byId[p.memberId.toLowerCase()]) || CARE_GAPS.byName[gapKey(p.name)] || null;
}
async function gapsEnsure(){
  if(CARE_GAPS!==null || CARE_GAPS_LOADING) return;
  CARE_GAPS_LOADING = true;
  try{
    const r = await api(API_GAPS, {action:"list"});
    const byId = {}, byName = {};
    for(const pt of (r.patients||[])){
      const rec = { ...pt, open: pt.gaps.filter(g=>g.open) };
      if(pt.memberId) byId[pt.memberId.toLowerCase()] = rec;
      if(pt.name) byName[gapKey(pt.name)] = rec;
    }
    CARE_GAPS = { byId, byName };
  }catch(e){ CARE_GAPS = "err"; }
  CARE_GAPS_LOADING = false;
  // Repaint the current view so the Gaps column fills in.
  const active = document.querySelector(".tab.active")?.dataset.view;
  try{ buildViews(); activate(active || cssId(D.user.landing)); }catch(_){}
}
function gapsCell(p){
  if(CARE_GAPS===null){ gapsEnsure(); return '<span class="pill gray">…</span>'; }
  if(CARE_GAPS==="err") return '<span class="pill gray">—</span>';
  const rec = gapsFor(p);
  if(!rec) return '<span class="pill gray">—</span>';
  const open = rec.open.length;
  return `<button class="btn sm ${open?"warn":"sec"}" onclick="gapsDetail('${p.id}')">${open?`${open} open`:"none open"}</button>`;
}
function gapsDetail(patientId){
  const p = (D.patients||[]).find(x=>x.id===patientId) || {};
  const rec = gapsFor(p);
  if(!rec){ toast("No payer gap rows on file for this patient"); return; }
  const open = rec.gaps.filter(g=>g.open), other = rec.gaps.filter(g=>!g.open);
  const line = g=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(g.label)}${g.hcpcs?` <span class="pill gray">${esc(g.hcpcs)}</span>`:""}</span><span class="pill ${g.open?"alert":"gray"}">${esc(g.state)}</span></div>`;
  openModal(`<h3>Care gaps — ${esc(p.name||rec.name)}</h3>
  <div class="msub">Medicare Wellness Report${rec.payer?" · "+esc(rec.payer):""}${rec.memberId?" · Member "+esc(rec.memberId):""}</div>
  <div class="f">
    <div class="awv-q"><div class="awv-l">Open (${open.length})</div>${open.length?open.map(line).join(""):'<span class="pill ok">None flagged this cycle</span>'}</div>
    ${other.length?`<div class="awv-q"><div class="awv-l">Needs info / other plan (${other.length})</div>${other.map(line).join("")}</div>`:""}
    <p class="lede">Source: the payer Wellness Report uploaded to the Gaps in Care Management page. Close gaps at the visit, then next month's upload clears them.</p>
    <div class="macts"><button class="btn sec" onclick="closeModal()">Close</button>${(D.awv&&["Medicare","Medicare + Medicaid"].includes(p.insurance))?`<button class="btn" onclick="closeModal();prevStartAwv('${p.id}')">▶ Start AWV</button>`:""}</div>
  </div>`);
}

async function prevBatch(){
  let offset = 0, total = null, checked = 0;
  toast("Batch check started…");
  try{
    while(true){
      const r = await api(API_STEDI, {action:"batch", offset});
      total = r.total; checked += (r.processed||[]).length;
      toast(`Checked ${checked} of ${total}…`);
      if(r.done) break;
      offset = r.nextOffset;
    }
    toast(`✓ Batch complete — ${checked} patient${checked===1?"":"s"} checked`);
    refreshSoft();
  }catch(e){ toast("⚠ Batch stopped: "+e.message); }
  if(total===0) toast("No Medicare patients with an MBI on file yet — add MBIs first");
}

function todayCard(div){
  const cfg = TODAY_TASKS[div]; if(!cfg) return "";
  const now = new Date();
  const dow = now.getDay();
  const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const dateKey = now.toISOString().slice(0,10);
  const storeKey = `bhw-today-${(D.user&&D.user.staffId)||"x"}-${div}-${dateKey}`;
  let done = [];
  try { done = JSON.parse(localStorage.getItem(storeKey)||"[]"); } catch {}
  const weekend = (dow===0||dow===6);
  const day = cfg.days[dow];
  const weekOfMonth = Math.min(4, Math.ceil(now.getDate()/7));
  const monthlyLine = cfg.monthly ? cfg.monthly[weekOfMonth-1] : null;
  const items = weekend ? [] : [...cfg.anchors.map((t,i)=>({id:"a"+i,t,anchor:true})), ...(day?day.items.map((t,i)=>({id:"d"+i,t})):[])];
  const doneCount = items.filter(x=>done.includes(x.id)).length;
  window.__todayStore = { storeKey, done };
  return `<div class="card" style="border-left:4px solid var(--clay)">
    <h2>📆 Today — ${dayNames[dow]}${day?` · ${esc(day.t)}`:""} <span class="grow"></span>${items.length?`<span class="pill ${doneCount===items.length?"ok":"gray"}" id="today-progress">${doneCount}/${items.length}</span>`:""}</h2>
    ${weekend
      ? `<p class="lede">It's the weekend — rest is part of the plan. Monday brings: <b>${esc(cfg.days[1].t)}</b>.</p>`
      : `${monthlyLine?`<p class="lede" style="margin-bottom:10px">🗓 ${esc(monthlyLine)}</p>`:""}
    <div class="res-cat">The anchors — every day</div>
    ${items.filter(x=>x.anchor).map(x=>todayRow(x, done)).join("")}
    ${day?`<div class="res-cat" style="margin-top:14px">${esc(dayNames[dow])}'s focus</div>
    ${items.filter(x=>!x.anchor).map(x=>todayRow(x, done)).join("")}`:""}
    <p class="lede" style="margin-top:10px">Checks reset each morning · the full playbook with step-by-step instructions lives in Notion (Resources below).</p>`}
  </div>`;
}
function todayRow(x, done){
  const on = done.includes(x.id);
  return `<div class="tsk ${on?"on":""}" onclick="todayToggle('${x.id}',this)"><span class="tsk-box">${on?"✓":""}</span><span>${esc(x.t)}</span></div>`;
}
function todayToggle(id, el){
  const s = window.__todayStore; if(!s) return;
  s.done = s.done.includes(id) ? s.done.filter(x=>x!==id) : [...s.done, id];
  try { localStorage.setItem(s.storeKey, JSON.stringify(s.done)); } catch {}
  el.classList.toggle("on");
  el.querySelector(".tsk-box").textContent = el.classList.contains("on") ? "✓" : "";
  const all = document.querySelectorAll(".tsk").length;
  const onN = document.querySelectorAll(".tsk.on").length;
  const p = document.getElementById("today-progress");
  if(p){ p.textContent = `${onN}/${all}`; p.className = "pill " + (onN===all?"ok":"gray"); }
}

function refFillTemplateOptions(){
  const tpl=document.getElementById("f-tpl"); if(!tpl) return;
  const list=refCurrentList();
  tpl.innerHTML = `<option value="">${list.length?"— write my own —":"— no templates for this destination yet —"}</option>` +
    list.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join("");
}
function refApplyTemplate(){
  const tpl=document.getElementById("f-tpl"); if(!tpl||tpl.value==="") return;
  const t=refCurrentList()[Number(tpl.value)]; if(!t) return;
  if(t.type){ const ty=document.getElementById("f-type"); if(ty) ty.value=t.type; }
  const det=document.getElementById("f-det"); if(det) det.value=t.body||"";
  if(t.priority){ const pr=document.getElementById("f-pri"); if(pr) pr.value=t.priority; }
  if(t.neededBy){ const wn=document.getElementById("f-when"); if(wn) wn.value=t.neededBy; }
}
async function saveRefTemplate(){
  const err=document.getElementById("f-err"); if(err) err.textContent="";
  const to=val("f-to"), body=val("f-det");
  if(!to){ if(err) err.textContent="Pick a destination first."; return; }
  if(!body.trim()){ if(err) err.textContent="Write the referral text before saving it as a template."; return; }
  const name=prompt("Name this template — staff will see it under "+to+"'s templates:", "");
  if(!name) return;
  try{
    await api(API_ACT, {action:"referral-template-save", destination:to, name, body, type:val("f-type"), priority:val("f-pri"), neededBy:val("f-when")});
    REF_TEMPLATES=null; // force refresh next time the form opens
    toast("✓ Saved as a template for "+to);
  }catch(e){ if(err) err.textContent=e.message; }
}
async function submitReferral(){
  try{
    const _when=val("f-when");
    await act({action:"referral-create", patientId:val("f-pat"), from:val("f-from"), to:val("f-to"), type:val("f-type"), device:val("f-dev"), details:(_when?`[Needed by: ${_when}] `:"")+val("f-det"), priority:val("f-pri")}, "Referral sent", true);
    closeModal();
  }catch(e){ document.getElementById("f-err").textContent = e.message; }
}

function openHandoffForm(from){
  openModal(`<h3>New warm handoff</h3><div class="msub">Carries the summary across the division wall and lands in their inbox.</div>
  <div class="f">
    <label>Patient</label><select id="f-pat"><option value="">Select patient…</option>${patientOptions()}</select>
    <div class="row"><div><label>From</label><select id="f-from">${divisionOptions(D.visibleDivisions)}</select></div>
    <div><label>To</label><select id="f-to">${divisionOptions(["Primary Care","CharmEd Minds","Mind & Mood Recovery","The Porter House","Care Management","Flow"])}</select></div></div>
    <label>Warm handoff summary — reason, context, what they need to know</label><textarea id="f-sum"></textarea>
    <label>Needs</label><div class="needs" id="f-needs">${NEEDS.map(n=>`<button class="chip" type="button" onclick="this.classList.toggle('on')" data-n="${n}">${n}</button>`).join("")}</div>
    <label>First visit date (if known)</label><input type="date" id="f-date">
    <div class="ferr" id="f-err"></div>
    <div class="macts"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitHandoff()">Send handoff</button></div>
  </div>`);
  if(from) document.getElementById("f-from").value = from;
}
async function submitHandoff(){
  const needs=[...document.querySelectorAll("#f-needs .chip.on")].map(c=>c.dataset.n);
  try{
    await act({action:"handoff-create", patientId:val("f-pat"), from:val("f-from"), to:val("f-to"), summary:val("f-sum"), needs, scheduledDate:val("f-date")}, "Warm handoff sent", true);
    closeModal();
  }catch(e){ document.getElementById("f-err").textContent = e.message; }
}

function openAvailabilityForm(){
  openModal(`<h3>Submit availability</h3><div class="msub">Ops turns availability into room bookings.</div>
  <div class="f">
    <label>Date</label><input type="date" id="f-date">
    <div class="row"><div><label>Start</label><input type="time" id="f-start"></div><div><label>End</label><input type="time" id="f-end"></div></div>
    <label>Repeats</label><select id="f-rec"><option>One-time</option><option>Weekly</option><option>Biweekly</option></select>
    <label>Notes</label><input type="text" id="f-note" placeholder="Prefer AM · telehealth only · etc.">
    <div class="ferr" id="f-err"></div>
    <div class="macts"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitAvailability()">Submit</button></div>
  </div>`);
}
async function submitAvailability(){
  try{
    await act({action:"availability-submit", date:val("f-date"), start:val("f-start"), end:val("f-end"), recurring:val("f-rec"), notes:val("f-note")}, "Availability submitted", true);
    closeModal();
  }catch(e){ document.getElementById("f-err").textContent = e.message; }
}

function openBookingForm(){
  openModal(`<h3>Book a room</h3><div class="msub">The room's allowed services are enforced — pick a room to filter services.</div>
  <div class="f">
    <label>Room</label><select id="f-room" onchange="filterServices()"><option value="">Select room…</option>${D.rooms.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}</select>
    <label>Service</label><select id="f-svc">${SERVICES.map(s=>`<option>${s}</option>`).join("")}</select>
    <label>Staff (hold Ctrl/Cmd for multiple)</label><select id="f-staff" multiple size="4">${D.staff.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select>
    <div class="row"><div><label>Date</label><input type="date" id="f-date"></div><div><label>Division</label><select id="f-div">${divisionOptions(["Primary Care","CharmEd Minds","Mind & Mood Recovery","The Porter House","Care Management","Flow","Shared"])}</select></div></div>
    <div class="row"><div><label>Start</label><input type="time" id="f-start"></div><div><label>End</label><input type="time" id="f-end"></div></div>
    <label>Notes (no patient identifiers needed)</label><input type="text" id="f-note">
    <div class="ferr" id="f-err"></div>
    <div class="macts"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitBooking()">Book</button></div>
  </div>`);
}
function filterServices(){
  const roomId = val("f-room");
  const room = D.rooms.find(r=>r.id===roomId);
  const svc = document.getElementById("f-svc");
  const list = room ? room.allowed : SERVICES;
  svc.innerHTML = list.map(s=>`<option>${esc(s)}</option>`).join("");
}
async function submitBooking(){
  const staffIds = [...document.getElementById("f-staff").selectedOptions].map(o=>o.value);
  try{
    await act({action:"booking-create", roomId:val("f-room"), service:val("f-svc"), staffIds, date:val("f-date"), start:val("f-start"), end:val("f-end"), division:val("f-div"), notes:val("f-note")}, "Booked", true);
    closeModal();
  }catch(e){ document.getElementById("f-err").textContent = e.message; }
}

function promptComplete(id){
  const note = prompt("Completion note — what was done? (comes back to the sender)");
  if(note===null) return;
  act({action:"referral-status", id, status:"Completed", note}, "Referral completed");
}
function promptSchedule(id){
  const d = prompt("First visit date (YYYY-MM-DD):");
  if(!d) return;
  act({action:"handoff-status", id, status:"Scheduled", scheduledDate:d}, "Visit date set");
}

const val = id => document.getElementById(id)?.value?.trim?.() ?? document.getElementById(id)?.value ?? "";

async function act(body, okMsg, rethrow){
  try{
    await api(API_ACT, body);
    toast(okMsg);
    await refreshSoft();
  }catch(e){
    if(rethrow) throw e;
    toast("⚠ " + e.message);
  }
}
async function refreshSoft(){
  const active = document.querySelector(".tab.active")?.dataset.view;
  D = await api(API_DATA);
  buildRail(); buildViews();
  activate(active || cssId(D.user.landing));
}

/* ---------- boot ---------- */
if(TOKEN){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  refresh().catch(()=>logout());
}
</script>
</body>
</html>
