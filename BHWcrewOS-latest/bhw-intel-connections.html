<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BHW Intel Connections · CrewOS</title>
  <script src="/crew-provider-gate.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/bhw-tokens.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--cream,#f7f2e8);color:var(--ink,#263238);font-family:Montserrat,system-ui,sans-serif;line-height:1.55}.shell{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:34px 0 64px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--teal,#478f8a)}h1{font-size:clamp(30px,5vw,52px);line-height:1.03;letter-spacing:-.035em;margin:9px 0 10px;color:var(--navy,#153148)}.lede{max-width:760px;color:var(--muted,#65777e);font-size:15px}.refresh{border:1px solid rgba(21,49,72,.2);background:#fff;color:var(--navy,#153148);border-radius:999px;padding:10px 16px;font:700 11px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.refresh:disabled{opacity:.55;cursor:wait}.stamp{margin-top:8px;font-size:11px;color:var(--muted,#65777e);text-align:right}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 18px}.summary article,.card,.boundary,.cutover{background:rgba(255,255,255,.86);border:1px solid rgba(21,49,72,.12);border-radius:16px;box-shadow:0 14px 35px -30px rgba(21,49,72,.55)}.summary article{padding:18px}.summary strong{display:block;font-size:25px;color:var(--navy,#153148)}.summary span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted,#65777e)}.cutover{margin-top:28px;padding:22px;border-left:5px solid var(--gold,#c99837)}.cutover.done{border-left-color:#4f9b6c}.cutover h2{font-size:18px;margin:0;color:var(--navy,#153148)}.cutover p{font-size:12.5px;color:var(--muted,#65777e);margin:7px 0}.cut-list{display:flex;flex-wrap:wrap;gap:6px;margin:13px 0}.cut-item{padding:5px 8px;border-radius:8px;background:#fff0cc;color:#895c12;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.cut-item.ok{background:#e2f5e9;color:#28734d}.cut-btn{border:0;border-radius:999px;background:var(--navy,#153148);color:#fff;padding:11px 17px;font:800 10px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.cut-btn:disabled{opacity:.55;cursor:wait}.boundary{padding:19px 20px;margin:0 0 28px;border-left:5px solid var(--gold,#c99837)}.boundary h2{font-size:14px;margin:0 0 7px;color:var(--navy,#153148)}.boundary p{margin:4px 0;font-size:12.5px;color:var(--muted,#65777e)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:32px 0 13px}.section-head h2{font-size:21px;margin:0;color:var(--navy,#153148)}.section-head p{font-size:12px;color:var(--muted,#65777e);margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:20px;position:relative;overflow:hidden}.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,#7a9)}.card-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.card h3{font-size:16px;line-height:1.25;margin:0;color:var(--navy,#153148)}.source{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted,#65777e);margin-top:5px}.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:9px;line-height:1;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.connected,.active{color:#28734d;background:#e2f5e9}.degraded,.limited{color:#895c12;background:#fff0cc}.blocked{color:#9b3b3b;background:#fee6e6}.description{font-size:12.5px;color:var(--muted,#65777e);margin:13px 0}.metrics{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.metric{background:#f4f1e9;border-radius:10px;padding:9px 11px;min-width:104px}.metric strong{display:block;color:var(--navy,#153148);font-size:18px}.metric span{display:block;color:var(--muted,#65777e);font-size:9px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}.legacy{border-top:1px solid rgba(21,49,72,.1);margin-top:14px;padding-top:12px;font-size:11px;color:var(--muted,#65777e)}.legacy b{color:var(--ink,#263238)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.action{display:inline-flex;align-items:center;border-radius:999px;padding:8px 12px;background:var(--navy,#153148);color:#fff;text-decoration:none;font-size:10px;font-weight:800;letter-spacing:.05em}.action.secondary{background:transparent;color:var(--navy,#153148);border:1px solid rgba(21,49,72,.2)}.error{margin-top:11px;padding:10px;border-radius:9px;background:#feecec;color:#8c3333;font-size:11px}.loading{padding:50px;text-align:center;color:var(--muted,#65777e);background:rgba(255,255,255,.7);border-radius:18px;border:1px solid rgba(21,49,72,.12)}.footer-note{font-size:11px;color:var(--muted,#65777e);margin-top:24px}.fatal{border-color:#e2a6a6;background:#fff0f0}.fatal h2{color:#8c3333}@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{display:block}.refresh{margin-top:18px}.stamp{text-align:left}}@media(max-width:460px){.summary{grid-template-columns:1fr 1fr}.summary article{padding:14px}.card-head{display:block}.status{margin-top:10px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div>
        <div class="eyebrow">CrewOS · Administrator control center</div>
        <h1>BHW Intel Connections</h1>
        <p class="lede">One place to complete the Notion exit, confirm the active system of record, and verify where every legacy workflow lives now.</p>
      </div>
      <div><button class="refresh" id="refresh" type="button">Refresh status</button><div class="stamp" id="stamp">Checking connections…</div></div>
    </div>
    <div id="content" class="loading" role="status">Checking CrewHQ Database, transition, and BHW Cloud connections…</div>
  </main>
  <script>
    const API='/.netlify/functions/intel-connections',CUTOVER_API='/.netlify/functions/notion-cutover';
    const content=document.getElementById('content');
    const refresh=document.getElementById('refresh');
    const stamp=document.getElementById('stamp');
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const words=value=>String(value||'').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/[-_]/g,' ').replace(/\b\w/g,char=>char.toUpperCase());
    const status=item=>`<span class="status ${esc(item.state)}">${esc(item.label||words(item.state))}</span>`;
    const link=(action,secondary=false)=>`<a class="action${secondary?' secondary':''}" href="${esc(action.href)}"${action.external?' target="_blank" rel="noopener"':''}>${esc(action.label)} →</a>`;
    function controlCard(item){
      const metrics=Object.entries(item.metrics||{}).map(([key,value])=>`<div class="metric"><strong>${esc(value)}</strong><span>${esc(words(key))}</span></div>`).join('');
      return `<article class="card" style="--accent:${item.state==='connected'||item.state==='active'?'#4f9b6c':item.state==='blocked'?'#bd5a5a':'#c99837'}"><div class="card-head"><div><h3>${esc(item.name)}</h3><div class="source">${esc(item.source)}${item.mode?' · '+esc(item.mode):''}</div></div>${status(item)}</div>${metrics?`<div class="metrics">${metrics}</div>`:''}${item.error?`<div class="error">${esc(item.error)}</div>`:''}<div class="actions">${link(item.action)}${item.sourceHref?link({label:'Open Notion source',href:item.sourceHref,external:true},true):''}</div></article>`;
    }
    function workflowCard(item){
      const legacy=item.legacySource||{};
      const lab=item.labActivation?`<div class="legacy"><b>Lab activation:</b> ${status(item.labActivation)}</div>`:'';
      return `<article class="card" style="--accent:${item.state==='active'?'#4f9b6c':'#c99837'}"><div class="card-head"><div><h3>${esc(item.name)}</h3><div class="source">Current authority · ${esc(item.authority)}</div></div>${status({state:item.state,label:words(item.state)})}</div><p class="description">${esc(item.description)}</p><div class="legacy"><b>Notion:</b> ${esc(legacy.label||'Status unavailable')} · patient rows read: <b>${legacy.rowsRead?'yes':'no'}</b>${legacy.missingProperties?.length?`<br>Missing: ${esc(legacy.missingProperties.join(', '))}`:''}</div>${lab}<div class="actions">${(item.actions||[]).map((action,index)=>link(action,index>0)).join('')}${legacy.sourceHref?link({label:'Open legacy Notion source',href:legacy.sourceHref,external:true},true):''}</div></article>`;
    }
    let currentReport=null;
    function cutoverPanel(cutover){
      if(cutover.mode==='database')return `<section class="cutover done"><div class="card-head"><div><h2>Notion runtime disconnected</h2><p>CrewHQ Database is now authoritative for all eight operational controls. The Notion connection can be removed without breaking these workflows.</p></div>${status({state:'connected',label:'Cutover complete'})}</div></section>`;
      if(cutover.databaseReady===false)return `<section class="cutover fatal"><div class="card-head"><div><h2>CrewHQ Database connection required</h2><p>${esc(cutover.databaseError||'The production database connection is not configured.')} CrewOS remains safely on Notion until this is corrected; the disconnect button is disabled.</p></div>${status({state:'blocked',label:'Cutover blocked'})}</div></section>`;
      const items=(cutover.sources||[]).map(item=>`<span class="cut-item${item.verified?' ok':''}">${esc(words(item.namespace))}: ${item.verified?esc(item.importedCount)+' verified':'not imported'}</span>`).join('');
      const resuming=cutover.mode==='cutover';
      return `<section class="cutover"><div class="card-head"><div><h2>${resuming?'Protected cutover paused':'Notion exit ready to run'}</h2><p>${resuming?'Operational writes are paused. Resume now to re-import, verify, and finish the disconnect.':'This protected cutover briefly pauses operational writes, copies and verifies all eight active controls, then switches every runtime read and write to CrewHQ Database.'}</p></div>${status({state:'limited',label:resuming?'Resume cutover':'Notion still connected'})}</div><div class="cut-list">${items}</div><button class="cut-btn" id="cutoverBtn" type="button">${resuming?'Resume verified disconnect':'Import, verify & disconnect'}</button><div class="stamp" id="cutoverProgress"></div></section>`;
    }
    function render(data){
      currentReport=data;
      const s=data.summary;
      content.className='';
      content.innerHTML=`${cutoverPanel(data.cutover)}<section class="summary" aria-label="Connection summary"><article><strong>${esc(s.activeOperationalControls)}/${esc(s.totalOperationalControls)}</strong><span>Operational controls live</span></article><article><strong>${esc(s.connectedCloudServices)}/${esc(s.totalCloudServices)}</strong><span>Cloud services live</span></article><article><strong>${esc(data.workflows.filter(item=>item.state==='active').length)}/${esc(data.workflows.length)}</strong><span>Workflows routed</span></article><article><strong>${data.ok?'Ready':'Review'}</strong><span>Overall status</span></article></section><section class="boundary"><h2>Protected data boundary</h2><p><b>Notion:</b> ${esc(data.boundary.notion)}</p><p><b>BHW Cloud:</b> ${esc(data.boundary.cloud)}</p><p><b>Lab analysis:</b> ${esc(data.boundary.lab)}</p></section><div class="section-head"><div><h2>Active controls</h2><p>Functions managed by CrewHQ Database or BHW Cloud after cutover.</p></div></div><section class="grid">${data.controls.map(controlCard).join('')}</section><div class="section-head"><div><h2>Legacy workflow handoff</h2><p>Patient work remains in its protected BHW Cloud destination.</p></div></div><section class="grid">${data.workflows.map(workflowCard).join('')}</section><p class="footer-note">This page reports connection health and routing only. It does not display patient names, PIN hashes, referral details, care-plan text, lab results, or clinical action content.</p>`;
      document.getElementById('cutoverBtn')?.addEventListener('click',runCutover);
      stamp.textContent='Last checked '+new Date(data.generatedAt).toLocaleString();
    }
    async function cutoverCall(body){
      const token=sessionStorage.getItem('crewos_token')||'';
      const response=await fetch(CUTOVER_API,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(data.error||`Cutover failed (${response.status})`);
      return data;
    }
    async function runCutover(){
      const confirmation=prompt('This briefly pauses operational writes, copies all eight controls into CrewHQ Database, and disconnects the Notion runtime. Type DISCONNECT NOTION to continue.');
      if(confirmation!=='DISCONNECT NOTION')return;
      const button=document.getElementById('cutoverBtn'),progress=document.getElementById('cutoverProgress');
      button.disabled=true;
      try{
        progress.textContent='Pausing operational writes for the final verified snapshot…';
        await cutoverCall({action:'begin',confirmation:'DISCONNECT NOTION'});
        const sources=currentReport.cutover.sources||[];
        for(let index=0;index<sources.length;index++){
          progress.textContent=`Importing and verifying ${words(sources[index].namespace)} (${index+1}/${sources.length})…`;
          await cutoverCall({action:'import',namespace:sources[index].namespace,confirmation:'IMPORT NOTION CONTROLS'});
        }
        progress.textContent='All eight sources and record contents verified. Finalizing disconnect…';
        await cutoverCall({action:'finalize',confirmation:'DISCONNECT NOTION'});
        await load();
        alert('Notion runtime access is disconnected. CrewHQ Database is now authoritative.');
      }catch(error){
        try{await cutoverCall({action:'abort',confirmation:'DISCONNECT NOTION'})}catch{}
        progress.textContent=`${error.message} Notion remains active and operational writes have resumed.`;button.disabled=false
      }
    }
    async function load(){
      refresh.disabled=true;stamp.textContent='Checking connections…';
      try{
        const token=sessionStorage.getItem('crewos_token')||'';
        const response=await fetch(API,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});
        const data=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(data.error||`Status check failed (${response.status})`);
        render(data);
      }catch(error){content.className='boundary fatal';content.innerHTML=`<h2>BHW Intel status could not load</h2><p>${esc(error.message)}</p><p>Administrator access is required. If you are an administrator, sign in again and retry.</p>`;stamp.textContent='Status unavailable'}
      finally{refresh.disabled=false}
    }
    refresh.addEventListener('click',load);load();
  </script>
  <script src="/staff-chat-launcher.js" defer></script>
</body>
</html>
