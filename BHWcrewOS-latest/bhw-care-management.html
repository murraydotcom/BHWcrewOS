<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script src="/crew-provider-gate.js"></script>
<title>Care Management Log · BHW crewOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/bhw-tokens.css">
<style>
:root{--river:#80abbd;--clay:#b07a55;--clay-deep:#8C5A3C;--sage:#a8b59a;--sand:#dcc8b1;--ink:#2b2b33;--soft:#6f6f7a;--ok:#1F6961;--urgent:#B4544B;--line:#e5e0d8;--linen:#f7f5f2}
*{box-sizing:border-box}
body{font-family:var(--sans);background:var(--linen);color:var(--ink);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
header img{height:40px;width:auto}
h1{font-family:var(--serif,Georgia);font-weight:600;font-size:21px;margin:0}
.sub{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay-deep);font-weight:700}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}
select,input[type=text],input[type=date],input[type=datetime-local],input[type=number]{font-family:inherit;font-size:13px;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--river)}
.btn{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:99px;border:0;background:var(--clay);color:#fff;cursor:pointer}
.btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 15px;min-width:120px}
.kpi .n{font-size:22px;font-weight:800;line-height:1}
.kpi .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-top:3px}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1050px;font-size:12.5px}
th{text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);font-weight:700;padding:9px 8px;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#fff}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#faf8f5}
.pt{font-weight:700}
.pt small{display:block;font-weight:500;color:var(--soft);font-size:10.5px}
.badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--linen);border:1px solid var(--line);color:var(--clay-deep);white-space:nowrap}
.icd{font-size:10.5px;color:var(--soft);max-width:150px}
td input[type=number]{width:58px}
td input.act{width:100%;min-width:150px}
td input.ref{width:100%;min-width:120px}
td input[type=date]{width:130px}
td select{width:100%;min-width:90px}
.due{color:var(--urgent);font-weight:700}
.rowsave{white-space:nowrap}
.saved{color:var(--ok);font-size:11px;font-weight:700}
.msg{padding:24px;text-align:center;color:var(--soft)}
.disc{background:#fdf6ec;border:1px solid var(--sand);border-radius:9px;padding:9px 13px;font-size:11.5px;color:var(--clay-deep);margin-bottom:12px}
.gate{max-width:460px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center}
.activity{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.activity-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.activity-head h2{font-family:var(--serif,Georgia);font-size:18px;margin:0}.activity-head p{margin:3px 0 0;font-size:11px;color:var(--soft)}.activity-list{display:grid}.activity-row{display:grid;grid-template-columns:minmax(180px,1.15fr) minmax(135px,.8fr) minmax(120px,.7fr) minmax(150px,.9fr) auto;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);font-size:11.5px}.activity-row:last-child{border-bottom:0}.activity-row .when{color:var(--soft);font-size:10.5px}.activity-row .status{text-transform:capitalize}.activity-row .open{color:var(--ok);font-weight:750;text-decoration:none;white-space:nowrap}.activity-warning{padding:9px 13px;background:#fdf6ec;color:var(--clay-deep);font-size:10.5px}@media(max-width:760px){.activity-row{grid-template-columns:1fr 1fr}.activity-row .open{grid-column:1/-1}}
.rolling{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.rolling-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.rolling-head h2,.month-close h2{font-family:var(--serif,Georgia);font-size:18px;margin:0}.rolling-head p,.month-close p{font-size:11px;color:var(--soft);margin:3px 0 0}.days{display:grid;grid-template-columns:repeat(30,minmax(34px,1fr));gap:4px;margin-top:12px;overflow-x:auto;padding-bottom:3px}.day{min-width:34px;border:1px solid var(--line);border-radius:8px;padding:6px 3px;text-align:center;background:#fbfaf8}.day.today{border-color:var(--river);box-shadow:inset 0 0 0 1px var(--river)}.day.has{background:#edf5f4}.day .d{font-size:9px;color:var(--soft)}.day .n{font-size:15px;font-weight:800;color:var(--ok)}.day .m{font-size:8px;color:var(--soft)}.month-close{margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.month-close-head{padding:14px 16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line)}.close-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px}.close-bar{border:1px solid var(--line);border-radius:10px;padding:9px}.close-bar b{font-size:19px}.close-bar span{display:block;font-size:9px;color:var(--soft);text-transform:uppercase}.gap{color:var(--urgent);font-weight:700}.oktext{color:var(--ok);font-weight:700}@media(max-width:760px){.close-bars{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <img src="/assets/bhw-medical-logo.png" alt="" onerror="this.style.display='none'">
  <div><h1>Care Management Log</h1><div class="sub">CCM · APCM · TCM — time, activities, referrals & follow-up</div></div>
  <div class="controls" id="controls" style="display:none">
    <a class="btn sec sm" href="/bhw-care-program-sop.html" style="text-decoration:none">Care Program SOP</a>
    <select id="program" onchange="load()">
      <option>All</option><option>CCM</option><option>APCM</option><option>PCM</option><option>TCM</option>
      <option>RPM</option><option>RTM</option><option>BHI</option><option>CoCM</option><option>CharmEd Minds</option>
    </select>
    <label class="sub" for="windowEnd" style="letter-spacing:.08em">30 days through</label>
    <input type="date" id="windowEnd" onchange="load()">
    <input type="text" id="q" placeholder="Search name / Ctl / ICD…" oninput="render()">
    <button class="btn sec sm" onclick="load()">↻ Refresh</button>
    <button class="btn sm" id="importBtn" onclick="importNow()" title="Prepare this month's enrolled CCM, APCM, PCM, RPM, RTM, BHI, CoCM, and CharmEd Minds patients">⟳ Run monthly import</button>
  </div>
</header>

<div id="app"><div class="msg">Loading…</div></div>
</div>

<script>
var TOKEN = "";
try { TOKEN = sessionStorage.getItem("crewos_token") || ""; } catch(e){}
var STAGES = ["", "1 day", "4 days", "2 weeks", "1 month"];
var STATUSES = ["Open", "In progress", "Complete", "Billed"];
var ALL = [];
var ACTIVITY = [];
var WINDOW = {};
var MONTH_CLOSE = {};
var ACTIVITY_WARNING = "";
var LAST_CONTENT_SYNC = 0;
var app = document.getElementById("app");

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

async function api(fn, payload){
  var r = await fetch("/.netlify/functions/"+fn, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+TOKEN },
    body: JSON.stringify(payload)
  });
  var d = await r.json().catch(function(){ return {}; });
  return { ok:r.ok, status:r.status, d:d };
}

function gate(msg){
  app.innerHTML = '<div class="gate"><h2 style="margin:0 0 8px">Sign in to crewOS</h2>'+
    '<p class="msg" style="padding:6px 0">'+esc(msg||"This board uses your crewOS session. Open it from inside crewOS after signing in.")+'</p>'+
    '<a class="btn" href="/crewos" target="_top" style="text-decoration:none">Go to crewOS sign-in</a></div>';
  document.getElementById("controls").style.display="none";
}

async function load(){
  if(!TOKEN){ gate(); return; }
  app.innerHTML = '<div class="msg">Loading…</div>';
  var program = document.getElementById("program").value;
  var windowEnd = (document.getElementById("windowEnd").value||"").trim();
  if(Date.now()-LAST_CONTENT_SYNC>300000){
    var sync = await api("patient-content-sync", {});
    LAST_CONTENT_SYNC = Date.now();
    if(!sync.ok && sync.status!==207) ACTIVITY_WARNING = sync.d.error || "Patient HTML responses could not be refreshed.";
  }
  var res = await api("care-log-data", { action:"list", program:program, windowEnd:windowEnd });
  if(res.status===401){ gate("Your session expired — sign in to crewOS again."); return; }
  if(!res.ok){ app.innerHTML = '<div class="msg">Couldn’t load: '+esc(res.d.error||res.status)+'</div>'; return; }
  document.getElementById("controls").style.display="flex";
  ALL = res.d.entries || [];
  ACTIVITY = res.d.activity || [];
  WINDOW = res.d.window || {};
  MONTH_CLOSE = res.d.monthClose || {};
  ACTIVITY_WARNING = res.d.activityWarning || ACTIVITY_WARNING;
  render();
}

function render(){
  var q = (document.getElementById("q").value||"").toLowerCase();
  var rows = ALL.filter(function(e){
    return !q || (e.entry+" "+e.ctlNo+" "+e.icd+" "+e.coordinator).toLowerCase().indexOf(q)>-1;
  });
  var activity = ACTIVITY.filter(function(e){
    return !q || (e.patientName+" "+e.bhwPatientId+" "+e.sourceLabel+" "+e.status).toLowerCase().indexOf(q)>-1;
  });
  var today = todayISO();
  var due = rows.filter(function(e){ return e.nextFollowUp && e.nextFollowUp <= today && e.status!=="Complete" && e.status!=="Billed"; }).length;
  var mins = rows.reduce(function(a,e){ return a + (e.minutes||0); }, 0);
  var under = rows.filter(function(e){ return (e.program==="CCM"||e.program==="APCM") && (e.minutes||0) < 20; }).length;

  var head =
    '<div class="disc">This is a rolling 30-day Care Management view, not a calendar-month reset. Log each contact, activity, referral result, visit, and next follow-up. Every entry is linked to the protected Patient Registry and saved to BHW Cloud.</div>'+
    '<div class="kpis">'+
      kpi(rows.length,"patients")+
      kpi(due,"follow-ups due",due?"due":"")+
      kpi(under,"under 20 min",under?"due":"")+
      kpi(mins,"minutes logged")+
    '</div>'+rollingMarkup(rows,activity)+monthCloseMarkup();

  if(!rows.length){ app.innerHTML = head + '<div class="tablewrap"><div class="msg">No entries for this filter. Adjust the program/month, or run the monthly import.</div></div>' + activityMarkup(activity); return; }

  var body = rows.map(function(e){
    var dueCls = (e.nextFollowUp && e.nextFollowUp<=today && e.status!=="Complete" && e.status!=="Billed") ? " due" : "";
    return '<tr data-id="'+esc(e.id)+'">'+
      '<td class="pt">'+esc(nameOf(e))+'<small>'+esc(e.ctlNo||"")+(e.coordinator?" · "+esc(e.coordinator):"")+'</small></td>'+
      '<td><span class="badge">'+esc(e.program||"")+'</span></td>'+
      '<td class="icd">'+esc(e.icd||"—")+'</td>'+
      '<td><input type="number" min="0" class="f-min" value="'+(e.minutes==null?"":e.minutes)+'"></td>'+
      '<td><input type="text" class="act f-act" value="'+esc(e.activities||"")+'" placeholder="what was done"></td>'+
      '<td><input type="text" class="ref f-ref" value="'+esc(e.referrals||"")+'" placeholder="referrals completed"></td>'+
      '<td><input type="datetime-local" class="f-contact" value="'+esc(String(e.lastContact||"").slice(0,16))+'" title="For TCM, record the first successful or attempted contact time"></td>'+
      '<td class="'+dueCls+'"><input type="date" class="f-fu" value="'+esc(e.nextFollowUp||"")+'"></td>'+
      '<td><select class="f-stage">'+STAGES.map(function(s){return '<option'+(s===e.followUpStage?" selected":"")+'>'+esc(s)+'</option>';}).join("")+'</select></td>'+
      '<td><select class="f-status">'+STATUSES.map(function(s){return '<option'+(s===(e.status||"Open")?" selected":"")+'>'+esc(s)+'</option>';}).join("")+'</select></td>'+
      '<td class="rowsave"><button class="btn sm" onclick="save(this)">Save</button> <span class="saved" style="display:none"></span></td>'+
    '</tr>';
  }).join("");

  app.innerHTML = head +
    '<div class="tablewrap"><table><thead><tr>'+
    '<th>Patient</th><th>Program</th><th>ICD-10</th><th>Min</th><th>Activities done</th><th>Referrals completed</th><th>First / last contact</th><th>Visit / next follow-up</th><th>Stage</th><th>Status</th><th></th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div>' + activityMarkup(activity);
}

function dateRange(start,end){
  var dates=[], cursor=new Date(String(start)+"T12:00:00");
  var last=new Date(String(end)+"T12:00:00");
  while(Number.isFinite(cursor.getTime())&&cursor<=last&&dates.length<30){dates.push(cursor.toISOString().slice(0,10));cursor.setDate(cursor.getDate()+1);}
  return dates;
}

function rollingMarkup(rows,activity){
  if(!WINDOW.start||!WINDOW.end)return "";
  var counts={};
  dateRange(WINDOW.start,WINDOW.end).forEach(function(date){counts[date]=0;});
  rows.forEach(function(row){[row.lastContact,row.nextFollowUp,row.edited].forEach(function(value){var date=String(value||"").slice(0,10);if(counts[date]!=null)counts[date]++;});});
  activity.forEach(function(item){var date=String(item.occurredAt||"").slice(0,10);if(counts[date]!=null)counts[date]++;});
  var today=todayISO();
  var cells=Object.keys(counts).map(function(date){var d=new Date(date+"T12:00:00");var count=counts[date];return '<div class="day'+(date===today?' today':'')+(count?' has':'')+'" title="'+esc(date)+' · '+count+' tracked event'+(count===1?'':'s')+'"><div class="d">'+d.toLocaleDateString([],{weekday:'short'}).slice(0,1)+'</div><div class="n">'+d.getDate()+'</div><div class="m">'+count+'</div></div>';}).join("");
  return '<section class="rolling"><div class="rolling-head"><div><h2>Rolling day-to-day tracking</h2><p>'+esc(WINDOW.start)+' through '+esc(WINDOW.end)+' · the small number is contacts, follow-ups, saves, and patient activity on that day.</p></div><span class="badge">30 days</span></div><div class="days">'+cells+'</div></section>';
}

function monthCloseMarkup(){
  var close=MONTH_CLOSE||{}, counts=close.counts||{}, entries=close.entries||[];
  if(!close.month)return "";
  var firstDay=todayISO().slice(-2)==="01";
  var rows=entries.map(function(entry){var gaps=entry.gaps||[];return '<tr><td class="pt">'+esc(nameOf(entry))+'<small>'+esc(entry.ctlNo||"")+'</small></td><td><span class="badge">'+esc(entry.program||"")+'</span></td><td>'+esc(entry.minutes==null?"—":entry.minutes)+'</td><td>'+esc(entry.status||"Open")+'</td><td>'+(gaps.length?'<span class="gap">'+esc(gaps.join(", "))+'</span>':'<span class="oktext">Tracked</span>')+'</td></tr>';}).join("");
  return '<section class="month-close"><div class="month-close-head"><div><h2>'+esc(close.month)+' documentation &amp; claim close</h2><p>'+(firstDay?'New month: the prior-month close is ready. ':'')+'Review every patient, correct missing documentation, then finish claim processing from the editable table.</p></div><button class="btn sec sm" onclick="reviewMonthClose()">Review and update month</button></div>'+
    '<div class="close-bars"><div class="close-bar"><b>'+Number(counts.tracked||0)+'</b><span>patients/programs tracked</span></div><div class="close-bar"><b>'+Number(counts.complete||0)+'</b><span>complete or billed</span></div><div class="close-bar"><b class="gap">'+Number(counts.missing||0)+'</b><span>documentation / claim gaps</span></div><div class="close-bar"><b>'+Number(counts.claimPending||0)+'</b><span>complete, claim pending</span></div></div>'+
    '<div class="tablewrap" style="border:0;border-radius:0"><table><thead><tr><th>Patient</th><th>Program</th><th>Min</th><th>Status</th><th>Missing / next action</th></tr></thead><tbody>'+ (rows||'<tr><td colspan="5" class="msg">No care-management rows were found for the prior month.</td></tr>') +'</tbody></table></div></section>';
}

function reviewMonthClose(){if(!MONTH_CLOSE.end)return;document.getElementById("windowEnd").value=MONTH_CLOSE.end;load();}

function activityMarkup(items){
  var warning = ACTIVITY_WARNING ? '<div class="activity-warning">Patient activity refresh warning: '+esc(ACTIVITY_WARNING)+'</div>' : '';
  var rows = items.length ? items.map(function(item){
    var when = item.occurredAt ? new Date(item.occurredAt).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "—";
    return '<div class="activity-row">'+
      '<div class="pt">'+esc(item.patientName||item.bhwPatientId)+'<small>'+esc(item.bhwPatientId||"")+'</small></div>'+
      '<div><b>'+esc(item.sourceLabel||"Patient activity")+'</b><div class="when">'+esc(when)+'</div></div>'+
      '<div class="status"><span class="badge">'+esc(item.status||"received")+'</span></div>'+
      '<div>'+esc(item.summary||"Protected patient activity")+'</div>'+
      '<a class="open" href="'+esc(item.requestsUrl||"/bhw-requests.html")+'">Open request & log →</a></div>';
  }).join("") : '<div class="msg">No check-ins, medication requests, or protected patient-form responses were received in this month.</div>';
  return '<section class="activity">'+warning+'<div class="activity-head"><div><h2>Patient tracking & communications</h2><p>Read-only operational references from patient check-ins and private HTML forms. Clinical answers stay in their source record; these rows do not add billable minutes.</p></div><span class="badge">'+items.length+' events</span></div><div class="activity-list">'+rows+'</div></section>';
}

function kpi(n,l,cls){ return '<div class="kpi"><div class="n'+(cls?" "+cls:"")+'">'+n+'</div><div class="l">'+l+'</div></div>'; }
function nameOf(e){ return (e.entry||"").split(" — ")[0] || e.entry || "—"; }

async function save(btn){
  var tr = btn.closest("tr");
  var id = tr.getAttribute("data-id");
  var payload = {
    action:"care-log-save", id:id,
    minutes: tr.querySelector(".f-min").value==="" ? "" : Number(tr.querySelector(".f-min").value),
    activities: tr.querySelector(".f-act").value,
    referrals: tr.querySelector(".f-ref").value,
    lastContact: tr.querySelector(".f-contact").value,
    nextFollowUp: tr.querySelector(".f-fu").value,
    followUpStage: tr.querySelector(".f-stage").value,
    status: tr.querySelector(".f-status").value
  };
  btn.disabled = true; btn.textContent = "Saving…";
  var res = await api("action", payload);
  btn.disabled = false; btn.textContent = "Save";
  if(res.status===401){ gate("Your session expired — sign in to crewOS again."); return; }
  if(res.ok && res.d.ok){
    var s = tr.querySelector(".saved");
    var when = res.d.savedAt ? new Date(res.d.savedAt).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) : "now";
    s.textContent = "Saved to BHW Cloud · " + when; s.style.display="inline";
    // keep local copy in sync so filters/KPIs reflect the save
    var e = ALL.filter(function(x){ return x.id===id; })[0];
    if(e){ e.minutes=payload.minutes===""?null:payload.minutes; e.activities=payload.activities; e.referrals=payload.referrals; e.lastContact=payload.lastContact; e.nextFollowUp=payload.nextFollowUp; e.followUpStage=payload.followUpStage; e.status=payload.status; e.edited=res.d.savedAt||e.edited; }
  } else {
    alert("Couldn't save: " + (res.d.error || res.status));
  }
}

async function importNow(){
  if(!confirm("Prepare this month's enrolled care-management rows from the protected Patient Registry and Population Health?\n\nThis includes CCM, APCM, PCM, RPM, RTM, BHI, CoCM, and CharmEd Minds. Recent Cloud care-log enrollment is used for up to two months when an enrollment field has not caught up yet. Safe to re-run — it won't duplicate rows or overwrite time, activities, referrals, or follow-up you've entered.")) return;
  var btn = document.getElementById("importBtn");
  btn.disabled = true; btn.textContent = "Importing…";
  var end = (document.getElementById("windowEnd").value||todayISO()).slice(0,7);
  var res = await api("care-log-import", { confirm:true, month:end });
  btn.disabled = false; btn.textContent = "⟳ Run monthly import";
  if(res.status===401){ gate("Your session expired — sign in to crewOS again."); return; }
  if(res.ok && res.d.ok){
    var s = res.d.summary || {};
    alert("BHW Cloud preparation complete for "+(res.d.month||"")+":\n"+
      (s.created||0)+" created · "+(s.updated||0)+" refreshed from "+(s.patientRegistryCount||0)+" Registry records"+
      ((s.recoveredPrograms||0)?" · "+s.recoveredPrograms+" recent enrollment"+(s.recoveredPrograms===1?"":"s")+" recovered":""));
    load();
  } else {
    alert("Import failed: " + (res.d.error || res.status));
  }
}

// default window = the latest rolling 30 days
document.getElementById("windowEnd").value = todayISO();
load();
</script>
<script type="module" src="/bhw-alert-center.mjs"></script>
<script src="/staff-chat-launcher.js" defer></script>
</body>
</html>
