<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Care Management Log · BHW crewOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/bhw-tokens.css">
<style>
:root{--river:#80abbd;--clay:#b07a55;--clay-deep:#8C5A3C;--sage:#a8b59a;--sand:#dcc8b1;--ink:#2b2b33;--soft:#6f6f7a;--ok:#1F6961;--urgent:#B4544B;--line:#e5e0d8;--linen:#f7f5f2}
*{box-sizing:border-box}
body{font-family:var(--sans);background:var(--linen);color:var(--ink);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
header img{height:40px;width:auto}
h1{font-family:var(--serif,Georgia);font-weight:600;font-size:21px;margin:0}
.sub{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay-deep);font-weight:700}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}
select,input[type=text],input[type=month],input[type=date],input[type=number]{font-family:inherit;font-size:13px;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--river)}
.btn{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:99px;border:0;background:var(--clay);color:#fff;cursor:pointer}
.btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 15px;min-width:120px}
.kpi .n{font-size:22px;font-weight:800;line-height:1}
.kpi .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-top:3px}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1050px;font-size:12.5px}
th{text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);font-weight:700;padding:9px 8px;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#fff}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#faf8f5}
tr.readiness-ready td{background:#eef8f3}
tr.readiness-incomplete td{background:#fff8e8}
tr.readiness-blocked td{background:#fceeed}
tr.readiness-ready:hover td{background:#e5f3ec}
tr.readiness-incomplete:hover td{background:#fff2d2}
tr.readiness-blocked:hover td{background:#f8dfdc}
tr.readiness-ready td:first-child{border-left:5px solid var(--ok)}
tr.readiness-incomplete td:first-child{border-left:5px solid #C58A21}
tr.readiness-blocked td:first-child{border-left:5px solid var(--urgent)}
.pt{font-weight:700}
.pt small{display:block;font-weight:500;color:var(--soft);font-size:10.5px}
.badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--linen);border:1px solid var(--line);color:var(--clay-deep);white-space:nowrap}
.icd{font-size:10.5px;color:var(--soft);max-width:150px}
td input[type=number]{width:58px}
td input.act{width:100%;min-width:150px}
td input.ref{width:100%;min-width:120px}
td input[type=date]{width:130px}
td select{width:100%;min-width:90px}
.due{color:var(--urgent);font-weight:700}
.rowsave{white-space:nowrap}
.saved{color:var(--ok);font-size:11px;font-weight:700}
.readiness-btn{border:0;border-radius:99px;padding:5px 9px;font:700 10px var(--sans);cursor:pointer;white-space:nowrap}
.readiness-btn.ready{background:#dbeee7;color:var(--ok)}
.readiness-btn.incomplete{background:#f8e5b9;color:#805A0B}
.readiness-btn.blocked{background:#f4d6d2;color:#8D352E}
.readiness-summary{font-size:9.5px;color:var(--soft);margin-top:4px;max-width:190px}
.requirements-row[hidden]{display:none}.requirements-row td{background:#fff!important;padding:0;border-bottom:2px solid var(--line)}
.requirements-panel{padding:16px;border-left:5px solid var(--river)}
.requirements-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:12px}.requirements-head h3{font-family:var(--serif,Georgia);margin:0;font-size:17px}.requirements-head p{margin:3px 0 0;color:var(--soft);font-size:11px}
.requirements-alert{padding:9px 11px;border-radius:8px;margin-bottom:12px;font-size:11px}.requirements-alert.blocked{background:#fceeed;color:#8D352E}.requirements-alert.incomplete{background:#fff8e8;color:#805A0B}.requirements-alert.ready{background:#eef8f3;color:var(--ok)}
.requirements-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px}.requirements-grid label{display:grid;gap:4px;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:750}.requirements-grid label.wide{grid-column:span 2}.requirements-grid input[type=text],.requirements-grid input[type=date],.requirements-grid input[type=number],.requirements-grid select{width:100%;min-width:0}.requirements-checks{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}.requirements-checks label{display:flex;gap:7px;align-items:flex-start;font-size:11px;color:var(--ink)}.requirements-notes{width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:8px;padding:8px;font:12px var(--sans)}
.requirement-lists{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.requirement-list{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:10.5px}.requirement-list b{display:block;margin-bottom:5px}.requirement-list ul{margin:0;padding-left:17px}.requirement-list.blocked{border-color:#e8b7b2}.requirement-list.missing{border-color:#ecd49d}
.msg{padding:24px;text-align:center;color:var(--soft)}
.disc{background:#fdf6ec;border:1px solid var(--sand);border-radius:9px;padding:9px 13px;font-size:11.5px;color:var(--clay-deep);margin-bottom:12px}
.gate{max-width:460px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center}
.activity{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.activity-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.activity-head h2{font-family:var(--serif,Georgia);font-size:18px;margin:0}.activity-head p{margin:3px 0 0;font-size:11px;color:var(--soft)}.activity-list{display:grid}.activity-row{display:grid;grid-template-columns:minmax(180px,1.15fr) minmax(135px,.8fr) minmax(120px,.7fr) minmax(150px,.9fr) auto;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);font-size:11.5px}.activity-row:last-child{border-bottom:0}.activity-row .when{color:var(--soft);font-size:10.5px}.activity-row .status{text-transform:capitalize}.activity-row .open{color:var(--ok);font-weight:750;text-decoration:none;white-space:nowrap}.activity-warning{padding:9px 13px;background:#fdf6ec;color:var(--clay-deep);font-size:10.5px}@media(max-width:900px){.requirements-grid{grid-template-columns:repeat(2,minmax(140px,1fr))}}@media(max-width:760px){.activity-row{grid-template-columns:1fr 1fr}.activity-row .open{grid-column:1/-1}.requirements-grid,.requirement-lists{grid-template-columns:1fr}.requirements-grid label.wide{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <img src="/assets/bhw-medical-logo.png" alt="" onerror="this.style.display='none'">
  <div><h1>Care Management Log</h1><div class="sub">APCM · CCM · BHI · CoCM · CHI · PIN · RPM — activity, evidence &amp; follow-up</div></div>
  <div class="controls" id="controls" style="display:none">
    <select id="program" onchange="load()">
      <option>All</option><option>CCM</option><option>APCM</option><option>PCM</option><option>TCM</option>
      <option>RPM</option><option>RTM</option><option>BHI</option><option>CoCM</option><option>CHI</option><option>PIN</option><option>CharmEd Minds</option>
    </select>
    <input type="month" id="month" onchange="load()">
    <input type="text" id="q" placeholder="Search name / Ctl / ICD…" oninput="render()">
    <button class="btn sec sm" onclick="load()">↻ Refresh</button>
    <button class="btn sm" id="importBtn" onclick="importNow()" title="Prepare this month's enrolled APCM, CCM, PCM, RPM, RTM, BHI, CoCM, CHI, PIN, and CharmEd Minds patients">⟳ Run monthly import</button>
  </div>
</header>

<div id="app"><div class="msg">Loading…</div></div>
</div>

<script>
var TOKEN = "";
try { TOKEN = sessionStorage.getItem("crewos_token") || ""; } catch(e){}
var STAGES = ["", "1 day", "4 days", "2 weeks", "1 month"];
var STATUSES = ["Open", "In progress", "Complete", "Billed"];
var ALL = [];
var ACTIVITY = [];
var ACTIVITY_WARNING = "";
var LAST_CONTENT_SYNC = 0;
var app = document.getElementById("app");

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

async function api(fn, payload){
  var r = await fetch("/.netlify/functions/"+fn, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+TOKEN },
    body: JSON.stringify(payload)
  });
  var d = await r.json().catch(function(){ return {}; });
  return { ok:r.ok, status:r.status, d:d };
}

function gate(msg){
  app.innerHTML = '<div class="gate"><h2 style="margin:0 0 8px">Sign in to crewOS</h2>'+
    '<p class="msg" style="padding:6px 0">'+esc(msg||"This board uses your crewOS session. Open it from inside crewOS after signing in.")+'</p>'+
    '<a class="btn" href="/crewos" target="_top" style="text-decoration:none">Go to crewOS sign-in</a></div>';
  document.getElementById("controls").style.display="none";
}

async function load(){
  if(!TOKEN){ gate(); return; }
  app.innerHTML = '<div class="msg">Loading…</div>';
  var program = document.getElementById("program").value;
  var month = (document.getElementById("month").value||"").trim();
  if(Date.now()-LAST_CONTENT_SYNC>300000){
    var sync = await api("patient-content-sync", {});
    LAST_CONTENT_SYNC = Date.now();
    if(!sync.ok && sync.status!==207) ACTIVITY_WARNING = sync.d.error || "Patient HTML responses could not be refreshed.";
  }
  var res = await api("care-log-data", { action:"list", program:program, month:month });
  if(res.status===401){ gate("Your session expired — sign in to crewOS again."); return; }
  if(!res.ok){ app.innerHTML = '<div class="msg">Couldn’t load: '+esc(res.d.error||res.status)+'</div>'; return; }
  document.getElementById("controls").style.display="flex";
  ALL = res.d.entries || [];
  ACTIVITY = res.d.activity || [];
  ACTIVITY_WARNING = res.d.activityWarning || ACTIVITY_WARNING;
  render();
}

function render(){
  var q = (document.getElementById("q").value||"").toLowerCase();
  var rows = ALL.filter(function(e){
    return !q || (e.entry+" "+e.ctlNo+" "+e.icd+" "+e.coordinator).toLowerCase().indexOf(q)>-1;
  });
  var activity = ACTIVITY.filter(function(e){
    return !q || (e.patientName+" "+e.bhwPatientId+" "+e.sourceLabel+" "+e.status).toLowerCase().indexOf(q)>-1;
  });
  var today = todayISO();
  var due = rows.filter(function(e){ return e.nextFollowUp && e.nextFollowUp <= today && e.status!=="Complete" && e.status!=="Billed"; }).length;
  var mins = rows.reduce(function(a,e){ return a + (e.minutes||0); }, 0);
  var notReady = rows.filter(function(e){ return !e.billingReadiness || e.billingReadiness.state!=="ready"; }).length;
  var ready = rows.length-notReady;

  var head =
    '<div class="disc"><b>Billing evidence check:</b> amber rows are missing information, red rows have a blocking issue, and green rows have the recorded requirements for review. APCM is evaluated without a minute threshold. This is a readiness aid—not an automatic claim approval.</div>'+
    '<div class="kpis">'+
      kpi(rows.length,"patients")+
      kpi(due,"follow-ups due",due?"due":"")+
      kpi(notReady,"need attention",notReady?"due":"")+
      kpi(ready,"billing ready")+
      kpi(mins,"minutes logged")+
    '</div>';

  if(!rows.length){ app.innerHTML = head + '<div class="tablewrap"><div class="msg">No entries for this filter. Adjust the program/month, or run the monthly import.</div></div>' + activityMarkup(activity); return; }

  var body = rows.map(function(e){
    var dueCls = (e.nextFollowUp && e.nextFollowUp<=today && e.status!=="Complete" && e.status!=="Billed") ? " due" : "";
    var readiness = e.billingReadiness || {state:"incomplete",label:"Evidence missing",missing:["Billing evidence was not evaluated"],blockers:[],passed:[]};
    var problemSummary = (readiness.blockers||[]).concat(readiness.missing||[]).slice(0,2).join(" · ");
    return '<tr data-id="'+esc(e.id)+'" class="readiness-'+esc(readiness.state)+'">'+
      '<td class="pt">'+esc(nameOf(e))+'<small>'+esc(e.ctlNo||"")+(e.coordinator?" · "+esc(e.coordinator):"")+'</small></td>'+
      '<td><span class="badge">'+esc(e.program||"")+'</span></td>'+
      '<td><button type="button" class="readiness-btn '+esc(readiness.state)+'" onclick="toggleRequirements(this)">'+esc(readiness.label)+'</button><div class="readiness-summary">'+esc(problemSummary)+'</div></td>'+
      '<td class="icd">'+esc(e.icd||"—")+'</td>'+
      '<td><input type="number" min="0" class="f-min" value="'+(e.minutes==null?"":e.minutes)+'"></td>'+
      '<td><input type="text" class="act f-act" value="'+esc(e.activities||"")+'" placeholder="what was done"></td>'+
      '<td><input type="text" class="ref f-ref" value="'+esc(e.referrals||"")+'" placeholder="referrals completed"></td>'+
      '<td class="'+dueCls+'"><input type="date" class="f-fu" value="'+esc(e.nextFollowUp||"")+'"></td>'+
      '<td><select class="f-stage">'+STAGES.map(function(s){return '<option'+(s===e.followUpStage?" selected":"")+'>'+esc(s)+'</option>';}).join("")+'</select></td>'+
      '<td><select class="f-status">'+STATUSES.map(function(s){return '<option'+(s===(e.status||"Open")?" selected":"")+'>'+esc(s)+'</option>';}).join("")+'</select></td>'+
      '<td class="rowsave"><button class="btn sm row-save-btn" onclick="save(this)">Save</button> <span class="saved" style="display:none"></span></td>'+
    '</tr>'+requirementsMarkup(e);
  }).join("");

  app.innerHTML = head +
    '<div class="tablewrap"><table><thead><tr>'+
    '<th>Patient</th><th>Program</th><th>Readiness</th><th>ICD-10</th><th>Min</th><th>Activities done</th><th>Referrals completed</th><th>Next follow-up</th><th>Stage</th><th>Status</th><th></th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div>' + activityMarkup(activity);
}

function optionList(options,current){
  return options.map(function(item){
    var value = Array.isArray(item)?item[0]:item;
    var label = Array.isArray(item)?item[1]:item;
    return '<option value="'+esc(value)+'"'+(String(value)===String(current||"")?' selected':'')+'>'+esc(label)+'</option>';
  }).join("");
}

function checkAttr(value){ return value===true?' checked':''; }
function issueList(title,items,cls){
  if(!items||!items.length)return '';
  return '<div class="requirement-list '+cls+'"><b>'+esc(title)+'</b><ul>'+items.map(function(item){return '<li>'+esc(item)+'</li>';}).join('')+'</ul></div>';
}

function requirementsMarkup(e){
  var evidence=e.billingReadinessEvidence||{};
  var readiness=e.billingReadiness||{state:'incomplete',label:'Evidence missing',missing:['Billing evidence was not evaluated'],blockers:[],passed:[]};
  var alertText=readiness.state==='ready'
    ?'All currently configured requirements are recorded. Provider and RCM still make the final billing decision.'
    :readiness.state==='blocked'
      ?'Do not bill while a red blocking item remains.'
      :'Complete or document the amber items before this row can become billing ready.';
  return '<tr class="requirements-row" data-requirements-for="'+esc(e.id)+'" hidden><td colspan="11"><div class="requirements-panel">'+
    '<div class="requirements-head"><div><h3>'+esc(nameOf(e))+' · '+esc(e.program)+' requirements</h3><p>Record the evidence that supports this patient-program-month. Missing evidence remains visible and does not become a claim automatically.</p></div><button type="button" class="btn sec sm" onclick="toggleRequirements(this)">Close</button></div>'+
    '<div class="requirements-alert '+esc(readiness.state)+'"><b>'+esc(readiness.label)+'.</b> '+esc(alertText)+'</div>'+
    '<div class="requirements-grid">'+
      '<label>Eligibility<select class="r-eligibility">'+optionList([['potential','Potential — screening/review needed'],['confirmed','Confirmed eligible'],['not-eligible','Not eligible']],evidence.eligibilityStatus||'potential')+'</select></label>'+
      '<label>Consent<select class="r-consent">'+optionList([['missing','Missing'],['current','Current'],['declined','Declined'],['revoked','Revoked']],evidence.consentStatus||'missing')+'</select></label>'+
      '<label>Consent date<input type="date" class="r-consent-date" value="'+esc(evidence.consentDate||'')+'"></label>'+
      '<label>Consent review due<input type="date" class="r-consent-due" value="'+esc(evidence.consentReviewDue||'')+'"></label>'+
      '<label>Coverage<select class="r-coverage">'+optionList([['unknown','Unknown'],['verified','Verified'],['needs-review','Needs review'],['inactive','Inactive']],evidence.coverageStatus||'unknown')+'</select></label>'+
      '<label>Coverage checked<input type="date" class="r-coverage-date" value="'+esc(evidence.coverageCheckedAt||'')+'"></label>'+
      '<label>Initiating visit<select class="r-visit">'+optionList([['missing','Missing'],['complete','Complete'],['not-required','Not required']],evidence.initiatingVisitStatus||'missing')+'</select></label>'+
      '<label>Initiating visit date<input type="date" class="r-visit-date" value="'+esc(evidence.initiatingVisitDate||'')+'"></label>'+
      '<label>Care plan<select class="r-plan">'+optionList([['missing','Missing'],['draft','Draft'],['active','Active']],evidence.carePlanStatus||'missing')+'</select></label>'+
      '<label>Assigned person<input type="text" class="r-person" value="'+esc(evidence.assignedPerson||'')+'" placeholder="name / role"></label>'+
      '<label>Billing pathway<select class="r-path">'+optionList([['','Choose pathway'],['standard','Standard program pathway'],['apcm-addon','APCM behavioral-health add-on'],['cocm-initial','CoCM initial month'],['cocm-subsequent','CoCM subsequent month'],['cocm-30','CoCM 30-minute pathway'],['payer-specific','Payer-specific pathway']],evidence.billingPath||'')+'</select></label>'+
      '<label>Required minutes<input type="number" min="0" class="r-required-minutes" value="'+(evidence.requiredMinutes||'')+'" placeholder="0 for non-time-based"></label>'+
      '<label>Required device days<input type="number" min="0" max="31" class="r-required-days" value="'+(evidence.requiredDeviceDays||'')+'"></label>'+
      '<label>Device days recorded<input type="number" min="0" max="31" class="r-device-days" value="'+(evidence.deviceDataDays||'')+'"></label>'+
      '<label>Provider review<select class="r-provider-review">'+optionList([['pending','Pending'],['approved','Approved'],['held','Held']],evidence.providerReviewStatus||'pending')+'</select></label>'+
      '<label>Provider review date<input type="date" class="r-provider-date" value="'+esc(evidence.providerReviewedAt||'')+'"></label>'+
    '</div>'+
    '<div class="requirements-checks">'+
      '<label><input type="checkbox" class="r-plan-shared"'+checkAttr(evidence.carePlanShared)+'> Care-plan copy shared with patient/caregiver</label>'+
      '<label><input type="checkbox" class="r-instructions"'+checkAttr(evidence.patientInstructionsProvided)+'> Program, assigned-person, and urgent-contact instructions reviewed</label>'+
      '<label><input type="checkbox" class="r-monthly"'+checkAttr(evidence.monthlyRequirementsMet)+'> Required monthly program elements completed</label>'+
      '<label><input type="checkbox" class="r-interaction"'+checkAttr(evidence.interactiveCommunicationCompleted)+'> Required interactive communication completed</label>'+
    '</div>'+
    '<label style="display:grid;gap:4px;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:750">Evidence notes<textarea class="requirements-notes r-notes" placeholder="Evidence references, payer-specific rule, or reason for hold">'+esc(evidence.notes||'')+'</textarea></label>'+
    '<div class="actions" style="margin-top:12px"><button type="button" class="btn sm" onclick="saveRequirements(this)">Save requirements to BHW Cloud</button></div>'+
    '<div class="requirement-lists">'+issueList('Blocking issues',readiness.blockers,'blocked')+issueList('Missing items',readiness.missing,'missing')+issueList('Recorded checks',readiness.passed,'passed')+'</div>'+
  '</div></td></tr>';
}

function toggleRequirements(btn){
  var row=btn.closest('tr');
  var requirements=row.classList.contains('requirements-row')?row:row.nextElementSibling;
  if(requirements&&requirements.classList.contains('requirements-row'))requirements.hidden=!requirements.hidden;
}

function activityMarkup(items){
  var warning = ACTIVITY_WARNING ? '<div class="activity-warning">Patient activity refresh warning: '+esc(ACTIVITY_WARNING)+'</div>' : '';
  var rows = items.length ? items.map(function(item){
    var when = item.occurredAt ? new Date(item.occurredAt).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "—";
    return '<div class="activity-row">'+
      '<div class="pt">'+esc(item.patientName||item.bhwPatientId)+'<small>'+esc(item.bhwPatientId||"")+'</small></div>'+
      '<div><b>'+esc(item.sourceLabel||"Patient activity")+'</b><div class="when">'+esc(when)+'</div></div>'+
      '<div class="status"><span class="badge">'+esc(item.status||"received")+'</span></div>'+
      '<div>'+esc(item.summary||"Protected patient activity")+'</div>'+
      '<a class="open" href="'+esc(item.requestsUrl||"/bhw-requests.html")+'">Open request & log →</a></div>';
  }).join("") : '<div class="msg">No check-ins, medication requests, or protected patient-form responses were received in this month.</div>';
  return '<section class="activity">'+warning+'<div class="activity-head"><div><h2>Patient tracking & communications</h2><p>Read-only operational references from patient check-ins and private HTML forms. Clinical answers stay in their source record; these rows do not add billable minutes.</p></div><span class="badge">'+items.length+' events</span></div><div class="activity-list">'+rows+'</div></section>';
}

function kpi(n,l,cls){ return '<div class="kpi"><div class="n'+(cls?" "+cls:"")+'">'+n+'</div><div class="l">'+l+'</div></div>'; }
function nameOf(e){ return (e.entry||"").split(" — ")[0] || e.entry || "—"; }

function evidenceFromRow(tr){
  var details=tr.nextElementSibling;
  if(!details||!details.classList.contains('requirements-row'))return {};
  function value(selector){var node=details.querySelector(selector);return node?node.value:'';}
  function checked(selector){var node=details.querySelector(selector);return !!(node&&node.checked);}
  function numeric(selector){var raw=value(selector);return raw===''?0:Number(raw);}
  return {
    eligibilityStatus:value('.r-eligibility'),
    consentStatus:value('.r-consent'),
    consentDate:value('.r-consent-date'),
    consentReviewDue:value('.r-consent-due'),
    coverageStatus:value('.r-coverage'),
    coverageCheckedAt:value('.r-coverage-date'),
    initiatingVisitStatus:value('.r-visit'),
    initiatingVisitDate:value('.r-visit-date'),
    carePlanStatus:value('.r-plan'),
    carePlanShared:checked('.r-plan-shared'),
    assignedPerson:value('.r-person'),
    patientInstructionsProvided:checked('.r-instructions'),
    monthlyRequirementsMet:checked('.r-monthly'),
    interactiveCommunicationCompleted:checked('.r-interaction'),
    deviceDataDays:numeric('.r-device-days'),
    billingPath:value('.r-path'),
    requiredMinutes:numeric('.r-required-minutes'),
    requiredDeviceDays:numeric('.r-required-days'),
    providerReviewStatus:value('.r-provider-review'),
    providerReviewedAt:value('.r-provider-date'),
    notes:value('.r-notes')
  };
}

function saveRequirements(btn){
  var details=btn.closest('tr');
  var row=details&&details.previousElementSibling;
  var saveButton=row&&row.querySelector('.row-save-btn');
  if(saveButton)save(saveButton);
}

async function save(btn){
  var tr = btn.closest("tr");
  var id = tr.getAttribute("data-id");
  var payload = {
    action:"care-log-save", id:id,
    minutes: tr.querySelector(".f-min").value==="" ? "" : Number(tr.querySelector(".f-min").value),
    activities: tr.querySelector(".f-act").value,
    referrals: tr.querySelector(".f-ref").value,
    nextFollowUp: tr.querySelector(".f-fu").value,
    followUpStage: tr.querySelector(".f-stage").value,
    status: tr.querySelector(".f-status").value,
    billingReadinessEvidence: evidenceFromRow(tr)
  };
  btn.disabled = true; btn.textContent = "Saving…";
  var res = await api("action", payload);
  btn.disabled = false; btn.textContent = "Save";
  if(res.status===401){ gate("Your session expired — sign in to crewOS again."); return; }
  if(res.ok && res.d.ok){
    var s = tr.querySelector(".saved");
    var when = res.d.savedAt ? new Date(res.d.savedAt).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) : "now";
    s.textContent = "Saved to BHW Cloud · " + when; s.style.display="inline";
    // keep local copy in sync so filters/KPIs reflect the save
    var e = ALL.filter(function(x){ return x.id===id; })[0];
    if(e){ e.minutes=payload.minutes===""?null:payload.minutes; e.activities=payload.activities; e.referrals=payload.referrals; e.nextFollowUp=payload.nextFollowUp; e.followUpStage=payload.followUpStage; e.status=payload.status; e.billingReadinessEvidence=payload.billingReadinessEvidence; }
    setTimeout(load,650);
  } else {
    alert("Couldn't save: " + (res.d.error || res.status));
  }
}

async function importNow(){
  if(!confirm("Prepare this month's enrolled care-management rows from the protected Patient Registry and Population Health?\n\nThis includes APCM, CCM, PCM, RPM, RTM, BHI, CoCM, CHI, PIN, and CharmEd Minds. Recent Cloud care-log enrollment is used for up to two months when an enrollment field has not caught up yet. Safe to re-run — it won't duplicate rows or overwrite time, activities, referrals, follow-up, or billing evidence you've entered.")) return;
  var btn = document.getElementById("importBtn");
  btn.disabled = true; btn.textContent = "Importing…";
  var res = await api("care-log-import", { confirm:true });
  btn.disabled = false; btn.textContent = "⟳ Run monthly import";
  if(res.status===401){ gate("Your session expired — sign in to crewOS again."); return; }
  if(res.ok && res.d.ok){
    var s = res.d.summary || {};
    alert("BHW Cloud preparation complete for "+(res.d.month||"")+":\n"+
      (s.created||0)+" created · "+(s.updated||0)+" refreshed from "+(s.patientRegistryCount||0)+" Registry records"+
      ((s.recoveredPrograms||0)?" · "+s.recoveredPrograms+" recent enrollment"+(s.recoveredPrograms===1?"":"s")+" recovered":""));
    load();
  } else {
    alert("Import failed: " + (res.d.error || res.status));
  }
}

// default month = current
document.getElementById("month").value = todayISO().slice(0,7);
load();
</script>
