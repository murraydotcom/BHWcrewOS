<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Operational Controls · BHWcrewOS</title>
  <script src="/crew-provider-gate.js"></script>
  <link rel="stylesheet" href="/assets/bhw-tokens.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--cream,#f7f2e8);color:var(--ink,#263238);font:15px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:32px 20px}h1{margin:10px 0}a{color:var(--navy,#153148)}.muted{color:#58686f}.layout{display:grid;grid-template-columns:320px 1fr;gap:20px;margin-top:24px}.panel{background:white;padding:22px;border:1px solid #d7dcd9;border-radius:16px}label{display:block;font-weight:600;margin:14px 0 5px}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #b9c5c6;border-radius:8px;width:100%}textarea{min-height:105px}input[type=checkbox]{width:auto;margin-right:10px}button{cursor:pointer;background:var(--navy,#153148);color:white;margin-top:12px}button:disabled{opacity:.55;cursor:wait}.record{display:block;background:#f6f5f0;color:#153148;text-align:left}.record[aria-current=true]{outline:2px solid #478f8a}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.wide{grid-column:1/-1}.message{padding:12px;background:#eef5ef;border-radius:8px;margin-top:16px}.message.error{background:#fff0ec;color:#8c3333}#records{max-height:65vh;overflow:auto}small{display:block}.links{display:flex;gap:20px;flex-wrap:wrap}@media(max-width:760px){.layout,.fields{grid-template-columns:1fr}.wide{grid-column:auto}#records{max-height:35vh}}
  </style>
</head>
<body><main>
  <nav class="links"><a href="/hq.html">CrewHQ</a><a href="/bhw-intel-connections.html">Notion Connections</a><a href="/crewos">Scheduling and availability</a></nav>
  <h1>Operational Controls</h1><p class="muted">Manage the employee access and operational records used throughout BHWcrewOS. Use Patient Requests and Health 360 for patient work.</p>
  <label for="section">Manage</label><select id="section"><option value="staff">Employees and codes</option><option value="referralTemplates">Referral templates</option><option value="rooms">Rooms and rules</option><option value="resources">Staff resources</option><option value="crewProjects">Crew projects</option><option value="specialistDirectory">Specialist directory</option></select>
  <div id="message" role="status" aria-live="polite"></div>
  <div class="layout"><aside class="panel"><label for="search">Search records</label><input id="search" type="search"><button id="add" type="button" disabled>Add record</button><div id="records"></div></aside><section class="panel"><h2 id="heading">Loading…</h2><form id="editor"><div id="fields" class="fields"></div><button id="save" type="submit" disabled>Save and verify</button></form></section></div>
</main><script>
  const API='/.netlify/functions/operational-controls';
  const section=document.getElementById('section'),records=document.getElementById('records'),fields=document.getElementById('fields'),message=document.getElementById('message'),save=document.getElementById('save'),add=document.getElementById('add');
  let data=null,selected=null,staff=[];
  function notice(text,error=false){message.className='message'+(error?' error':'');message.textContent=text;}
  async function call(url,body){const response=await fetch(url,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+(sessionStorage.getItem('crewos_token')||''),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store'});const result=await response.json();if(!response.ok)throw new Error(result.error||'Request failed.');return result;}
  function recordTitle(record){return String(record.values[data.fields.find(field=>field.type==='title')?.name]||'Untitled');}
  function drawList(){records.replaceChildren();const query=document.getElementById('search').value.toLowerCase();for(const record of data.records.filter(record=>Object.values(record.values).join(' ').toLowerCase().includes(query))){const button=document.createElement('button');button.type='button';button.className='record';button.textContent=recordTitle(record);button.setAttribute('aria-current',String(selected?.id===record.id));button.onclick=()=>edit(record);records.append(button);}}
  function edit(record){selected=record;document.getElementById('heading').textContent=record?recordTitle(record):'Add '+data.label.toLowerCase();fields.replaceChildren();for(const [index,field] of data.fields.entries()){
    const wrapper=document.createElement('div');if(field.type==='rich_text')wrapper.className='wide';
    const label=document.createElement('label');label.htmlFor='field-'+index;label.textContent=field.name;
    const value=record?.values[field.name]??(field.type==='checkbox'?['Active','Accepting New Patients'].includes(field.name):['multi_select','relation'].includes(field.type)?[]:'');
    const input=document.createElement(field.type==='rich_text'?'textarea':field.type==='relation'?'select':'input');input.id='field-'+index;input.dataset.field=field.name;input.dataset.type=field.type;
    if(field.type==='relation'){input.multiple=true;for(const person of staff){const option=document.createElement('option');option.value=person.id;option.textContent=person.values.Name;option.selected=value.includes(person.id);input.append(option);}}
    else if(field.type==='checkbox'){input.type='checkbox';input.checked=value;}
    else{input.type=field.type==='number'?'number':field.type==='date'?'date':field.type==='url'?'url':field.type==='phone_number'?'tel':'text';input.value=Array.isArray(value)?value.join(', '):value;input.maxLength=1900;if(field.type==='title')input.required=true;if(field.type==='number')input.step='any';}
    if(['select','status'].includes(field.type)&&field.options.length){const list=document.createElement('datalist');list.id='options-'+index;for(const value of field.options){const option=document.createElement('option');option.value=value;list.append(option);}input.setAttribute('list',list.id);wrapper.append(list);}
    wrapper.append(label,input);if(field.type==='multi_select'){const hint=document.createElement('small');hint.textContent='Separate selections with commas.';wrapper.append(hint);}fields.append(wrapper);
  }
  if(data.namespace==='staff'){const wrapper=document.createElement('div');wrapper.className='wide';const label=document.createElement('label');label.htmlFor='new-pin';label.textContent=record?.pinConfigured?'Reset employee PIN (optional)':'Set employee PIN';const pin=document.createElement('input');pin.type='password';pin.id='new-pin';pin.inputMode='numeric';pin.pattern='[0-9]{4,8}';pin.maxLength=8;pin.autocomplete='new-password';const hint=document.createElement('small');hint.textContent='4–8 digits. Leave blank to preserve the current PIN.';wrapper.append(label,pin,hint);fields.append(wrapper);}
  save.disabled=false;drawList();}
  async function load(){save.disabled=true;add.disabled=true;data=null;records.replaceChildren();fields.replaceChildren();document.getElementById('heading').textContent='Loading…';try{const namespace=section.value;const loaded=await call(API+'?namespace='+encodeURIComponent(namespace));if(namespace!==section.value)return;if(namespace==='crewProjects'){const roster=await call(API+'?namespace=staff');staff=roster.records;}data=loaded;add.disabled=false;edit(data.records[0]||null);notice(data.records.length+' '+data.label.toLowerCase()+' loaded from BHWcrewOS.');}catch(error){document.getElementById('heading').textContent='Controls unavailable';notice(error.message,true);}}
  section.onchange=load;document.getElementById('search').oninput=()=>{if(data)drawList();};add.onclick=()=>edit(null);
  document.getElementById('editor').onsubmit=async event=>{event.preventDefault();if(!data)return;save.disabled=true;add.disabled=true;section.disabled=true;const values={};for(const input of fields.querySelectorAll('[data-field]')){const type=input.dataset.type;values[input.dataset.field]=type==='checkbox'?input.checked:type==='relation'?[...input.selectedOptions].map(option=>option.value):type==='multi_select'?input.value.split(',').map(value=>value.trim()).filter(Boolean):type==='number'?(input.value===''?'':Number(input.value)):input.value;}
    try{const result=await call(API,{namespace:data.namespace,id:selected?.id,expectedVersion:selected?.version,values,pin:document.getElementById('new-pin')?.value||''});await load();const record=data?.records.find(item=>item.id===result.id);if(record)edit(record);notice('Saved and verified in BHWcrewOS.');}catch(error){notice(error.message,true);save.disabled=false;add.disabled=false;}finally{section.disabled=false;}}
  const requested=new URLSearchParams(location.search).get('section');if([...section.options].some(option=>option.value===requested))section.value=requested;load();
</script><script src="/staff-chat-launcher.js" defer></script></body></html>
