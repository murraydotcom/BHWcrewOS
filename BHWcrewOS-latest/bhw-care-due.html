<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Care Management · Due This Week · BHW crewOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/bhw-tokens.css">
<style>
:root{--river:#80abbd;--clay:#b07a55;--clay-deep:#8C5A3C;--sage:#a8b59a;--sand:#dcc8b1;--ink:#2b2b33;--soft:#6f6f7a;--ok:#1F6961;--urgent:#B4544B;--amber:#B5852F;--line:#e5e0d8;--linen:#f7f5f2}
*{box-sizing:border-box}
body{font-family:var(--sans);background:var(--linen);color:var(--ink);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
header img{height:40px;width:auto}
h1{font-family:var(--serif,Georgia);font-weight:600;font-size:21px;margin:0}
.sub{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay-deep);font-weight:700}
.controls{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{font-family:inherit;font-size:12px;font-weight:600;padding:6px 13px;border-radius:99px;border:0;background:var(--clay);color:#fff;cursor:pointer}
.btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.xs{padding:3px 9px;font-size:11px}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 15px;min-width:110px;border-left:4px solid var(--kc,var(--sand))}
.kpi .n{font-size:23px;font-weight:800;line-height:1}
.kpi .l{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin-top:4px}
section.blk{margin-bottom:20px}
h2{font-size:13px;letter-spacing:.04em;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2 .dot{width:9px;height:9px;border-radius:50%;background:var(--dc,var(--soft))}
h2 .ct{font-size:11px;font-weight:700;color:var(--soft)}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:12.5px}
th{text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);font-weight:700;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:#faf8f5}
.pt{font-weight:700}
.pt small{display:block;font-weight:500;color:var(--soft);font-size:10.5px}
.badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--linen);border:1px solid var(--line);color:var(--clay-deep);white-space:nowrap}
.b-tcm{background:#eef4f6;color:var(--blue-deep,#3c6b7d);border-color:#cfe0e6}
.due{font-weight:700}
.due.od{color:var(--urgent)}
.due.td{color:var(--amber)}
.sla{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:#fdf0ee;color:var(--urgent);border:1px solid #f0d5d1;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:16px;text-align:center;color:var(--soft);font-size:12px}
.msg{padding:26px;text-align:center;color:var(--soft)}
.note{background:#fdf6ec;border:1px solid var(--sand);border-radius:9px;padding:8px 13px;font-size:11.5px;color:var(--clay-deep);margin:2px 0 16px}
.gate{max-width:460px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center}
.act{white-space:nowrap;text-align:right}
</style>
</head>
<body>
<div class="wrap">
<header>
  <img src="/assets/bhw-medical-logo.png" alt="" onerror="this.style.display='none'">
  <div><h1>Care Management — Due This Week</h1><div class="sub" id="range">One worklist · follow-ups, TCM contacts & inbound requests</div></div>
  <div class="controls" id="controls" style="display:none">
    <button class="btn sec xs" onclick="load()">↻ Refresh</button>
  </div>
</header>
<div id="app"><div class="msg">Loading…</div></div>
</div>

<script>
var TOKEN=""; try{ TOKEN=sessionStorage.getItem("crewos_token")||""; }catch(e){}
var D=null, app=document.getElementById("app");
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function today(){ return new Date().toISOString().slice(0,10); }
function plusDays(iso,n){ var d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

async function api(fn,payload){
  var r=await fetch("/.netlify/functions/"+fn,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:JSON.stringify(payload)});
  var d=await r.json().catch(function(){return {};});
  return {ok:r.ok,status:r.status,d:d};
}
function gate(msg){
  app.innerHTML='<div class="gate"><h2 style="justify-content:center">Sign in to crewOS</h2><p class="msg">'+esc(msg||"Open this from inside crewOS after signing in.")+'</p><a class="btn" href="/crewos" target="_top" style="text-decoration:none">Go to crewOS sign-in</a></div>';
  document.getElementById("controls").style.display="none";
}

async function load(){
  if(!TOKEN){ gate(); return; }
  app.innerHTML='<div class="msg">Loading…</div>';
  var res=await api("care-due-data",{});
  if(res.status===401){ gate("Your session expired — sign in to crewOS again."); return; }
  if(!res.ok){ app.innerHTML='<div class="msg">Couldn’t load: '+esc(res.d.error||res.status)+'</div>'; return; }
  document.getElementById("controls").style.display="flex";
  D=res.d; render();
}

function kpi(n,l,color){ return '<div class="kpi" style="--kc:'+color+'"><div class="n" style="color:'+color+'">'+n+'</div><div class="l">'+l+'</div></div>'; }
function nameCell(e){ return '<td class="pt">'+esc(e.name)+'<small>'+esc(e.ctlNo||"")+(e.coordinator?" · "+esc(e.coordinator):"")+'</small></td>'; }
function progBadge(p){ return '<span class="badge'+(p==="TCM"?" b-tcm":"")+'">'+esc(p||"")+'</span>'; }

function fuRows(list){
  return list.map(function(e){
    var cls = e.bucket==="overdue"?"od":(e.bucket==="today"?"td":"");
    var mins = (e.program==="CCM"||e.program==="APCM") ? ((e.minutes||0)+" min"+((e.minutes||0)<20?" ⚠︎":"")) : "—";
    return '<tr data-id="'+esc(e.id)+'">'+
      nameCell(e)+
      '<td>'+progBadge(e.program)+'</td>'+
      '<td class="due '+cls+'">'+esc(e.nextFollowUp||"")+(e.stage?' <small style="color:var(--soft)">('+esc(e.stage)+')</small>':'')+'</td>'+
      '<td>'+esc(mins)+'</td>'+
      '<td class="act">'+
        '<button class="btn ok xs" onclick="done(this)">✓ Done</button> '+
        '<button class="btn sec xs" onclick="snooze(this)" title="Push follow-up one week">Snooze 1wk</button>'+
      '</td></tr>';
  }).join("");
}

function block(title,dot,list,cols){
  if(!list.length) return "";
  return '<section class="blk"><h2><span class="dot" style="--dc:'+dot+'"></span>'+title+' <span class="ct">'+list.length+'</span></h2>'+
    '<div class="tablewrap"><table><thead><tr>'+cols+'</tr></thead><tbody>'+fuRows(list)+'</tbody></table></div></section>';
}

function render(){
  var f=D.followups||[], ns=D.notStarted||[], rq=D.requests||[], c=D.counts||{};
  document.getElementById("range").textContent = "Through "+ (D.endOfWeek||"") + " · updated "+ today();

  var head='<div class="kpis">'+
    kpi(c.overdue||0,"overdue","var(--urgent)")+
    kpi(c.today||0,"due today","var(--amber)")+
    kpi(c.week||0,"due this week","var(--river)")+
    kpi(c.notStarted||0,"not started","var(--clay)")+
    kpi(c.requests||0,"inbound requests","var(--ok)")+
  '</div>';

  var cols='<th>Patient</th><th>Program</th><th>Due</th><th>Time</th><th></th>';
  var overdue=f.filter(function(x){return x.bucket==="overdue";});
  var todayL=f.filter(function(x){return x.bucket==="today";});
  var weekL=f.filter(function(x){return x.bucket==="week";});

  var body=
    block("Overdue","var(--urgent)",overdue,cols)+
    block("Due today","var(--amber)",todayL,cols)+
    block("Due this week","var(--river)",weekL,cols);

  // not started this month
  if(ns.length){
    body+='<section class="blk"><h2><span class="dot" style="--dc:var(--clay)"></span>Not started this month <span class="ct">'+ns.length+'</span></h2>'+
      '<div class="note">CCM/APCM patients with no contact logged yet this month — no minutes, no follow-up set.</div>'+
      '<div class="tablewrap"><table><thead><tr><th>Patient</th><th>Program</th><th>ICD / notes</th><th></th></tr></thead><tbody>'+
      ns.map(function(e){ return '<tr data-id="'+esc(e.id)+'">'+nameCell(e)+'<td>'+progBadge(e.program)+'</td><td class="due" style="color:var(--soft);font-weight:500">needs first outreach</td>'+
        '<td class="act"><button class="btn sec xs" onclick="snoozeTo(this,\''+esc(today())+'\')">Set due today</button></td></tr>'; }).join("")+
      '</tbody></table></div></section>';
  }

  // inbound patient requests
  if(rq.length){
    body+='<section class="blk"><h2><span class="dot" style="--dc:var(--ok)"></span>Inbound patient requests <span class="ct">'+rq.length+'</span></h2>'+
      '<div class="note">Open requests from calls, texts & faxes. Work these in <b>Front Desk OS</b> — this is a read-only view so nothing slips.</div>'+
      '<div class="tablewrap"><table><thead><tr><th>Patient</th><th>Type</th><th>Source</th><th>SLA</th><th>Summary</th></tr></thead><tbody>'+
      rq.map(function(r){ return '<tr><td class="pt">'+esc(r.name||"—")+(r.assigned?'<small>'+esc(r.assigned)+'</small>':'')+'</td>'+
        '<td>'+esc(r.type||"")+'</td><td>'+esc(r.source||"")+'</td>'+
        '<td>'+(r.sla?'<span class="sla">'+esc(r.sla)+'</span>':'—')+'</td>'+
        '<td>'+esc(r.summary||"")+'</td></tr>'; }).join("")+
      '</tbody></table></div></section>';
  }

  if(!f.length && !ns.length && !rq.length){
    body='<div class="tablewrap"><div class="empty">🎉 Nothing due this week — no overdue follow-ups, TCM contacts, or open requests.</div></div>';
  }
  app.innerHTML=head+body;
}

function localRemove(tr){
  var id=tr.getAttribute("data-id");
  D.followups=(D.followups||[]).filter(function(x){return x.id!==id;});
  D.notStarted=(D.notStarted||[]).filter(function(x){return x.id!==id;});
  var f=D.followups;
  D.counts.overdue=f.filter(function(x){return x.bucket==="overdue";}).length;
  D.counts.today=f.filter(function(x){return x.bucket==="today";}).length;
  D.counts.week=f.filter(function(x){return x.bucket==="week";}).length;
  D.counts.notStarted=D.notStarted.length;
  render();
}

async function save(tr,payload,btn){
  var old=btn.textContent; btn.disabled=true; btn.textContent="…";
  var res=await api("action",payload);
  if(res.status===401){ gate("Your session expired — sign in to crewOS again."); return false; }
  if(res.ok && res.d.ok){ return true; }
  btn.disabled=false; btn.textContent=old; alert("Couldn't save: "+(res.d.error||res.status)); return false;
}
async function done(btn){
  var tr=btn.closest("tr");
  if(await save(tr,{action:"care-log-save",id:tr.getAttribute("data-id"),status:"Complete",lastContact:today()},btn)) localRemove(tr);
}
async function snooze(btn){
  var tr=btn.closest("tr");
  var due=plusDays(today(),7);
  if(await save(tr,{action:"care-log-save",id:tr.getAttribute("data-id"),nextFollowUp:due,lastContact:today()},btn)) localRemove(tr);
}
async function snoozeTo(btn,d){
  var tr=btn.closest("tr");
  if(await save(tr,{action:"care-log-save",id:tr.getAttribute("data-id"),nextFollowUp:d},btn)) localRemove(tr);
}

load();
</script>
</body>
</html>
