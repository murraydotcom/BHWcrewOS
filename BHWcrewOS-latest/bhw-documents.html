<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHW Document Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root{
    --teal:#80abbd;
    --teal-dark:#5d8a9e;
    --rust:#b07a55;
    --sage:#a8b59a;
    --sand:#dcc8b1;
    --cream:#f7f5f2;
    --ink:#2A3038;
    --teal-tint:#eaf1f4;
    --rust-tint:#f5ece5;
    --sage-tint:#eff2ec;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Montserrat',system-ui,-apple-system,sans-serif;
    background:#e7e5e1;
    color:var(--ink);
  }

  /* ---------- App shell ---------- */
  .app-shell{display:flex;flex-direction:column;height:100vh;}
  .topbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--teal-dark);color:#fff;padding:10px 20px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    position:relative;z-index:5;
  }
  .topbar .brand{font-weight:700;font-size:14px;letter-spacing:.3px;margin-right:6px;white-space:nowrap;}
  .topbar select, .topbar button{
    font-family:inherit;font-size:12.5px;border-radius:5px;border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12);color:#fff;padding:6px 10px;cursor:pointer;
  }
  .topbar select option{color:#111;}
  .topbar button{background:#fff;color:var(--teal-dark);font-weight:600;border:none;}
  .topbar button.secondary{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);font-weight:500;}
  .topbar button:hover{filter:brightness(1.05);}
  .topbar button.secondary.active{background:#fff;color:var(--teal-dark);}
  .topbar .divider{width:1px;align-self:stretch;background:rgba(255,255,255,.3);margin:0 2px;}
  .topbar .spacer{flex:1;}
  .mode-toggle{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:6px;overflow:hidden;}
  .mode-toggle button{border-radius:0;border:none;background:transparent;color:#fff;padding:6px 12px;font-weight:500;}
  .mode-toggle button.active{background:#fff;color:var(--teal-dark);font-weight:700;}

  .main{display:flex;flex:1;min-height:0;}

  /* ---------- Editor panel ---------- */
  .editor{
    width:400px;min-width:340px;max-width:460px;background:#fff;border-right:1px solid #d8d5d0;
    overflow-y:auto;padding:18px 18px 60px;
  }
  .editor h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--teal-dark);
    border-bottom:1px solid var(--sand);padding-bottom:6px;margin:22px 0 10px;}
  .editor h3:first-child{margin-top:0;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;font-weight:600;color:#5a5f66;margin-bottom:3px;}
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    width:100%;font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid #d3d0cb;
    border-radius:5px;background:#fbfaf9;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:56px;line-height:1.4;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .help{font-size:10.5px;color:#8a8f96;margin-top:4px;line-height:1.4;}
  .paste-help{background:var(--teal-tint);border:1px solid var(--teal);border-radius:6px;padding:8px 10px;font-size:10.5px;line-height:1.5;margin-bottom:10px;color:#3d5a66;}
  .paste-help code{background:rgba(255,255,255,.7);padding:1px 4px;border-radius:3px;}

  .section-card{border:1px solid #e1ded8;border-radius:7px;padding:10px;margin-bottom:10px;background:#fdfcfb;}
  .section-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .section-card-head span{font-size:10.5px;font-weight:700;color:var(--rust);text-transform:uppercase;letter-spacing:.4px;}
  .tiny-btn{background:none;border:none;color:#9a5340;font-size:11px;cursor:pointer;font-weight:600;padding:2px 4px;}
  .tiny-btn:hover{text-decoration:underline;}
  .add-btn{width:100%;padding:8px;border:1.5px dashed var(--teal);border-radius:6px;background:var(--teal-tint);
    color:var(--teal-dark);font-weight:600;font-size:12px;cursor:pointer;margin-top:4px;}
  .add-btn:hover{background:#dceaf0;}
  .bullet-row{display:flex;gap:6px;margin-bottom:5px;align-items:flex-start;}
  .bullet-row input{flex:1;}
  .infobox-type-select{margin-bottom:4px;}
  .block-list .block-row{border-top:1px dashed #e6e3dd;padding-top:8px;margin-top:8px;}
  .block-row:first-child{border-top:none;padding-top:0;margin-top:0;}

  /* ---------- Preview pane ---------- */
  .preview-pane{flex:1;overflow:auto;padding:32px 24px;display:flex;justify-content:center;align-items:flex-start;background:#e7e5e1;}
  .page{
    width:8.5in;min-height:11in;background:#fff;position:relative;
    box-shadow:0 4px 22px rgba(0,0,0,.18);font-family:'Montserrat',sans-serif;color:var(--ink);
    flex-shrink:0;
    --fs-h1:21pt;--fs-h2:12.5pt;--fs-body:9.5pt;--fs-small:8pt;--lh-body:1.4;
  }
  .page.scale-large{ --fs-h1:25pt;--fs-h2:15pt;--fs-body:12.5pt;--fs-small:10.5pt;--lh-body:1.5; }
  .page.scale-xl{ --fs-h1:28pt;--fs-h2:17.5pt;--fs-body:15pt;--fs-small:12.5pt;--lh-body:1.6; }
  .header-band{
    background:var(--teal);color:#fff;min-height:1.5in;padding:.3in .75in 12pt;
    display:flex;flex-direction:column;justify-content:center;position:relative;
  }
  .header-band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5pt;background:var(--rust);}
  .wordmark{font-size:10pt;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;}
  .wordmark-sub{font-size:8pt;font-weight:400;opacity:.92;margin-top:1pt;}
  .doc-title{font-size:var(--fs-h1);font-weight:700;margin-top:6pt;line-height:1.15;}
  .badge{display:inline-block;padding:2pt 9pt;border-radius:9pt;font-size:8pt;font-weight:700;
    color:#fff;background:var(--rust);letter-spacing:.3px;margin-top:6pt;}
  .header-band-row{display:flex;align-items:center;gap:9pt;}
  .header-logo-badge{width:38pt;height:38pt;min-width:38pt;border-radius:50%;background:#fff;padding:4pt;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.18);}
  .header-logo-badge img{width:100%;height:100%;object-fit:contain;display:block;}

  /* Real letterhead (patient / specialist letters) */
  .page.is-letterhead{display:flex;flex-direction:column;}
  .letterhead-header-img{width:100%;display:block;}
  .letterhead-footer-img{width:100%;display:block;margin-top:auto;}
  .content.letter-content{padding:.35in .75in;min-height:auto;flex:1;}
  .letter-disclaimer{margin-top:16pt;padding-top:8pt;border-top:.5pt solid var(--sand);
    font-size:var(--fs-small);font-style:italic;color:#5a5f5a;}
  .header-meta-row{display:flex;gap:16pt;font-size:8pt;margin-top:8pt;flex-wrap:wrap;opacity:.97;}
  .header-meta-row b{font-weight:700;}

  .content{padding:.3in .75in 1.1in;font-size:var(--fs-body);line-height:var(--lh-body);min-height:7.9in;}
  .letter-top{margin-bottom:10pt;}
  .letter-top .date-line{text-align:right;margin-bottom:12pt;}
  .letter-top .recipient-block{margin-bottom:10pt;}
  .letter-top .re-line{font-weight:700;margin-bottom:10pt;}
  .salutation{margin:0 0 8pt;}
  .closing{margin-top:16pt;}
  .signature{margin-top:26pt;font-weight:600;}
  .signature .cred{font-weight:400;}

  .section-heading{font-size:var(--fs-h2);font-weight:700;color:var(--teal-dark);margin:14pt 0 5pt;
    display:flex;align-items:center;gap:6pt;}
  .section-heading:first-child{margin-top:0;}
  p.body-p{margin:0 0 8pt;}
  ul.bullet-list{list-style:none;margin:0 0 8pt;padding-left:14pt;}
  ul.bullet-list li{position:relative;margin-bottom:6pt;padding-left:12pt;}
  ul.bullet-list li::before{content:"•";position:absolute;left:0;color:var(--ink);}
  ul.bullet-list.with-icons{padding-left:2pt;}
  ul.bullet-list.with-icons li{padding-left:24pt;}
  ul.bullet-list.with-icons li::before{content:"";}
  ul.bullet-list.with-icons li .icon{position:absolute;left:0;top:1pt;}

  .info-box{margin:10pt 0;border-radius:3px;overflow:hidden;}
  .info-box .box-head{padding:6pt 12pt;font-size:calc(var(--fs-body) + .5pt);font-weight:700;color:#fff;
    display:flex;align-items:center;gap:6pt;}
  .info-box .box-body{background:var(--cream);padding:11pt 12pt;font-size:var(--fs-body);line-height:var(--lh-body);}
  .info-box.info .box-head{background:var(--teal-dark);}
  .info-box.warn .box-head{background:var(--rust);}
  .info-box.tip .box-head{background:var(--sage);}

  table.data-table{width:100%;border-collapse:collapse;margin:10pt 0;font-size:var(--fs-body);}
  table.data-table th{background:var(--teal-dark);color:#fff;text-align:left;padding:6pt 8pt;font-weight:600;}
  table.data-table td{padding:6pt 8pt;border-bottom:.5pt solid var(--sand);}
  table.data-table tr:nth-child(even) td{background:var(--cream);}

  /* Medication list */
  .med-list{margin:10pt 0;display:flex;flex-direction:column;gap:8pt;}
  .med-card{border:1pt solid var(--sand);border-radius:4px;overflow:hidden;background:#fff;}
  .med-card-head{background:var(--teal-tint);padding:7pt 12pt;display:flex;align-items:baseline;gap:8pt;flex-wrap:wrap;}
  .med-card-head .icon{color:var(--teal-dark);align-self:center;}
  .med-name{font-weight:700;font-size:calc(var(--fs-body) + 1pt);color:var(--ink);}
  .med-dose{font-weight:600;color:var(--teal-dark);}
  .med-card-body{padding:8pt 12pt;font-size:var(--fs-body);line-height:var(--lh-body);}
  .med-row{display:flex;align-items:center;gap:6pt;margin-bottom:4pt;flex-wrap:wrap;}
  .med-row:last-child{margin-bottom:0;}
  .med-row .icon{color:var(--rust);flex-shrink:0;}
  .med-schedule-tags{display:flex;gap:8pt;flex-wrap:wrap;}
  .med-schedule-tag{display:flex;align-items:center;gap:3pt;background:var(--sage-tint);border-radius:9pt;
    padding:2pt 8pt;font-size:calc(var(--fs-small));}
  .med-schedule-tag .icon{color:#5c6e52;width:12pt;height:12pt;}
  .med-purpose{color:#4a4e52;}
  .med-purpose b{color:var(--ink);}

  .icon{display:inline-flex;vertical-align:middle;width:1em;height:1em;stroke-width:2px;}
  .icon svg{width:1.15em;height:1.15em;}

  .footer-band{
    position:absolute;left:0;right:0;bottom:0;min-height:.62in;background:var(--cream);
    border-top:3pt solid var(--sage);padding:8pt .75in;display:flex;align-items:center;
    justify-content:space-between;font-size:var(--fs-small);font-style:italic;color:#5a5f5a;gap:10px;flex-wrap:wrap;
  }
  .footer-band .clinic-line{font-style:normal;font-weight:600;color:var(--ink);white-space:nowrap;}
  .footer-band .disclaimer{text-align:right;}

  .empty-hint{color:#b5b0a8;font-style:italic;font-size:9.5pt;}

  /* Medication List (dedicated document type) */
  .medlist-staff-tag{font-size:8pt;font-weight:600;text-align:right;opacity:.92;line-height:1.5;white-space:nowrap;}
  .medlist-title{font-size:calc(var(--fs-h1) + 6pt);font-weight:700;color:var(--teal-dark);margin:0 0 6pt;line-height:1.15;}
  .medlist-subtitle{font-size:calc(var(--fs-body) + 2pt);font-weight:600;color:#5a5f5a;margin:0 0 14pt;line-height:1.4;}
  .medlist-group{margin-bottom:14pt;}
  .medlist-group-head{color:#fff;font-weight:700;font-size:var(--fs-h2);padding:9pt 12pt;border-radius:4px 4px 0 0;
    letter-spacing:.3px;display:flex;align-items:center;gap:6pt;}
  .medlist-group-head.bar-teal{background:var(--teal-dark);}
  .medlist-group-head.bar-sage{background:var(--sage);color:var(--ink);}
  .medlist-group-head.bar-rust{background:var(--rust);}
  .medlist-group-body{background:var(--cream);border-radius:0 0 4px 4px;}
  .medlist-patient-card{padding:12pt 14pt;border-bottom:.5pt solid var(--sand);}
  .medlist-patient-card:last-child{border-bottom:none;}
  .medlist-patient-name{font-weight:700;font-size:calc(var(--fs-body) + 4pt);color:var(--ink);line-height:1.15;
    display:flex;align-items:center;gap:6pt;flex-wrap:wrap;}
  .medlist-patient-name .icon{color:var(--teal-dark);}
  .medlist-patient-sig{font-size:calc(var(--fs-body) + 1pt);font-weight:600;color:var(--ink);margin-top:5pt;line-height:var(--lh-body);}
  .medlist-patient-indication{font-size:var(--fs-body);font-weight:700;color:var(--teal-dark);margin-top:4pt;}
  .supp-badge{display:inline-flex;align-items:center;gap:3pt;background:var(--sage-tint);color:#4d5c43;
    border-radius:8pt;padding:1pt 7pt;font-size:calc(var(--fs-small) - .5pt);font-weight:700;
    text-transform:uppercase;letter-spacing:.3px;}
  .medlist-callout{margin:12pt 0;background:var(--rust-tint);border-left:4pt solid var(--rust);
    border-radius:0 4px 4px 0;padding:10pt 13pt;}
  .medlist-callout.gray{background:#eceeef;border-left-color:#6b727b;}
  .medlist-callout-head{font-weight:700;font-size:var(--fs-body);color:var(--rust);margin-bottom:5pt;
    letter-spacing:.3px;display:flex;align-items:center;gap:6pt;}
  .medlist-callout.gray .medlist-callout-head{color:#4b5157;}
  .medlist-callout ul{margin:0;padding-left:15pt;font-size:var(--fs-body);line-height:1.55;color:var(--ink);
    display:flex;flex-direction:column;gap:3pt;}
  .med-clinical-table{width:100%;border-collapse:collapse;font-size:calc(var(--fs-body) - 1pt);margin-bottom:14pt;}
  .med-clinical-table thead tr{background:var(--teal);color:#fff;}
  .med-clinical-table th{padding:5pt 7pt;text-align:left;font-weight:600;}
  .med-clinical-table td{padding:6pt 7pt;border-bottom:.5pt solid var(--sand);vertical-align:top;}
  .med-clinical-table tr:nth-child(odd) td{background:var(--cream);}
  .med-clinical-table tr:nth-child(even) td{background:#fff;}
  .med-clinical-table td.med-notes-flag{color:var(--rust);}
  .med-clinical-table td.med-dispense{color:#5a5f5a;white-space:nowrap;}

  @media print{
    body{background:#fff;}
    .topbar,.editor{display:none !important;}
    .preview-pane{padding:0;display:block;background:#fff;}
    .page{box-shadow:none;margin:0;width:auto;min-height:auto;}
    @page{size:letter;margin:0;}
  }
</style>
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <div class="brand">BHW Document Builder</div>
    <select id="docTypeSelect"></select>
    <div class="mode-toggle">
      <button id="modeBuildBtn" class="active">Build sections</button>
      <button id="modePasteBtn">Paste text</button>
    </div>
    <div class="spacer"></div>
    <select id="textSizeSelect" title="Text size for patients">
      <option value="standard">Aa Standard text</option>
      <option value="large">Aa Large text</option>
      <option value="xl">Aa Extra-large text</option>
    </select>
    <button class="secondary" id="visualAidsBtn" title="Add simple icons throughout for low-literacy patients">Icons: off</button>
    <div class="divider"></div>
    <button class="secondary" id="loadSampleBtn">Load sample</button>
    <button class="secondary" id="resetBtn">Reset</button>
    <button class="secondary" id="downloadBtn">Download HTML</button>
    <button id="printBtn">Print / Save PDF</button>
  </div>

  <div class="main">
    <div class="editor" id="editor"></div>
    <div class="preview-pane">
      <div class="page" id="page"></div>
    </div>
  </div>

</div>

/* ---------------- Freeform text parser ----------------
   ## Heading           -> new section
   - text / * text      -> bullet (supports **bold**)
   TIP: / INFO: / WARN: -> info box (kind + rest of line)
   a | b | c  rows       -> table (first pipe row = headers)
   blank line            -> block break
   plain lines           -> paragraph
--------------------------------------------------------- */
function parseRawText(raw){
  const lines = raw.replace(/\r\n/g,"\n").split("\n");
  const sections = [];
  let current = null;
  let paraBuf = [];
  let tableBuf = null;
  let medBuf = null;

  function ensureSection(){
    if(!current){ current = { heading:"", blocks:[] }; sections.push(current); }
  }
  function flushPara(){
    if(paraBuf.length){
      ensureSection();
      current.blocks.push({ type:"para", text: paraBuf.join(" ") });
      paraBuf = [];
    }
  }
  function flushTable(){
    if(tableBuf){
      ensureSection();
      current.blocks.push({ type:"table", headers: tableBuf[0], rows: tableBuf.slice(1) });
      tableBuf = null;
    }
  }
  function flushMeds(){
    if(medBuf){
      ensureSection();
      current.blocks.push({ type:"medlist", items: medBuf });
      medBuf = null;
    }
  }

  lines.forEach(line => {
    const t = line.trim();
    if(t === ""){ flushPara(); flushTable(); flushMeds(); return; }

    if(t.startsWith("## ")){
      flushPara(); flushTable(); flushMeds();
      current = { heading: t.slice(3).trim(), blocks:[] };
      sections.push(current);
      return;
    }
    const medMatch = t.match(/^MED\s*:\s*(.*)$/i);
    if(medMatch){
      flushPara(); flushTable();
      ensureSection();
      const parts = medMatch[1].split("|").map(c=>c.trim());
      const [name="", dose="", scheduleStr="", withFoodStr="", purpose="", instructions=""] = parts;
      const schedule = scheduleStr.split(",").map(s=>s.trim().toLowerCase().replace(/\s+/g,"")).filter(s=>SCHEDULE_META[s]);
      const withFood = /^y(es)?$/i.test(withFoodStr.trim());
      if(!medBuf) medBuf = [];
      medBuf.push({ name, dose, schedule, withFood, purpose, instructions });
      return;
    }
    if(t.startsWith("- ") || t.startsWith("* ")){
      flushPara(); flushTable(); flushMeds();
      ensureSection();
      const last = current.blocks[current.blocks.length-1];
      const item = t.slice(2).trim();
      if(last && last.type === "bullets"){ last.items.push(item); }
      else { current.blocks.push({ type:"bullets", items:[item] }); }
      return;
    }
    const infoMatch = t.match(/^(TIP|INFO|WARN|CALL|WHEN TO CALL)\s*:\s*(.*)$/i);
    if(infoMatch){
      flushPara(); flushTable(); flushMeds();
      ensureSection();
      const kw = infoMatch[1].toUpperCase();
      const kind = kw === "TIP" ? "tip" : (kw === "INFO" ? "info" : "warn");
      current.blocks.push({ type:"infobox", kind, text: infoMatch[2].trim() });
      return;
    }
    if(t.includes("|") && t.replace(/[-|\s:]/g,"").length > 0){
      flushPara(); flushMeds();
      const cells = t.split("|").map(c=>c.trim()).filter((c,i,arr)=> !(c==="" && (i===0 || i===arr.length-1)));
      if(cells.every(c => /^:?-{2,}:?$/.test(c))) return; // markdown separator row
      if(!tableBuf) tableBuf = [];
      tableBuf.push(cells);
      return;
    }
    flushTable(); flushMeds();
    paraBuf.push(t);
  });
  flushPara(); flushTable(); flushMeds();
  if(sections.length === 0) sections.push({heading:"",blocks:[]});
  return sections;
}

function bold(text){
  return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}
function escapeHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ---------------- Rendering ---------------- */
function renderBlocks(blocks){
  let html = "";
  (blocks||[]).forEach(b=>{
    if(b.type === "para" && b.text && b.text.trim()){
      html += `<p class="body-p">${bold(b.text)}</p>`;
    } else if(b.type === "bullets" && b.items && b.items.length){
      const cls = visualAids ? "bullet-list with-icons" : "bullet-list";
      html += `<ul class="${cls}">${b.items.filter(i=>i.trim()).map(i=>`<li>${visualAids?iconTag("circle-check"):""}${bold(i)}</li>`).join("")}</ul>`;
    } else if(b.type === "infobox" && b.text && b.text.trim()){
      const label = b.kind === "warn" ? "When to call" : (b.kind === "tip" ? "Tip" : "Good to know");
      const iconName = b.kind === "warn" ? "triangle-alert" : (b.kind === "tip" ? "lightbulb" : "info");
      html += `<div class="info-box ${b.kind}"><div class="box-head">${visualAids?iconTag(iconName):""}${b.heading || label}</div><div class="box-body">${bold(b.text)}</div></div>`;
    } else if(b.type === "table" && b.headers && b.headers.length){
      html += `<table class="data-table"><thead><tr>${b.headers.map(h=>`<th>${escapeHtml(h)}</th>`).join("")}</tr></thead><tbody>`;
      (b.rows||[]).forEach(r=>{ html += `<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join("")}</tr>`; });
      html += `</tbody></table>`;
    } else if(b.type === "medlist" && b.items && b.items.length){
      html += renderMedList(b.items);
    }
  });
  return html;
}

function renderMedList(items){
  let html = `<div class="med-list">`;
  items.filter(m=>m.name && m.name.trim()).forEach(m=>{
    const tags = (m.schedule||[]).map(s=>{
      const meta = SCHEDULE_META[s]; if(!meta) return "";
      return `<span class="med-schedule-tag">${visualAids?iconTag(meta.icon):""}${meta.label}</span>`;
    }).join("");
    html += `<div class="med-card">
      <div class="med-card-head">
        ${visualAids?iconTag("pill"):""}
        <span class="med-name">${escapeHtml(m.name)}</span>
        ${m.dose ? `<span class="med-dose">${escapeHtml(m.dose)}</span>` : ""}
      </div>
      <div class="med-card-body">
        ${tags || m.withFood ? `<div class="med-row"><div class="med-schedule-tags">${tags}${m.withFood?`<span class="med-schedule-tag">${visualAids?iconTag("utensils"):""}Take with food</span>`:""}</div></div>` : ""}
        ${m.purpose ? `<div class="med-row">${visualAids?iconTag("heart-pulse"):""}<span class="med-purpose"><b>Why:</b> ${bold(m.purpose)}</span></div>` : ""}
        ${m.instructions ? `<div class="med-row">${visualAids?iconTag("clipboard-list"):""}<span>${bold(m.instructions)}</span></div>` : ""}
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderSections(sections){
  let html = "";
  (sections||[]).forEach(s=>{
    if(s.heading && s.heading.trim()) html += `<div class="section-heading">${escapeHtml(s.heading)}</div>`;
    html += renderBlocks(s.blocks);
  });
  return html || `<p class="empty-hint">Start typing in the editor to see your document take shape…</p>`;
}

function renderLetterTop(cfg){
  if(!cfg.isLetter) return "";
  let html = `<div class="letter-top">`;
  if(state.meta.date) html += `<div class="date-line">${escapeHtml(state.meta.date)}</div>`;
  if(cfg.letterRecipientIsPatient){
    if(state.meta.patientName) html += `<div class="recipient-block">${escapeHtml(state.meta.patientName)}</div>`;
  } else {
    const recip = [state.meta.recipientName, state.meta.recipientSpecialty].filter(Boolean).join(" — ");
    if(recip) html += `<div class="recipient-block">${escapeHtml(recip)}</div>`;
    const re = [state.meta.patientName, state.meta.dob ? ("DOB " + state.meta.dob) : ""].filter(Boolean).join(", ");
    if(re) html += `<div class="re-line">Re: ${escapeHtml(re)}</div>`;
  }
  const salTo = cfg.letterRecipientIsPatient
    ? (state.meta.patientName ? state.meta.patientName.split(" ")[0] : "")
    : (state.meta.recipientName || "");
  html += `<div class="salutation">Dear ${salTo ? escapeHtml(salTo) : "___"},</div>`;
  html += `</div>`;
  return html;
}

function pageInnerHtml(cfg, sections){

  if(cfg.isLetter){

    // re-created header/footer band for actual correspondence.
    return `
      <img class="letterhead-header-img" src="${LETTERHEAD_HEADER_DATA_URI}" alt="BHW Medical Group letterhead"/>

function applyAccessibilityClasses(){
  const page = document.getElementById("page");
  page.classList.remove("scale-large","scale-xl");
  if(textSize === "large") page.classList.add("scale-large");
  if(textSize === "xl") page.classList.add("scale-xl");
  page.classList.toggle("is-letterhead", !!DOC_CONFIG[state.docType].isLetter);
}

function refreshIcons(){
  if(visualAids && window.lucide && typeof lucide.createIcons === "function"){
    lucide.createIcons();
  }
}

function render(){
  const cfg = DOC_CONFIG[state.docType];
  const sections = state.mode === "paste" ? parseRawText(state.rawText) : state.sections;
  const page = document.getElementById("page");
  page.innerHTML = pageInnerHtml(cfg, sections);
  applyAccessibilityClasses();
  refreshIcons();
  renderEditor();
}

function field(labelText, value, onInput, opts){
  opts = opts || {};
  const id = "f_" + Math.random().toString(36).slice(2,9);
  return `<div class="field"><label for="${id}">${labelText}</label>
    <input type="text" id="${id}" value="${escapeHtml(value||"")}" data-bind="${opts.bind}" placeholder="${opts.placeholder||""}"/></div>`;
}

    html += `<div class="field"><textarea data-role="rawText" style="min-height:340px;">${escapeHtml(state.rawText)}</textarea></div>`;

        <div class="block-list">`;
      sec.blocks.forEach((b, bi)=>{

              </div>

        html += `</div>`;

          <button class="tiny-btn" data-action="addBlock" data-type="infobox" data-si="${si}">+ callout</button>
          <button class="tiny-btn" data-action="addBlock" data-type="table" data-si="${si}">+ table</button>
          <button class="tiny-btn" data-action="addBlock" data-type="medlist" data-si="${si}">+ medications</button>
        </div>
      </div>`;
    });
    html += `<button class="add-btn" id="addSectionBtn">+ Add section</button>`;
  }

  if(cfg.isLetter){
    html += `<h3>Closing</h3>`;
    html += `<div class="field"><label>Closing line</label><input type="text" data-role="closing" value="${escapeHtml(state.closing)}"/></div>`;
    html += `<div class="row2"><div class="field"><label>Signed by</label><input type="text" data-role="signatureName" value="${escapeHtml(state.signatureName)}"/></div>
      <div class="field"><label>Credentials</label><input type="text" data-role="signatureCredentials" value="${escapeHtml(state.signatureCredentials)}"/></div></div>`;
  }

  html += `<h3>Footer disclaimer</h3>
    <div class="field"><textarea data-role="footer">${escapeHtml(state.footer)}</textarea></div>`;

  ed.innerHTML = html;
  bindEditorEvents();
}

function tableToText(b){
  const rows = [b.headers, ...(b.rows||[])];
  return rows.map(r=>r.join(" | ")).join("\n");
}
function textToTable(txt){
  const rows = txt.split("\n").map(l=>l.trim()).filter(l=>l!=="").map(l=>l.split("|").map(c=>c.trim()));
  return { headers: rows[0]||[], rows: rows.slice(1) };
}

function bindEditorEvents(){
  const ed = document.getElementById("editor");

  ed.querySelectorAll('input[data-role="meta"]').forEach(inp=>{
    inp.addEventListener("input", e=>{ state.meta[e.target.dataset.key] = e.target.value; syncPreviewOnly(); });
  });
  const titleInp = ed.querySelector('input[data-role="title"]');
  if(titleInp) titleInp.addEventListener("input", e=>{ state.title = e.target.value; syncPreviewOnly(); });
  const badgeInp = ed.querySelector('input[data-role="badgeText"]');
  if(badgeInp) badgeInp.addEventListener("input", e=>{ state.badgeText = e.target.value; syncPreviewOnly(); });

  const rawTa = ed.querySelector('textarea[data-role="rawText"]');
  if(rawTa) rawTa.addEventListener("input", e=>{ state.rawText = e.target.value; syncPreviewOnly(); });

  ed.querySelectorAll('input[data-role="secHeading"]').forEach(inp=>{
    inp.addEventListener("input", e=>{ state.sections[+e.target.dataset.si].heading = e.target.value; syncPreviewOnly(); });
  });
  ed.querySelectorAll('textarea[data-role="blockPara"]').forEach(ta=>{
    ta.addEventListener("input", e=>{ state.sections[+e.target.dataset.si].blocks[+e.target.dataset.bi].text = e.target.value; syncPreviewOnly(); });
  });
  ed.querySelectorAll('input[data-role="bulletItem"]').forEach(inp=>{
    inp.addEventListener("input", e=>{
      const {si,bi,ii} = e.target.dataset;
      state.sections[+si].blocks[+bi].items[+ii] = e.target.value; syncPreviewOnly();
    });
  });
  ed.querySelectorAll('select[data-role="infoboxKind"]').forEach(sel=>{
    sel.addEventListener("change", e=>{ state.sections[+e.target.dataset.si].blocks[+e.target.dataset.bi].kind = e.target.value; syncPreviewOnly(); });
  });
  ed.querySelectorAll('textarea[data-role="infoboxText"]').forEach(ta=>{
    ta.addEventListener("input", e=>{ state.sections[+e.target.dataset.si].blocks[+e.target.dataset.bi].text = e.target.value; syncPreviewOnly(); });
  });
  ed.querySelectorAll('[data-role="medField"]').forEach(inp=>{
    inp.addEventListener("input", e=>{
      const {si,bi,mi,key} = e.target.dataset;
      state.sections[+si].blocks[+bi].items[+mi][key] = e.target.value; syncPreviewOnly();
    });
  });
  ed.querySelectorAll('[data-role="medSchedule"]').forEach(cb=>{
    cb.addEventListener("change", e=>{
      const {si,bi,mi,key} = e.target.dataset;
      const m = state.sections[+si].blocks[+bi].items[+mi];
      const idx = m.schedule.indexOf(key);
      if(e.target.checked && idx===-1) m.schedule.push(key);
      if(!e.target.checked && idx>-1) m.schedule.splice(idx,1);
      syncPreviewOnly();
    });
  });
  ed.querySelectorAll('[data-role="medWithFood"]').forEach(cb=>{
    cb.addEventListener("change", e=>{
      const {si,bi,mi} = e.target.dataset;
      state.sections[+si].blocks[+bi].items[+mi].withFood = e.target.checked;
      syncPreviewOnly();
    });
  });
  ed.querySelectorAll('[data-action="addMed"]').forEach(btn=>{
    btn.addEventListener("click", e=>{
      const {si,bi} = e.target.dataset;
      state.sections[+si].blocks[+bi].items.push(blankMed());
      render();
    });
  });
  ed.querySelectorAll('[data-action="removeMed"]').forEach(btn=>{
    btn.addEventListener("click", e=>{
      const {si,bi,mi} = e.target.dataset;
      state.sections[+si].blocks[+bi].items.splice(+mi,1);
      render();
    });
  });
  ed.querySelectorAll('textarea[data-role="tableText"]').forEach(ta=>{
    ta.addEventListener("input", e=>{
      const t = textToTable(e.target.value);
      const b = state.sections[+e.target.dataset.si].blocks[+e.target.dataset.bi];
      b.headers = t.headers; b.rows = t.rows;
      syncPreviewOnly();
    });
  });

  const closingInp = ed.querySelector('input[data-role="closing"]');
  if(closingInp) closingInp.addEventListener("input", e=>{ state.closing = e.target.value; syncPreviewOnly(); });
  const sigName = ed.querySelector('input[data-role="signatureName"]');
  if(sigName) sigName.addEventListener("input", e=>{ state.signatureName = e.target.value; syncPreviewOnly(); });
  const sigCred = ed.querySelector('input[data-role="signatureCredentials"]');
  if(sigCred) sigCred.addEventListener("input", e=>{ state.signatureCredentials = e.target.value; syncPreviewOnly(); });
  const footerTa = ed.querySelector('textarea[data-role="footer"]');
  if(footerTa) footerTa.addEventListener("input", e=>{ state.footer = e.target.value; syncPreviewOnly(); });

  const addSectionBtn = document.getElementById("addSectionBtn");
  if(addSectionBtn) addSectionBtn.addEventListener("click", ()=>{ state.sections.push(blankSection()); render(); });

  ed.querySelectorAll('[data-action="removeSection"]').forEach(btn=>{
    btn.addEventListener("click", e=>{ state.sections.splice(+e.target.dataset.si,1); render(); });
  });
  ed.querySelectorAll('[data-action="addBlock"]').forEach(btn=>{
    btn.addEventListener("click", e=>{
      const si = +e.target.dataset.si, type = e.target.dataset.type;
      let block;
      if(type==="para") block = {type:"para", text:""};
      else if(type==="bullets") block = {type:"bullets", items:[""]};
      else if(type==="infobox") block = {type:"infobox", kind:"info", text:""};
      else if(type==="table") block = {type:"table", headers:["",""], rows:[["",""]]};
      else if(type==="medlist") block = {type:"medlist", items:[blankMed()]};
      state.sections[si].blocks.push(block);
      render();
    });
  });
  ed.querySelectorAll('[data-action="removeBlock"]').forEach(btn=>{
    btn.addEventListener("click", e=>{
      const si = +e.target.dataset.si, bi = +e.target.dataset.bi;
      state.sections[si].blocks.splice(bi,1);
      render();
    });
  });
  ed.querySelectorAll('[data-action="addBullet"]').forEach(btn=>{
    btn.addEventListener("click", e=>{
      const si = +e.target.dataset.si, bi = +e.target.dataset.bi;
      state.sections[si].blocks[bi].items.push("");
      render();
    });
  });
  ed.querySelectorAll('[data-action="removeBullet"]').forEach(btn=>{
    btn.addEventListener("click", e=>{
      const {si,bi,ii} = e.target.dataset;
      state.sections[+si].blocks[+bi].items.splice(+ii,1);
      render();
    });
  });
}

  ed.querySelectorAll('[data-role="fmRoute"]').forEach(sel=>{
    sel.addEventListener("change", e=>{ state.medications[+e.target.dataset.mi].route = e.target.value; syncPreviewOnly(); });
  });
  ed.querySelectorAll('[data-role="fmSection"]').forEach(sel=>{
    sel.addEventListener("change", e=>{ state.medications[+e.target.dataset.mi].patientSection = e.target.value; syncPreviewOnly(); });
  });
  ed.querySelectorAll('[data-role="fmSupplement"]').forEach(cb=>{
    cb.addEventListener("change", e=>{ state.medications[+e.target.dataset.mi].isSupplement = e.target.checked; syncPreviewOnly(); });
  });
  ed.querySelectorAll('[data-role="fmReview"]').forEach(cb=>{
    cb.addEventListener("change", e=>{ state.medications[+e.target.dataset.mi].needsReview = e.target.checked; syncPreviewOnly(); });
  });
  const addBtn = document.getElementById("addFullMedBtn");
  if(addBtn) addBtn.addEventListener("click", ()=>{ state.medications.push(blankFullMed()); render(); });
  ed.querySelectorAll('[data-action="removeFullMed"]').forEach(btn=>{
    btn.addEventListener("click", e=>{ state.medications.splice(+e.target.dataset.mi,1); render(); });
  });
  const pf = ed.querySelector('[data-role="providerFlags"]');
  if(pf) pf.addEventListener("input", e=>{ state.providerFlags = e.target.value; syncPreviewOnly(); });
  const iff = ed.querySelector('[data-role="interactionFlags"]');
  if(iff) iff.addEventListener("input", e=>{ state.interactionFlags = e.target.value; syncPreviewOnly(); });
  const vin = ed.querySelector('[data-role="visualImpairmentNotes"]');
  if(vin) vin.addEventListener("input", e=>{ state.visualImpairmentNotes = e.target.value; syncPreviewOnly(); });
  const impn = ed.querySelector('[data-role="importantNotes"]');
  if(impn) impn.addEventListener("input", e=>{ state.importantNotes = e.target.value; syncPreviewOnly(); });
  const footerTa = ed.querySelector('textarea[data-role="footer"]');
  if(footerTa) footerTa.addEventListener("input", e=>{ state.footer = e.target.value; syncPreviewOnly(); });
}

// Update only the preview page (not the whole editor) so focus/cursor isn't lost while typing.
function syncPreviewOnly(){
  const cfg = DOC_CONFIG[state.docType];
  const sections = state.mode === "paste" ? parseRawText(state.rawText) : state.sections;
  const page = document.getElementById("page");
  page.innerHTML = pageInnerHtml(cfg, sections);
  applyAccessibilityClasses();
  refreshIcons();
}

/* ---------------- Top bar controls ---------------- */
function initTopbar(){
  const sel = document.getElementById("docTypeSelect");
  sel.innerHTML = Object.keys(DOC_CONFIG).map(k=>`<option value="${k}">${DOC_CONFIG[k].label}</option>`).join("");
  sel.value = state.docType;
  sel.addEventListener("change", ()=>{
    state = defaultStateFor(sel.value);
    setModeButtons();
    render();
  });

  document.getElementById("modeBuildBtn").addEventListener("click", ()=>{
    if(state.docType === "medication_list"){ state.medVariant = "patient"; state.footer = defaultMedFooter("patient"); }
    else state.mode = "build";
    setModeButtons(); render();
  });
  document.getElementById("modePasteBtn").addEventListener("click", ()=>{
    if(state.docType === "medication_list"){ state.medVariant = "clinical"; state.footer = defaultMedFooter("clinical"); }
    else state.mode = "paste";
    setModeButtons(); render();
  });

  document.getElementById("printBtn").addEventListener("click", ()=> window.print());

  const textSizeSelect = document.getElementById("textSizeSelect");
  textSizeSelect.value = textSize;
  textSizeSelect.addEventListener("change", e=>{ textSize = e.target.value; applyAccessibilityClasses(); });

  const visualAidsBtn = document.getElementById("visualAidsBtn");
  visualAidsBtn.addEventListener("click", ()=>{
    visualAids = !visualAids;
    visualAidsBtn.textContent = "Icons: " + (visualAids ? "on" : "off");
    visualAidsBtn.classList.toggle("active", visualAids);
    render();
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(confirm("Clear this document and start over?")){
      state = defaultStateFor(state.docType);
      setModeButtons();
      render();
    }
  });

  document.getElementById("loadSampleBtn").addEventListener("click", ()=>{
    const s = SAMPLES[state.docType];
    if(!s) return;
    if(state.docType === "medication_list"){
      state.meta = Object.assign({}, state.meta, s.meta);
      state.medications = JSON.parse(JSON.stringify(s.medications));
      state.providerFlags = s.providerFlags || "";
      state.interactionFlags = s.interactionFlags || "";
      state.visualImpairmentNotes = s.visualImpairmentNotes || "";
      state.importantNotes = s.importantNotes || "";
      render();
      return;
    }
    const cfg = DOC_CONFIG[state.docType];
    state.title = s.title || cfg.defaultTitle;
    state.meta = Object.assign({}, state.meta, s.meta);
    state.sections = JSON.parse(JSON.stringify(s.sections));
    state.badgeText = s.badgeText || "";
    state.closing = s.closing || state.closing;
    state.signatureName = s.signatureName || state.signatureName;
    state.signatureCredentials = s.signatureCredentials || state.signatureCredentials;
    state.mode = "build";
    setModeButtons();
    render();
  });

  document.getElementById("downloadBtn").addEventListener("click", ()=>{
    const pageHtml = document.getElementById("page").outerHTML;
    const doc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeHtml(state.title || DOC_CONFIG[state.docType].label)}</title>
      <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
      <style>${document.querySelector("style").innerHTML}</style></head><body style="background:#fff;">${pageHtml}</body></html>`;
    const blob = new Blob([doc], {type:"text/html"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (state.title || DOC_CONFIG[state.docType].label).replace(/[^a-z0-9]+/gi,"_").toLowerCase() + ".html";
    a.click();
  });
}

function setModeButtons(){
  const b1 = document.getElementById("modeBuildBtn");
  const b2 = document.getElementById("modePasteBtn");
  if(state.docType === "medication_list"){
    b1.textContent = "Patient (Large Print)";
    b2.textContent = "Clinical (Staff)";
    b1.classList.toggle("active", state.medVariant !== "clinical");
    b2.classList.toggle("active", state.medVariant === "clinical");
  } else {
    b1.textContent = "Build sections";
    b2.textContent = "Paste text";
    b1.classList.toggle("active", state.mode==="build");
    b2.classList.toggle("active", state.mode==="paste");
  }
}

/* ---------------- Init ---------------- */
initTopbar();
setModeButtons();
render();
</script>
</body>
