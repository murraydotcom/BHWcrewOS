<style>
:root{--river:#80abbd;--clay:#b07a55;--clay-deep:#8c5a3c;--ink:#2b2b33;--soft:#6f6f7a;--ok:#1f6961;--urgent:#b4544b;--line:#e5e0d8;--linen:#f7f5f2;--sand:#dcc8b1}
*{box-sizing:border-box}body{margin:0;background:var(--linen);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5}.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 90px}header{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}h1,h2{font-family:var(--serif,Georgia);margin:0}h1{font-size:24px}h2{font-size:17px}.sub{font-size:10px;color:var(--clay-deep);font-weight:750;letter-spacing:.12em;text-transform:uppercase}.btn{font:inherit;font-size:12px;font-weight:700;padding:8px 14px;border:0;border-radius:99px;background:var(--clay);color:#fff;cursor:pointer}.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn:disabled{opacity:.55;cursor:not-allowed}.intro{background:#edf5f4;border:1px solid #cfe2de;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:11px}.intro b{color:var(--ok)}.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:0 0 12px}.step{font-size:9px;text-align:center;padding:6px 3px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--soft)}.step b{display:block;color:var(--clay-deep);font-size:11px}.section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:9px}.section-head p{font-size:10.5px;color:var(--soft);margin:2px 0 0;max-width:800px}.grid{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:10px}.field label{display:block;font-size:9px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin-bottom:3px}.field input,.field select,.field textarea{width:100%;font:inherit;font-size:12px;padding:8px 9px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}.field textarea{min-height:76px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--river)}.full{grid-column:1/-1}.span2{grid-column:span 2}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.check{display:flex;gap:7px;align-items:flex-start;font-size:11px}.programs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.program{display:flex;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fbfaf8;font-weight:700}.branch{border:1px solid var(--sand);background:#fdfaf6;border-radius:9px;padding:10px;margin-top:8px}.branch p{font-size:10.5px;color:var(--soft);margin:2px 0 7px}.branch textarea{width:100%;min-height:90px;font:inherit;padding:8px;border:1.5px solid var(--line);border-radius:8px}.risk{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.risk-card{border:1px solid var(--line);border-radius:9px;padding:9px}.risk-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.risk-card select{font:inherit;font-size:11px;padding:6px;border:1px solid var(--line);border-radius:7px}.risk-card input{width:100%;font:inherit;font-size:11px;padding:7px;border:1px solid var(--line);border-radius:7px;margin-top:5px}.risk-result{border:1px solid #cfe2de;background:#edf5f4;border-radius:9px;padding:10px;margin-top:10px;font-weight:700}.statusbar{position:fixed;z-index:100;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(30,40,45,.08);padding:10px 16px}.statusbar-inner{max-width:1120px;margin:auto;display:flex;align-items:center;gap:8px;justify-content:flex-end}.save-state{margin-right:auto;font-size:11px;font-weight:700;color:var(--soft)}.save-state.ok{color:var(--ok)}.save-state.bad{color:var(--urgent)}.missing{background:#fff0eb;border:1px solid #efd0c6;color:var(--urgent);border-radius:8px;padding:9px;font-size:11px;margin-top:8px}.gate{text-align:center;padding:50px 20px;color:var(--soft)}@media(max-width:820px){.grid,.checks{grid-template-columns:1fr 1fr}.programs{grid-template-columns:repeat(3,1fr)}.steps{grid-template-columns:repeat(4,1fr)}.risk{grid-template-columns:1fr}}@media(max-width:560px){.grid,.checks{grid-template-columns:1fr}.span2,.full{grid-column:auto}.programs{grid-template-columns:repeat(2,1fr)}}
</style>

<body>
<div class="wrap" id="app"><div class="gate">Loading the protected Patient Registry…</div></div>
<div class="statusbar" id="statusbar" hidden><div class="statusbar-inner"><span class="save-state" id="saveState">Not saved</span><button class="btn sec" type="button" onclick="closeFrame()">Close</button><button class="btn" id="saveButton" type="button" onclick="saveEnrollment()">Save enrollment record</button></div></div>
<script>
var TOKEN="";try{TOKEN=sessionStorage.getItem("crewos_token")||"";}catch(e){}
var PATIENTS=[], ENROLLMENTS=[], EXISTING=null;
var PROGRAMS=["APCM","CCM","PCM","BHI","COCM","CHI","PIN","PIN-PS","RPM","RTM"];
var PROGRAM_QUESTIONS={
  APCM:"Is BHW the continuing focal point for all primary care? How many qualifying chronic conditions exist? Is QMB status verified? Can BHW meet every APCM capability? Which non-time-based level is supported?",
  CCM:"Are at least 2 chronic conditions expected at least 12 months or until death? What risk of death, exacerbation, decompensation, or functional decline exists? Why is monthly coordination needed?",
  PCM:"What single high-risk condition is expected at least 3 months? What qualifying risk and disease-specific need exists? Why is PCM preferable to CCM?",
  BHI:"What behavioral condition and functional need require integrated support? What assessment, monitoring, plan, intervention, designated contact, and coordination will be used?",
  COCM:"Is the condition appropriate for CoCM and response inadequate? Are the care manager, psychiatric consultant, registry, weekly review, validated measure, brief intervention, and treating-practitioner workflow operational?",
  CHI:"What upstream driver significantly limits diagnosis or treatment? Which initiating-visit problem is affected? What person-centered resource and closed-loop plan will address it?",
  PIN:"What one serious high-risk condition meets the 3-month and risk tests? What disease-specific plan, treatment changes, caregiver help, and navigation milestones are required?",
  "PIN-PS":"Why is trained peer support clinically appropriate? Is the peer qualified? How will work remain within the practitioner plan and distinct from psychotherapy?",
  RPM:"What physiologic parameter and clinical decision will be supported? Is the device eligible and automatically connected? Can the patient use it? What data-day, alert, review, interaction, and escalation plan applies?",
  RTM:"What nonphysiologic therapeutic data and treatment plan are monitored? Which device/software, category, data days, interactive communication, and practitioner or therapy discipline apply?"
};
var PROGRAM_TRACKING={APCM:"Non-time-based: monthly required elements and the supported APCM level control readiness; minutes are optional operational data.",CCM:"Time-based: the selected CCM code and qualifying, non-duplicated minutes control monthly readiness.",PCM:"Time-based: the selected PCM pathway and qualifying, non-duplicated minutes control monthly readiness.",BHI:"Time-based: the selected General BHI pathway and qualifying, non-duplicated minutes control monthly readiness.",COCM:"Time-based: first, subsequent, or abbreviated-month CoCM requirements and qualifying minutes apply.",CHI:"Time-based: selected CHI base/add-on requirements and distinct qualifying minutes apply.",PIN:"Time-based: selected PIN base/add-on requirements and distinct qualifying minutes apply.","PIN-PS":"Time-based: the peer-support pathway, qualified personnel, and distinct qualifying minutes apply.",RPM:"Code-specific: connected-device setup, data days, treatment-management minutes, and interactive communication are tracked separately.",RTM:"Code-specific: therapeutic device/software, data days, treatment-management minutes, and interactive communication are tracked separately."};
var RISK=[
  ["clinicalInstability","Clinical instability",25],["utilizationTransitions","Utilization & transitions",20],
  ["medicationComplexity","Medication complexity",15],["behavioralHealthNeeds","Behavioral-health needs",15],
  ["socialAccessBarriers","Social & access barriers",15],["engagementDifficulty","Engagement difficulty",10]
];
var params=new URLSearchParams(location.search), FIXED_PATIENT=params.get("patient")||"", FIXED_PROGRAM=(params.get("program")||"").toUpperCase();
var SYNTHETIC_ACCEPTANCE=FIXED_PATIENT==="BHW0000"&&params.get("synthetic")==="BHW0000";

function esc(value){return String(value==null?"":value).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function at(obj,path){return path.split(".").reduce(function(value,key){return value&&value[key]!=null?value[key]:"";},obj||{});}
function field(path,label,type,options,cls){
  var value=at(EXISTING,path), id="f_"+path.replaceAll(".","_");
  var control="";
  if(type==="textarea")control='<textarea id="'+id+'" data-path="'+path+'">'+esc(value)+'</textarea>';
  else if(type==="select")control='<select id="'+id+'" data-path="'+path+'">'+options.map(function(o){var pair=Array.isArray(o)?o:[o,o];return '<option value="'+esc(pair[0])+'"'+(String(value)===String(pair[0])?' selected':'')+'>'+esc(pair[1])+'</option>';}).join("")+'</select>';
  else control='<input id="'+id+'" data-path="'+path+'" type="'+(type||"text")+'" value="'+esc(type==="date"?String(value).slice(0,10):value)+'">';
  return '<div class="field '+(cls||"")+'"><label for="'+id+'">'+label+'</label>'+control+'</div>';
}
function check(path,label){return '<label class="check"><input type="checkbox" data-path="'+path+'"'+(at(EXISTING,path)===true?' checked':'')+'>'+label+'</label>';}
function section(number,title,description,content){return '<section class="section"><div class="section-head"><div><h2>'+number+' · '+title+'</h2>'+(description?'<p>'+description+'</p>':'')+'</div></div>'+content+'</section>';}

async function api(fn,payload){var r=await fetch('/.netlify/functions/'+fn,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify(payload)});var d=await r.json().catch(function(){return {};});return {ok:r.ok,status:r.status,d:d};}

async function load(){
  if(!TOKEN){document.getElementById("app").innerHTML='<div class="gate">Your CrewOS session is missing. Close this window, sign in again, and reopen Care Management.</div>';return;}
  var res=await api("care-log-data",{action:"list",program:"All",windowEnd:new Date().toISOString().slice(0,10),includeSynthetic:SYNTHETIC_ACCEPTANCE});
  if(!res.ok){document.getElementById("app").innerHTML='<div class="gate">Could not load the protected enrollment workspace: '+esc(res.d.error||res.status)+'</div>';return;}
  PATIENTS=res.d.patients||[];ENROLLMENTS=res.d.enrollments||[];
  if(FIXED_PATIENT&&FIXED_PROGRAM)EXISTING=ENROLLMENTS.filter(function(item){return item.bhwPatientId===FIXED_PATIENT&&item.program===FIXED_PROGRAM;})[0]||null;
  render();document.getElementById("statusbar").hidden=false;
}

function render(){
  var patientOptions='<option value="">Choose a Registry patient…</option>'+PATIENTS.map(function(patient){return '<option value="'+esc(patient.bhwPatientId)+'"'+((FIXED_PATIENT||EXISTING&&EXISTING.bhwPatientId)===patient.bhwPatientId?' selected':'')+'>'+esc(patient.name)+' · '+esc(patient.bhwPatientId)+' · DOB '+esc(patient.dob||"not recorded")+'</option>';}).join("");
  var status=EXISTING&&EXISTING.status||"potential";
  var statusOptions=[["potential","Potential / prospective"],["screening","Screening in progress"],["provider-review","Provider review"],["ready","Ready to activate"],["active","Active enrollment"],["paused","Paused"],["declined","Patient declined"],["not-eligible","Not eligible"],["ended","Ended"]];
  var programHtml=PROGRAMS.map(function(program){var checked=FIXED_PROGRAM?program===FIXED_PROGRAM:false;return '<label class="program"><input type="checkbox" name="program" value="'+program+'"'+(checked?' checked':'')+(FIXED_PROGRAM?' disabled':'')+' onchange="renderBranches()">'+program+'</label>';}).join("");
  var html='<header><div><div class="sub">BHW Care Management</div><h1>Care Program Intake &amp; Enrollment</h1><p style="margin:4px 0 0;color:var(--soft);font-size:11px">Built from the current BHW Care Program SOP intake, enrollment, care-plan, risk, and activation workflow.</p></div><a class="btn sec" href="/bhw-care-program-sop.html" target="_blank" style="text-decoration:none">Open SOP</a></header>'+
    '<div class="intro"><b>'+(SYNTHETIC_ACCEPTANCE?'Controlled Admin-only synthetic acceptance — no real patient chart is in use.':'One Registry patient, one cumulative record per program. Signed-in support and care-management staff may maintain it.')+'</b> Save incomplete work as Potential or Screening. Choosing Active does not bypass the rules: the server will reject activation until the complete readiness record can be read back from BHW Cloud.</div>'+
    '<div class="steps">'+["Patient","Identity","Coverage","Assessment","Program","Approval","Care plan","Risk"].map(function(x,i){return '<div class="step"><b>'+(i+1)+'</b>'+x+'</div>';}).join("")+'</div>'+
    section(1,"Registry patient and program status","Potential records do not create billable monthly work.",'<div class="grid"><div class="field span2"><label for="patient">Protected Patient Registry record</label><select id="patient"'+(FIXED_PATIENT?' disabled':'')+'>'+patientOptions+'</select></div><div class="field"><label for="status">Enrollment status</label><select id="status">'+statusOptions.map(function(o){return '<option value="'+o[0]+'"'+(status===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join("")+'</select></div></div><div class="field" style="margin-top:9px"><label>Programs — choose every program being assessed</label><div class="programs">'+programHtml+'</div></div>')+
    section(2,"Identity, referral, and communication","Verify two identifiers before screening, enrollment, messaging, or merging.",'<div class="checks">'+check("intake.identityReferral.registryIdentityVerified","Two approved identifiers verified against this Registry patient")+'</div><div class="grid" style="margin-top:9px">'+field("intake.identityReferral.identifiersVerified","Identifiers verified")+field("intake.identityReferral.referralSource","Referral source")+field("intake.identityReferral.referralDate","Referral date","date")+field("intake.identityReferral.referralConcern","Referral concern","textarea",null,"full")+field("intake.identityReferral.preferredName","Preferred name")+field("intake.identityReferral.language","Language")+field("intake.identityReferral.communicationMethod","Preferred communication")+field("intake.identityReferral.bestContactTime","Best contact time")+field("intake.identityReferral.accessibilityNeeds","Accessibility needs","textarea",null,"span2")+'</div>')+
    section(3,"Coverage and duplicate-service review","Preserve each coverage period and keep eligibility prospective when current payer rules are unclear.",'<div class="grid">'+field("intake.coverageDuplication.payer","Payer")+field("intake.coverageDuplication.plan","Plan")+field("intake.coverageDuplication.memberId","Member ID")+field("intake.coverageDuplication.effectiveDate","Effective date","date")+field("intake.coverageDuplication.endDate","End date","date")+field("intake.coverageDuplication.secondaryCoverage","Secondary coverage")+field("intake.coverageDuplication.qmbStatus","QMB status","select",[["","Unknown / not assessed"],["verified","Verified QMB"],["not-qmb","Not QMB"],["not-applicable","Not applicable"]])+field("intake.coverageDuplication.verificationStatus","Coverage verification","select",[["unknown","Unknown"],["verified","Verified"],["needs-review","Needs review"],["inactive","Inactive"]])+field("intake.coverageDuplication.checkedAt","Checked date","date")+'</div><div class="checks">'+check("intake.coverageDuplication.changedThisYear","Coverage changed this year")+check("intake.coverageDuplication.duplicationChecked","Other practitioner, vendor, ACO, model, and plan services checked")+'</div><div class="grid" style="margin-top:9px">'+field("intake.coverageDuplication.duplicationDetails","Duplicate-service findings","textarea",null,"full")+'</div>')+
    section(4,"Common intake assessment","Record objective information, patient goals, clinical and utilization needs, medications, behavioral health, and social access.",'<div class="grid">'+field("intake.goalsCareTeam.patientPriority","What matters most now","textarea")+field("intake.goalsCareTeam.desiredOutcome","Patient-defined outcome","textarea")+field("intake.goalsCareTeam.careTeam","Care team and caregivers","textarea")+field("intake.goalsCareTeam.authorizedParticipants","Authorized participants","textarea")+field("intake.clinicalUtilization.activeConditions","Active conditions","textarea")+field("intake.clinicalUtilization.expectedDurationAndRisk","Expected duration and individual risk","textarea")+field("intake.clinicalUtilization.recentUtilization","ED, hospital, SNF, urgent, missed follow-up, transitions","textarea")+field("intake.clinicalUtilization.coordinationNeeds","Symptoms, function, cognition, tests, and treatment changes","textarea")+field("intake.medicationSelfManagement.concerns","Medication concerns","textarea")+field("intake.medicationSelfManagement.reconciliationDate","Medication reconciliation date","date")+field("intake.medicationSelfManagement.reconciliationSource","Medication source")+field("intake.medicationSelfManagement.selfManagement","Self-management and caregiver support","textarea")+field("intake.behavioralHealth.conditionAndImpact","Behavioral condition and functional effect","textarea")+field("intake.behavioralHealth.measuresAndResponse","Validated measures and response","textarea")+field("intake.behavioralHealth.safetyStatus","Current safety status","textarea")+field("intake.behavioralHealth.urgentAction","Urgent pathway action, if needed","textarea")+field("intake.socialAccess.needs","Social and access needs","textarea")+field("intake.socialAccess.treatmentImpact","How needs affect diagnosis or treatment","textarea")+field("intake.socialAccess.priorAttempts","What has been tried","textarea")+field("intake.socialAccess.resourcePlan","Resources and closed-loop referral plan","textarea",null,"span2")+'</div>')+
    section(5,"Program-specific screening branches","Each selected program gets its own durable patient-program record.",'<div id="branches"></div><div class="grid" style="margin-top:9px">'+field("programBranch.eligibilityReason","Potential eligibility reason","textarea")+field("programBranch.medicalNecessity","Patient-specific medical necessity","textarea",null,"span2")+'</div>')+
    section(6,"Practitioner decision, initiating visit, and annual consent","The referral source may complete screening; the billing practitioner confirms eligibility and medical necessity.",'<div class="grid">'+field("practitionerReview.status","Practitioner decision","select",[["pending","Pending"],["more-information","More information needed"],["approved","Potentially meets / approved"],["not-eligible","Does not currently meet"],["held","Held"]])+field("practitionerReview.reviewer","Billing practitioner")+field("practitionerReview.reviewedAt","Decision date","date")+field("practitionerReview.evidenceReference","Decision / encounter reference")+field("practitionerReview.rationale","Decision rationale","textarea",null,"span2")+field("initiatingVisit.status","Initiating visit","select",[["missing","Decision missing"],["complete","Complete"],["not-required","Not required"]])+field("initiatingVisit.date","Visit date","date")+field("initiatingVisit.practitioner","Visit practitioner")+field("initiatingVisit.encounterReference","Encounter reference")+field("initiatingVisit.findings","Required visit findings","textarea",null,"span2")+field("consent.status","Consent","select",[["missing","Missing"],["current","Current"],["declined","Declined"],["revoked","Revoked"]])+field("consent.method","Consent method","select",[["","Not recorded"],["verbal","Verbal"],["written","Written"],["electronic","Electronic"]])+field("consent.date","Consent date","date")+field("consent.obtainedBy","Obtained by")+field("consent.reviewDue","Annual review / renewal due","date")+field("consent.evidenceReference","Consent evidence reference")+'</div>')+
    section(7,"Care plan, assigned team, education, and combination review","Create the Whole Person Care Plan and each selected program module before activation.",'<div class="grid">'+field("carePlan.status","Whole Person Care Plan","select",[["missing","Missing"],["draft","Draft"],["active","Approved and active"]])+field("carePlan.reference","Care-plan reference")+field("carePlan.version","Version")+field("carePlan.approvedAt","Approval date","date")+field("carePlan.sharedAt","Patient-copy date","date")+field("carePlan.deliveryMethod","Delivery method")+field("carePlan.moduleSummary","Program module goals, actions, measures, and revisions","textarea",null,"full")+field("assignment.assignedPerson","Assigned care-team person")+field("assignment.billingPractitioner","Billing practitioner")+field("assignment.supervisingPractitioner","Supervising practitioner")+field("assignment.staffQualificationReference","Staff qualification / scope reference")+field("assignment.contactCadence","Contact cadence")+field("assignment.nextContact","Next contact","date")+field("assignment.careConnectInstructions","Care Connect and routine-contact instructions","textarea")+field("assignment.escalationPlan","After-hours, 988, 911, and escalation plan","textarea")+field("intake.participationEducation.understandsProgram","Patient understanding","textarea")+field("intake.participationEducation.digitalAbility","Care Connect, HTML, or device ability","textarea")+field("intake.participationEducation.trainingNeeds","Training or caregiver help","textarea")+field("intake.participationEducation.patientQuestions","Remaining questions","textarea")+'</div><div class="checks">'+check("carePlan.shared","Care plan shared")+check("intake.participationEducation.patientInstructionsProvided","Program and communication instructions provided")+check("intake.participationEducation.urgentInstructionsProvided","After-hours, 988, and 911 limits provided")+check("intake.participationEducation.costSharingDiscussed","Cost sharing, privacy, right to stop, and one-practitioner rule discussed")+check("combinationReview.completed","Program combinations, external model/vendor, and duplicate work reviewed")+'</div><div class="grid" style="margin-top:9px">'+field("combinationReview.findings","Combination-review findings","textarea",null,"span2")+field("combinationReview.reviewedBy","Reviewed by")+field("combinationReview.reviewedAt","Review date","date")+'</div>')+
    section(8,"Six-domain operational risk score","Unknown stays blank and makes the score incomplete. Urgent concerns bypass this score and follow the approved urgent pathway.",'<div class="risk" id="risk"></div><div class="risk-result" id="riskResult">Risk score incomplete</div><div class="grid" style="margin-top:9px">'+field("risk.override.cadence","Clinician-adjusted cadence")+field("risk.override.authorizedBy","Authorized clinician")+field("risk.override.reason","Override reason")+field("risk.override.effectiveDate","Effective date","date")+field("risk.override.reviewDate","Review date","date")+'</div>');
  document.getElementById("app").innerHTML=html;
  document.getElementById("patient").addEventListener("change",prefillPatient);
  var consent=document.querySelector('[data-path="consent.date"]');if(consent)consent.addEventListener("change",suggestConsentDue);
  renderBranches();renderRisk();prefillPatient(true);
}

function selectedPrograms(){return Array.from(document.querySelectorAll('input[name="program"]:checked')).map(function(input){return input.value;});}
function renderBranches(){var target=document.getElementById("branches");if(!target)return;var programs=selectedPrograms();target.innerHTML=programs.length?programs.map(function(program){var value=EXISTING&&EXISTING.program===program?EXISTING.programBranch&&EXISTING.programBranch.answers||"":"",module=EXISTING&&EXISTING.program===program?EXISTING.programBranch&&EXISTING.programBranch.carePlanModule||EXISTING.carePlan&&EXISTING.carePlan.moduleSummary||"":"";return '<div class="branch"><b>'+program+' branch</b><p>'+esc(PROGRAM_QUESTIONS[program])+'</p><p><b>Billing / tracking basis:</b> '+esc(PROGRAM_TRACKING[program])+'</p><textarea data-branch="'+program+'" placeholder="Answer every question; use Unknown, Not asked, Patient declined, or Not applicable instead of leaving the meaning ambiguous.">'+esc(value)+'</textarea><textarea data-module="'+program+'" style="margin-top:7px" placeholder="Program-specific care-plan module: goals, actions, measures, assigned work, and review plan.">'+esc(module)+'</textarea></div>';}).join(""):'<div class="missing">Choose at least one program to display its screening branch.</div>';}

function renderRisk(){var target=document.getElementById("risk");target.innerHTML=RISK.map(function(item){var base="risk.components."+item[0], rating=at(EXISTING,base+".rating");return '<div class="risk-card"><div class="risk-top"><b>'+item[1]+' · '+item[2]+'%</b><select data-path="'+base+'.rating" onchange="updateRisk()"><option value="">Unknown / not assessed</option>'+[0,1,2,3,4].map(function(n){return '<option value="'+n+'"'+(String(rating)===String(n)?' selected':'')+'>'+n+' · '+["No added risk","Mild","Moderate","High","Very high"][n]+'</option>';}).join("")+'</select></div><input data-path="'+base+'.reason" value="'+esc(at(EXISTING,base+".reason"))+'" placeholder="Patient-specific reason"><input data-path="'+base+'.sourceDate" type="date" value="'+esc(String(at(EXISTING,base+".sourceDate")).slice(0,10))+'"><input data-path="'+base+'.reviewer" value="'+esc(at(EXISTING,base+".reviewer"))+'" placeholder="Reviewer"></div>';}).join("");updateRisk();}
function updateRisk(){var total=0,complete=true;RISK.forEach(function(item){var el=document.querySelector('[data-path="risk.components.'+item[0]+'.rating"]');if(!el||el.value==="")complete=false;else total+=(Number(el.value)/4)*item[2];});var score=complete?Math.round(total):null;var cadence=score==null?"Risk score incomplete":score>=75?"Weekly or clinician-adjusted":score>=50?"Approximately every 2 weeks":score>=25?"At least monthly":"Routine or program-defined";document.getElementById("riskResult").textContent=score==null?cadence:"Score "+score+" / 100 · "+cadence;}

function prefillPatient(keepExisting){if(EXISTING||keepExisting&&FIXED_PATIENT)return;var patient=PATIENTS.filter(function(item){return item.bhwPatientId===document.getElementById("patient").value;})[0];if(!patient)return;var map={"intake.identityReferral.preferredName":patient.preferredName||"","intake.coverageDuplication.payer":patient.payer||"","intake.coverageDuplication.plan":patient.insurance||patient.payer||"","intake.coverageDuplication.memberId":patient.memberId||""};Object.keys(map).forEach(function(path){var el=document.querySelector('[data-path="'+path+'"]');if(el&&!el.value)el.value=map[path];});}
function suggestConsentDue(){var date=document.querySelector('[data-path="consent.date"]'),due=document.querySelector('[data-path="consent.reviewDue"]');if(!date.value||due.value)return;var value=new Date(date.value+'T12:00:00Z');value.setUTCFullYear(value.getUTCFullYear()+1);due.value=value.toISOString().slice(0,10);}

function setDeep(target,path,value){var keys=path.split("."),cursor=target;keys.forEach(function(key,index){if(index===keys.length-1)cursor[key]=value;else cursor=cursor[key]||(cursor[key]={});});}
function recordFor(program){var record={status:document.getElementById("status").value};document.querySelectorAll("[data-path]").forEach(function(el){var value=el.type==="checkbox"?el.checked:el.value;if(el.type==="number"&&value!=="")value=Number(value);setDeep(record,el.dataset.path,value);});var branch=document.querySelector('[data-branch="'+program+'"]'),module=document.querySelector('[data-module="'+program+'"]');record.programBranch=record.programBranch||{};record.programBranch.answers=branch?branch.value:"";record.programBranch.carePlanModule=module?module.value:"";record.programBranch.trackingBasis=PROGRAM_TRACKING[program]||"";record.carePlan=record.carePlan||{};record.carePlan.moduleSummary=record.programBranch.carePlanModule;return record;}

async function saveEnrollment(){var patient=document.getElementById("patient").value,programs=selectedPrograms(),button=document.getElementById("saveButton"),state=document.getElementById("saveState");if(!patient){state.className="save-state bad";state.textContent="Not saved · choose a Registry patient";return;}if(!programs.length){state.className="save-state bad";state.textContent="Not saved · choose at least one program";return;}button.disabled=true;button.textContent="Saving…";state.className="save-state";state.textContent="Saving to BHW Cloud…";var failures=[],saved=[];for(var i=0;i<programs.length;i++){var program=programs[i],res=await api("care-program-enrollment",{action:"save",bhwPatientId:patient,program:program,record:recordFor(program),syntheticAcceptance:SYNTHETIC_ACCEPTANCE});if(res.ok&&res.d.verified){saved.push(program);if(FIXED_PROGRAM===program)EXISTING=res.d.enrollment;}else failures.push(program+": "+(res.d.error||res.status)+(res.d.gaps&&res.d.gaps.length?" Missing "+res.d.gaps.join(", "):""));}button.disabled=false;button.textContent="Save enrollment record";if(saved.length){window.parent.postMessage({type:"care-program-enrollment-saved",patient:patient,programs:saved},location.origin);}if(failures.length){state.className="save-state bad";state.textContent=(saved.length?"Partially saved · ":"Not saved · ")+failures.join(" | ");}else{state.className="save-state ok";state.textContent="Saved to BHW Cloud and read back · "+new Date().toLocaleString();}}
function closeFrame(){window.parent.postMessage({type:"care-program-enrollment-close"},location.origin);}
load();
</script>
